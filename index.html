"O sangue <strong>represa a montante do VE<\/strong>, nos pulmões."}, {"f": "Fisiopatologia da IC direita", "v": "O sangue <strong>represa a montante do VD<\/strong>, na circulação venosa sistêmica."}], "multipla": [{"p": "Paciente com dispneia, ortopneia e estertores. Qual o quadro?", "o": ["IC direita, por congestão pulmonar", "IC direita, por congestão sistêmica", "IC esquerda, por congestão pulmonar", "IC esquerda, por congestão sistêmica"], "c": 2, "e": "Dispneia, ortopneia e estertores são congestão pulmonar da IC esquerda."}, {"p": "Paciente com edema de membros inferiores, turgência jugular e hepatomegalia. Onde o sangue está represado?", "o": ["A jusante da aorta", "A montante do VE, nos pulmões", "Apenas nos capilares pulmonares", "A montante do VD, na circulação venosa sistêmica"], "c": 3, "e": "A IC direita represa o sangue a montante do VD, na circulação venosa sistêmica."}], "vf": [{"a": "Turgência jugular e hepatomegalia são manifestações típicas da IC direita.", "v": true, "e": "São sinais de congestão sistêmica."}, {"a": "Na IC esquerda o sangue represa a montante do VD, na circulação sistêmica.", "v": false, "e": "Na IC esquerda o sangue represa a montante do VE, nos pulmões."}]}, {"id": "B1-5", "parte": 2, "bloco": "AE em Distúrbios Cardiovasculares", "tema": "cardio", "num": "5", "pergunta": "Descreva os quatro níveis da Classificação Funcional da NYHA e explique como essa escala auxilia na avaliação do prognóstico e do manejo terapêutico de pacientes com insuficiência cardíaca.", "resposta": "<table class=\"t\">\n<tr><th>Classe<\/th><th>Característica<\/th><\/tr>\n<tr><td>NYHA I<\/td><td>Sem limitação para atividades comuns<\/td><\/tr>\n<tr><td>NYHA II<\/td><td>Limitação leve, sintomas em atividades comuns<\/td><\/tr>\n<tr><td>NYHA III<\/td><td>Limitação importante, sintomas em atividades menores que as comuns<\/td><\/tr>\n<tr><td>NYHA IV<\/td><td>Sintomas em repouso, incapaz de realizar qualquer atividade sem desconforto<\/td><\/tr>\n<\/table>\n<p>Quanto maior a classe, pior o prognóstico e mais intensiva a terapêutica necessária, orientando decisões como otimização medicamentosa, indicação de dispositivos ou transplante.<\/p>", "fonte": "New York Heart Association", "flashcards": [{"f": "NYHA I", "v": "<strong>Sem limitação<\/strong> para atividades comuns."}, {"f": "NYHA II", "v": "<strong>Limitação leve<\/strong>, com sintomas em atividades comuns."}, {"f": "NYHA III", "v": "<strong>Limitação importante<\/strong>, sintomas em atividades menores que as comuns."}, {"f": "NYHA IV", "v": "Sintomas <strong>em repouso<\/strong>, incapaz de realizar qualquer atividade sem desconforto."}], "multipla": [{"p": "Paciente com sintomas em repouso e incapaz de qualquer atividade sem desconforto. Qual a classe NYHA?", "o": ["Classe II", "Classe III", "Classe IV", "Classe I"], "c": 2, "e": "NYHA IV é sintoma em repouso."}, {"p": "Qual a relação entre a classe NYHA e o prognóstico?", "o": ["Quanto maior a classe, melhor o prognóstico", "Quanto maior a classe, pior o prognóstico e mais intensiva a terapêutica", "A classe não influencia o manejo", "Só a classe I exige dispositivos"], "c": 1, "e": "Classes maiores indicam pior prognóstico e terapêutica mais intensiva, como otimização medicamentosa, dispositivos ou transplante."}], "vf": [{"a": "Na NYHA III, os sintomas surgem em atividades menores que as comuns.", "v": true, "e": "Essa é a definição da classe III."}, {"a": "Na NYHA II não há nenhuma limitação para atividades comuns.", "v": false, "e": "Sem limitação é a NYHA I; na II há limitação leve com sintomas em atividades comuns."}]}, {"id": "B1-6", "parte": 2, "bloco": "AE em Distúrbios Cardiovasculares", "tema": "cardio", "num": "6", "pergunta": "O que significa o termo \"tempo porta-balão\" no contexto da Intervenção Coronariana Percutânea (ICP) primária e qual a meta de tempo recomendada para que o fluxo coronário seja restabelecido mecanicamente?", "resposta": "<p><strong>Tempo porta-balão<\/strong> é o intervalo entre a chegada do paciente ao hospital e a insuflação do balão na ICP primária, restabelecendo o fluxo coronário.<\/p>\n<p>Meta: <strong>até 90 minutos<\/strong> em hospital com serviço de hemodinâmica; <strong>até 120 minutos<\/strong> quando é necessária transferência para outro serviço.<\/p>", "fonte": "Diretriz SBC IAM com supra ST", "flashcards": [{"f": "O que é o tempo porta-balão?", "v": "Intervalo entre a <strong>chegada do paciente ao hospital<\/strong> e a <strong>insuflação do balão<\/strong> na ICP primária."}, {"f": "Meta do porta-balão com hemodinâmica no local", "v": "<strong>Até 90 minutos<\/strong>."}, {"f": "Meta do porta-balão com transferência", "v": "<strong>Até 120 minutos<\/strong>, quando é necessária transferência para outro serviço."}, {"f": "Objetivo da ICP primária", "v": "Restabelecer mecanicamente o <strong>fluxo coronário<\/strong>."}], "multipla": [{"p": "Qual a meta do tempo porta-balão em hospital com serviço de hemodinâmica?", "o": ["Até 90 minutos", "Até 60 minutos", "Até 120 minutos", "Até 30 minutos"], "c": 0, "e": "Em hospital com hemodinâmica a meta é até 90 minutos."}, {"p": "Quando a meta do porta-balão passa a ser até 120 minutos?", "o": ["Quando há transferência para outro serviço", "Quando o paciente chega de ambulância", "Quando o ECG é normal", "Quando se usa fibrinólise no local"], "c": 0, "e": "Até 120 minutos é a meta quando é necessária transferência."}], "vf": [{"a": "O tempo porta-balão vai da chegada ao hospital até a insuflação do balão na ICP primária.", "v": true, "e": "Essa é a definição."}, {"a": "A meta do porta-balão é até 120 minutos em hospital com hemodinâmica própria.", "v": false, "e": "Com hemodinâmica no local a meta é até 90 minutos; 120 minutos vale quando há transferência."}]}, {"id": "B1-7", "parte": 2, "bloco": "AE em Distúrbios Cardiovasculares", "tema": "cardio", "num": "7", "pergunta": "Um paciente com suspeita de IAM apresenta saturação de oxigênio de 92% e dor persistente. Descreva as ações imediatas recomendadas, justificando o uso da morfina não apenas para a dor, mas também para seus efeitos na pré-carga e pós-carga.", "resposta": "<p>Com SpO2 de <strong>92%<\/strong>, a <strong>oxigenoterapia não é indicada<\/strong>: a diretriz recomenda O2 suplementar apenas se SpO2 menor que 90%; oxigênio em normoxêmico pode causar vasoconstrição coronariana e não traz benefício.<\/p>\n<p>Ações imediatas: AAS, nitrato (se sem hipotensão), avaliação para reperfusão. A <strong>morfina<\/strong> é usada para dor refratária: além do efeito analgésico, promove <strong>venodilatação<\/strong> (reduz pré-carga) e discreta vasodilatação arterial (reduz pós-carga), diminuindo o consumo de oxigênio miocárdico.<\/p>\n<div class=\"dica\">Atualização: diretrizes recentes restringem a morfina a dor refratária ao tratamento antianginoso otimizado, pois pode retardar a absorção de antiplaquetários orais e mascarar sintomas de piora isquêmica.<\/div>", "fonte": "Diretriz SBC IAM; atualização SCA", "flashcards": [{"f": "Oxigenoterapia no IAM com SpO2 de 92%", "v": "<strong>Não indicada<\/strong>. A diretriz recomenda O2 suplementar apenas se SpO2 <strong>menor que 90%<\/strong>."}, {"f": "Risco do O2 em paciente normoxêmico com IAM", "v": "Pode causar <strong>vasoconstrição coronariana<\/strong> e não traz benefício."}, {"f": "Ações imediatas no IAM (SpO2 92%, dor)", "v": "<strong>AAS<\/strong>, <strong>nitrato<\/strong> (se sem hipotensão) e avaliação para reperfusão."}, {"f": "Efeitos hemodinâmicos da morfina", "v": "<strong>Venodilatação<\/strong> (reduz pré-carga) e discreta vasodilatação arterial (reduz pós-carga), diminuindo o consumo de O2 miocárdico."}], "multipla": [{"p": "Paciente com suspeita de IAM, SpO2 de 92% e dor persistente. Quanto ao oxigênio:", "o": ["Está indicado apenas se houver hipotensão", "Está indicado, pois SpO2 é menor que 95%", "Não está indicado, pois SpO2 não é menor que 90%", "Está indicado, pois SpO2 é menor que 100%"], "c": 2, "e": "O2 suplementar só se SpO2 menor que 90%; em normoxêmico pode causar vasoconstrição coronariana."}, {"p": "Segundo as diretrizes recentes, quando a morfina é usada no IAM?", "o": ["Em toda dor precordial, como primeira escolha", "Para substituir o AAS", "Somente para dor refratária ao antianginoso otimizado", "Para elevar a SpO2"], "c": 2, "e": "A morfina é restrita à dor refratária ao tratamento antianginoso otimizado, pois pode retardar a absorção de antiplaquetários orais e mascarar piora isquêmica."}], "vf": [{"a": "A morfina causa venodilatação, reduzindo a pré-carga.", "v": true, "e": "Isso, com a discreta vasodilatação arterial, reduz o consumo de O2 miocárdico."}, {"a": "Com SpO2 de 92% no IAM, a diretriz indica oxigenoterapia suplementar.", "v": false, "e": "A diretriz recomenda O2 apenas se SpO2 menor que 90%."}]}, {"id": "B1-8", "parte": 2, "bloco": "AE em Distúrbios Cardiovasculares", "tema": "cardio", "num": "8", "pergunta": "Uma equipe médica avalia a administração de terapia trombolítica para um paciente com IAM em um hospital sem laboratório de cateterismo. Identifique ao menos três contra indicações absolutas que impediriam o uso de fibrinolíticos (como alteplase) e obrigariam a transferência para ICP primária.", "resposta": "<ul>\n<li>Qualquer <strong>sangramento intracraniano prévio<\/strong><\/li>\n<li><strong>AVC isquêmico<\/strong> nos últimos 3 meses<\/li>\n<li><strong>Trauma importante de cabeça/face<\/strong> nos últimos 3 meses<\/li>\n<li><strong>Sangramento ativo<\/strong> ou diátese hemorrágica (exceto menstruação)<\/li>\n<li><strong>Dissecção aguda de aorta<\/strong><\/li>\n<\/ul>", "fonte": "Diretriz SBC IAM com supra ST", "flashcards": [{"f": "Contraindicação absoluta à fibrinólise: sangramento", "v": "Qualquer <strong>sangramento intracraniano prévio<\/strong>."}, {"f": "Contraindicação absoluta: AVC isquêmico", "v": "AVC isquêmico nos <strong>últimos 3 meses<\/strong>."}, {"f": "Contraindicação absoluta: trauma", "v": "Trauma importante de <strong>cabeça ou face<\/strong> nos últimos 3 meses."}, {"f": "Outras contraindicações absolutas", "v": "<strong>Sangramento ativo<\/strong> ou diátese hemorrágica (exceto menstruação) e <strong>dissecção aguda de aorta<\/strong>."}], "multipla": [{"p": "Qual situação contraindica de forma absoluta a fibrinólise no IAM?", "o": ["Uso prévio de AAS", "Sangramento intracraniano prévio", "Menstruação", "Dor persistente"], "c": 1, "e": "Qualquer sangramento intracraniano prévio é contraindicação absoluta."}, {"p": "Paciente com IAM em hospital sem cateterismo, com dissecção aguda de aorta. Qual a conduta?", "o": ["Não fibrinolisar e transferir para ICP primária", "Dobrar a dose do fibrinolítico", "Fibrinólise com alteplase", "Apenas observar"], "c": 0, "e": "Dissecção aguda de aorta contraindica a fibrinólise e obriga a transferência para ICP primária."}], "vf": [{"a": "AVC isquêmico nos últimos 3 meses é contraindicação absoluta à fibrinólise.", "v": true, "e": "Consta entre as contraindicações absolutas."}, {"a": "Menstruação é contraindicação absoluta à fibrinólise.", "v": false, "e": "O sangramento ativo contraindica, exceto menstruação."}]}, {"id": "A2-1", "parte": 2, "bloco": "AE no Paciente com Choque Circulatório", "tema": "choque", "num": "1", "pergunta": "Defina choque circulatório e explique a diferença entre falência macrocirculatória e falência microcirculatória, relacionando com a dinâmica de evolução.", "resposta": "<p>Choque circulatório é a <strong>falência circulatória aguda, generalizada e potencialmente fatal<\/strong>, associada a utilização inadequada de oxigênio a nível celular.<\/p>\n<ul>\n<li><strong>Falência macrocirculatória<\/strong>: comprometimento de débito cardíaco, tônus vascular e/ou volemia; é a expressão clínica mais precoce e acessível, e define os subtipos de choque.<\/li>\n<li><strong>Falência microcirculatória<\/strong>: incapacidade de extração/utilização de O2 pela célula, mesmo com entrega mantida; tende a predominar em fases mais avançadas ou no choque distributivo, sendo mais difícil de identificar à beira do leito.<\/li>\n<\/ul>\n<p>Na evolução do choque, a falência macrocirculatória costuma ser detectada primeiro; se não corrigida, a disfunção microcirculatória se instala e perpetua o dano celular mesmo após correção hemodinâmica aparente.<\/p>", "fonte": "Revisão Narrativa (Acta Med Port, Dantas et al., 2021)", "flashcards": [{"f": "Choque circulatório (definição)", "v": "<strong>Falência circulatória aguda, generalizada e potencialmente fatal<\/strong>, com utilização inadequada de O2 celular."}, {"f": "Falência macrocirculatória", "v": "Comprometimento de <strong>débito cardíaco, tônus vascular e/ou volemia<\/strong>: expressão mais precoce e acessível, define os subtipos."}, {"f": "Falência microcirculatória", "v": "Incapacidade de extração/utilização de O2 pela célula <strong>mesmo com entrega mantida<\/strong>; predomina em fases avançadas ou no distributivo e é difícil de identificar à beira do leito."}, {"f": "Ordem de detecção na evolução do choque", "v": "A macrocirculatória é detectada <strong>primeiro<\/strong>; se não corrigida, a microcirculatória perpetua o dano celular mesmo após correção hemodinâmica aparente."}], "multipla": [{"p": "Qual falência é detectada primeiro na evolução do choque e define os subtipos?", "o": ["Macrocirculatória", "Microcirculatória", "Apenas a mitocondrial", "Nenhuma, pois ambas surgem juntas e são igualmente visíveis"], "c": 0, "e": "A macrocirculatória é a expressão clínica mais precoce e acessível; a microcirculatória é mais difícil de identificar."}, {"p": "Um paciente mantém dano celular mesmo após correção hemodinâmica aparente. Isso se explica por:", "o": ["Falência macrocirculatória isolada", "Hipovolemia residual apenas", "Ausência de lesão celular", "Falência microcirculatória instalada"], "c": 3, "e": "A disfunção microcirculatória perpetua o dano celular mesmo quando a hemodinâmica parece corrigida."}], "vf": [{"a": "A falência microcirculatória tende a predominar em fases avançadas ou no choque distributivo.", "v": true, "e": "É mais difícil de identificar à beira do leito."}, {"a": "A falência macrocirculatória é a incapacidade de a célula extrair O2 apesar de entrega mantida.", "v": false, "e": "Isso descreve a microcirculatória; a macro envolve débito cardíaco, tônus vascular e volemia."}]}, {"id": "A2-2", "parte": 2, "bloco": "AE no Paciente com Choque Circulatório", "tema": "choque", "num": "2", "pergunta": "Descreva os quatro tipos principais de choque (hipovolêmico, cardiogênico, obstrutivo e distributivo), indicando o mecanismo fisiopatológico predominante de cada um e ao menos um exemplo de causa.", "resposta": "<table class=\"t\">\n<tr><th>Tipo<\/th><th>Mecanismo predominante<\/th><th>Exemplo de causa<\/th><\/tr>\n<tr><td>Hipovolêmico<\/td><td>Diminuição do retorno venoso por perda de fluido<\/td><td>Hemorragia maciça, desidratação grave<\/td><\/tr>\n<tr><td>Cardiogênico<\/td><td>Falência da bomba cardíaca (sistólica, diastólica ou mecânica)<\/td><td>Infarto agudo do miocárdio<\/td><\/tr>\n<tr><td>Obstrutivo<\/td><td>Obstrução súbita do fluxo sanguíneo<\/td><td>Tromboembolismo pulmonar, tamponamento cardíaco, pneumotórax hipertensivo<\/td><\/tr>\n<tr><td>Distributivo<\/td><td>Perda do tônus vascular (vasoplegia) por inflamação ou lesão do SNC<\/td><td>Sepse, anafilaxia, lesão neurogênica<\/td><\/tr>\n<\/table>", "fonte": "Revisão Narrativa (Acta Med Port, Dantas et al., 2021)", "flashcards": [{"f": "Mecanismo do choque hipovolêmico", "v": "<strong>Diminuição do retorno venoso por perda de fluido<\/strong>. Causas: hemorragia maciça, desidratação grave."}, {"f": "Mecanismo do choque cardiogênico", "v": "<strong>Falência da bomba cardíaca<\/strong> (sistólica, diastólica ou mecânica). Exemplo: infarto agudo do miocárdio."}, {"f": "Mecanismo do choque obstrutivo", "v": "<strong>Obstrução súbita do fluxo sanguíneo<\/strong>. Exemplos: TEP, tamponamento cardíaco, pneumotórax hipertensivo."}, {"f": "Mecanismo do choque distributivo", "v": "<strong>Perda do tônus vascular (vasoplegia)<\/strong> por inflamação ou lesão do SNC. Exemplos: sepse, anafilaxia, lesão neurogênica."}], "multipla": [{"p": "Qual tipo de choque tem como mecanismo a falência da bomba cardíaca, com o infarto agudo do miocárdio como exemplo?", "o": ["Obstrutivo", "Distributivo", "Hipovolêmico", "Cardiogênico"], "c": 3, "e": "O cardiogênico decorre de falência da bomba; no obstrutivo há obstrução ao fluxo."}, {"p": "Qual par associa corretamente o tipo de choque e sua causa?", "o": ["Hipovolêmico: infarto agudo do miocárdio", "Obstrutivo: hemorragia maciça", "Distributivo: anafilaxia", "Cardiogênico: pneumotórax hipertensivo"], "c": 2, "e": "Anafilaxia causa vasoplegia (distributivo); os demais pares trocam mecanismos."}], "vf": [{"a": "O choque distributivo resulta da perda do tônus vascular (vasoplegia), como na sepse e na anafilaxia.", "v": true, "e": "A inflamação ou lesão do SNC leva à vasodilatação."}, {"a": "O choque hipovolêmico decorre de falência da bomba cardíaca, como no infarto agudo do miocárdio.", "v": false, "e": "O hipovolêmico decorre de perda de fluido; a falência de bomba caracteriza o cardiogênico."}]}, {"id": "A2-3", "parte": 2, "bloco": "AE no Paciente com Choque Circulatório", "tema": "choque", "num": "3", "pergunta": "Diferencie os três estágios evolutivos do choque, destacando os principais sinais clínicos e o prognóstico de cada fase.", "resposta": "<table class=\"t\">\n<tr><th>Estágio<\/th><th>Sinais clínicos<\/th><th>Prognóstico<\/th><\/tr>\n<tr><td>Compensado<\/td><td>Taquicardia, vasoconstrição periférica, PA ainda normal (mecanismos neuro-hormonais mantêm perfusão de órgãos vitais)<\/td><td>Reversível com intervenção precoce<\/td><\/tr>\n<tr><td>Descompensado (progressivo)<\/td><td>Hipotensão franca, oligúria, alteração do nível de consciência, acidose metabólica, lactato elevado<\/td><td>Reversível, mas exige intervenção agressiva imediata<\/td><\/tr>\n<tr><td>Irreversível (refratário)<\/td><td>Falência de múltiplos órgãos, lesão celular disseminada, choque não responde a volume/vasopressor<\/td><td>Mortalidade muito alta, dano celular já não revertido pela correção hemodinâmica<\/td><\/tr>\n<\/table>", "fonte": "Literatura de apoio (fora da pasta de referências)", "flashcards": [{"f": "Choque compensado: sinais e prognóstico", "v": "Taquicardia, vasoconstrição periférica e <strong>PA ainda normal<\/strong>. <strong>Reversível<\/strong> com intervenção precoce."}, {"f": "Choque descompensado (progressivo): sinais", "v": "<strong>Hipotensão franca<\/strong>, oligúria, alteração da consciência, acidose metabólica e lactato elevado."}, {"f": "Prognóstico do choque descompensado", "v": "<strong>Reversível<\/strong>, mas exige intervenção agressiva imediata."}, {"f": "Choque irreversível (refratário)", "v": "Falência de múltiplos órgãos, lesão celular disseminada, <strong>não responde a volume/vasopressor<\/strong>; mortalidade muito alta."}], "multipla": [{"p": "Paciente taquicárdico, com extremidades frias e PA ainda normal. Qual o estágio do choque?", "o": ["Descompensado", "Compensado", "Irreversível", "Refratário"], "c": 1, "e": "Taquicardia e vasoconstrição com PA normal indicam choque compensado, reversível com intervenção precoce."}, {"p": "Qual estágio do choque não responde a volume nem a vasopressor e cursa com falência de múltiplos órgãos?", "o": ["Irreversível (refratário)", "Compensado", "Descompensado (progressivo)", "Inicial reversível"], "c": 0, "e": "Estágio irreversível: lesão celular disseminada, que já não se reverte pela correção hemodinâmica."}], "vf": [{"a": "No choque compensado a pressão arterial ainda pode estar normal.", "v": true, "e": "Os mecanismos neuro-hormonais mantêm a perfusão de órgãos vitais."}, {"a": "O choque descompensado é irreversível e não exige intervenção agressiva.", "v": false, "e": "O descompensado ainda é reversível, mas exige intervenção agressiva imediata."}]}, {"id": "A2-4", "parte": 2, "bloco": "AE no Paciente com Choque Circulatório", "tema": "choque", "num": "4", "pergunta": "O que é a \"Tríade Letal\" no choque hemorrágico grave? Explique", "resposta": "<p>É a associação de três distúrbios que se retroalimentam e agravam o prognóstico do choque hemorrágico: <strong>hipotermia<\/strong>, <strong>acidose metabólica<\/strong> e <strong>coagulopatia<\/strong>. A hipotermia prejudica a função das plaquetas e das enzimas da cascata de coagulação, favorecendo sangramento; o sangramento contínuo gera hipoperfusão e acidose; e a acidose, por sua vez, compromete ainda mais a coagulação, fechando um ciclo vicioso que aumenta a mortalidade se não interrompido precocemente (aquecimento, correção volêmica e hemocomponentes, controle do foco).<\/p>", "fonte": "Literatura de apoio (fora da pasta de referências)", "flashcards": [{"f": "Tríade letal no choque hemorrágico grave", "v": "<strong>Hipotermia, acidose metabólica e coagulopatia<\/strong>, que se retroalimentam."}, {"f": "Como a hipotermia agrava o choque hemorrágico?", "v": "Prejudica a função das <strong>plaquetas e das enzimas da cascata de coagulação<\/strong>, favorecendo o sangramento."}, {"f": "Como a acidose participa do ciclo vicioso da tríade letal?", "v": "O sangramento causa hipoperfusão e acidose, e a <strong>acidose compromete ainda mais a coagulação<\/strong>."}, {"f": "Como interromper o ciclo da tríade letal?", "v": "Aquecimento, correção volêmica e hemocomponentes, e controle do foco."}], "multipla": [{"p": "A tríade letal do choque hemorrágico é formada por:", "o": ["Hipotermia, acidose metabólica e coagulopatia", "Hipertermia, alcalose metabólica e trombocitose", "Hipotermia, alcalose respiratória e hipercoagulabilidade", "Hipertermia, acidose metabólica e hiperglicemia"], "c": 0, "e": "Os três distúrbios se retroalimentam e aumentam a mortalidade."}, {"p": "Por que a hipotermia agrava o sangramento no choque hemorrágico?", "o": ["Aumenta a produção de fatores de coagulação", "Provoca vasoconstrição que estanca a hemorragia", "Corrige a acidose e melhora a perfusão", "Prejudica a função das plaquetas e das enzimas da coagulação"], "c": 3, "e": "O frio prejudica plaquetas e enzimas da cascata, favorecendo sangramento e fechando o ciclo vicioso."}], "vf": [{"a": "Na tríade letal, a acidose metabólica compromete ainda mais a coagulação.", "v": true, "e": "Isso fecha o ciclo vicioso com hipotermia e sangramento."}, {"a": "A tríade letal do choque hemorrágico inclui hipertermia, acidose e coagulopatia.", "v": false, "e": "O componente térmico é a hipotermia, não a hipertermia."}]}, {"id": "A2-5", "parte": 2, "bloco": "AE no Paciente com Choque Circulatório", "tema": "choque", "num": "5", "pergunta": "O que é Índice de Choque (Shock Index), e explique por que ele é considerado mais sensível do que a avaliação isolada dos sinais vitais para detectar o choque em fases iniciais (choque oculto).", "resposta": "<p>O Índice de Choque é calculado por <strong>FC / PAS<\/strong> (frequência cardíaca dividida pela pressão arterial sistólica), com valor normal em torno de 0,5 a 0,7; valores ≥ 0,9-1,0 sugerem choque.<\/p>\n<p>É mais sensível que sinais vitais isolados porque combina duas variáveis que se compensam mutuamente: um paciente pode manter a PAS normal por taquicardia compensatória, mascarando a hipoperfusão. Ao relacionar as duas variáveis, o índice detecta esse desequilíbrio precocemente, antes que a hipotensão franca apareça (choque oculto/compensado).<\/p>", "fonte": "Literatura de apoio (fora da pasta de referências)", "flashcards": [{"f": "Cálculo do Índice de Choque", "v": "<strong>FC / PAS<\/strong> (frequência cardíaca dividida pela pressão arterial sistólica)."}, {"f": "Valor normal do Índice de Choque", "v": "Em torno de <strong>0,5 a 0,7<\/strong>."}, {"f": "Valor do Índice de Choque que sugere choque", "v": "<strong>≥ 0,9-1,0<\/strong>."}, {"f": "Por que o Índice de Choque é mais sensível que sinais vitais isolados?", "v": "Combina FC e PAS: detecta a <strong>taquicardia compensatória que mascara a hipotensão<\/strong>, revelando o choque oculto/compensado."}], "multipla": [{"p": "Paciente com FC 120 bpm e PAS 100 mmHg. Qual o Índice de Choque e o que sugere?", "o": ["0,8, dentro da normalidade", "1,2, dentro da normalidade", "1,2, sugerindo choque", "0,8, sugerindo choque"], "c": 2, "e": "120/100 = 1,2, acima de 0,9-1,0, o que sugere choque mesmo com PAS aparentemente aceitável."}, {"p": "O Índice de Choque é calculado por:", "o": ["PAS dividida pela FC", "FC dividida pela PAS", "FC dividida pela PAM", "PAD dividida pela FC"], "c": 1, "e": "A fórmula é FC / PAS; inverter os termos leva a valores sem interpretação válida."}], "vf": [{"a": "O Índice de Choque detecta choque oculto porque a taquicardia compensatória pode manter a PAS normal.", "v": true, "e": "Ao relacionar FC e PAS, o índice revela o desequilíbrio antes da hipotensão franca."}, {"a": "O valor normal do Índice de Choque é em torno de 0,9 a 1,0.", "v": false, "e": "O normal é em torno de 0,5 a 0,7; valores ≥ 0,9-1,0 sugerem choque."}]}, {"id": "A2-6", "parte": 2, "bloco": "AE no Paciente com Choque Circulatório", "tema": "choque", "num": "6", "pergunta": "Diferencie os subtipos de choque distributivo (séptico, anafilático e neurogênico) quanto à causa desencadeante e ao mecanismo que leva à vasodilatação e ao represamento periférico do sangue.", "resposta": "<table class=\"t\">\n<tr><th>Subtipo<\/th><th>Causa desencadeante<\/th><th>Mecanismo de vasodilatação<\/th><\/tr>\n<tr><td>Séptico<\/td><td>Infecção (evidência de foco infeccioso)<\/td><td>Liberação de mediadores inflamatórios/citocinas em resposta ao agente infeccioso, com vasoplegia generalizada<\/td><\/tr>\n<tr><td>Anafilático<\/td><td>Reação alérgica prévia (exposição a alérgeno)<\/td><td>Degranulação de mastócitos com liberação de histamina, gerando vasodilatação maciça e aumento da permeabilidade capilar<\/td><\/tr>\n<tr><td>Neurogênico<\/td><td>Lesão do tecido nervoso (ex.: trauma raquimedular)<\/td><td>Perda do tônus simpático vasomotor, sem a taquicardia compensatória esperada<\/td><\/tr>\n<\/table>", "fonte": "Revisão Narrativa (Acta Med Port, Dantas et al., 2021)", "flashcards": [{"f": "Causa e mecanismo do choque séptico distributivo", "v": "Infecção; <strong>mediadores inflamatórios/citocinas<\/strong> causam vasoplegia generalizada."}, {"f": "Causa e mecanismo do choque anafilático", "v": "Reação alérgica por exposição a alérgeno; <strong>degranulação de mastócitos com histamina<\/strong>, vasodilatação maciça e aumento da permeabilidade capilar."}, {"f": "Causa e mecanismo do choque neurogênico", "v": "Lesão do tecido nervoso (ex.: trauma raquimedular); <strong>perda do tônus simpático vasomotor<\/strong>."}, {"f": "Diferença hemodinâmica marcante do choque neurogênico", "v": "<strong>Sem a taquicardia compensatória<\/strong> esperada."}], "multipla": [{"p": "Qual choque distributivo é causado por degranulação de mastócitos com liberação de histamina?", "o": ["Séptico", "Anafilático", "Neurogênico", "Cardiogênico"], "c": 1, "e": "A histamina causa vasodilatação maciça e aumento da permeabilidade capilar no choque anafilático."}, {"p": "Paciente com trauma raquimedular, hipotensão e sem taquicardia compensatória. Qual o tipo de choque?", "o": ["Neurogênico", "Séptico", "Hipovolêmico hemorrágico", "Anafilático"], "c": 0, "e": "Lesão nervosa causa perda do tônus simpático vasomotor, sem a taquicardia esperada."}], "vf": [{"a": "No choque neurogênico há perda do tônus simpático vasomotor, sem a taquicardia compensatória esperada.", "v": true, "e": "A causa é lesão do tecido nervoso, como trauma raquimedular."}, {"a": "O choque séptico decorre da degranulação de mastócitos com liberação de histamina.", "v": false, "e": "Isso é o anafilático; o séptico é causado por mediadores inflamatórios/citocinas em resposta à infecção."}]}, {"id": "A2-7", "parte": 2, "bloco": "AE no Paciente com Choque Circulatório", "tema": "choque", "num": "7", "pergunta": "Compare os três mecanismos de choque obstrutivo, explicando de forma resumida por que cada um impede o enchimento adequado das câmaras cardíacas.", "resposta": "<ul>\n<li><strong>Tromboembolismo pulmonar<\/strong>: obstrução mecânica do fluxo na circulação pulmonar, aumentando a pós-carga do ventrículo direito e impedindo seu esvaziamento adequado.<\/li>\n<li><strong>Tamponamento cardíaco<\/strong>: acúmulo de líquido no espaço pericárdico comprime as câmaras cardíacas de fora para dentro, impedindo o enchimento diastólico (colapso das cavidades direitas).<\/li>\n<li><strong>Pneumotórax hipertensivo<\/strong>: ar sob pressão no espaço pleural desvia o mediastino e comprime as grandes veias e o coração, reduzindo o retorno venoso e o enchimento ventricular.<\/li>\n<\/ul>\n<p>Nos três casos o resultado final é o mesmo: sobrecarga hídrica direita e baixo débito cardíaco por incapacidade de enchimento, e não por falha da bomba ou perda de volume.<\/p>", "fonte": "Revisão Narrativa (Acta Med Port, Dantas et al., 2021)", "flashcards": [{"f": "Mecanismo do TEP como choque obstrutivo", "v": "Obstrução do fluxo na circulação pulmonar, com <strong>aumento da pós-carga do ventrículo direito<\/strong>, impedindo seu esvaziamento."}, {"f": "Mecanismo do tamponamento cardíaco", "v": "Líquido no pericárdio <strong>comprime as câmaras de fora para dentro<\/strong>, impedindo o enchimento diastólico (colapso das cavidades direitas)."}, {"f": "Mecanismo do pneumotórax hipertensivo", "v": "Ar sob pressão desvia o mediastino e <strong>comprime grandes veias e coração<\/strong>, reduzindo retorno venoso e enchimento ventricular."}, {"f": "Resultado comum dos choques obstrutivos", "v": "<strong>Sobrecarga hídrica direita e baixo débito<\/strong> por incapacidade de enchimento, não por falha da bomba ou perda de volume."}], "multipla": [{"p": "Qual mecanismo produz o choque obstrutivo no tamponamento cardíaco?", "o": ["Perda do tônus vascular por mediadores inflamatórios", "Falência sistólica do ventrículo esquerdo por isquemia", "Perda de volume intravascular por hemorragia", "Compressão das câmaras por líquido no pericárdio, impedindo o enchimento diastólico"], "c": 3, "e": "No tamponamento o líquido comprime o coração de fora para dentro; não há falha da bomba nem perda de volume."}, {"p": "No TEP como causa de choque obstrutivo, o que ocorre com o ventrículo direito?", "o": ["Redução da pós-carga, com hiperfluxo pulmonar", "Hipertrofia protetora que melhora o débito", "Aumento da pós-carga, que impede seu esvaziamento adequado", "Perda do tônus vascular sistêmico"], "c": 2, "e": "A obstrução do fluxo pulmonar aumenta a pós-carga do VD e impede seu esvaziamento."}], "vf": [{"a": "No pneumotórax hipertensivo, o ar sob pressão desvia o mediastino e reduz o retorno venoso.", "v": true, "e": "A compressão de grandes veias e coração reduz o enchimento ventricular."}, {"a": "Nos choques obstrutivos o baixo débito decorre de perda de volume e falha da bomba cardíaca.", "v": false, "e": "Decorre de incapacidade de enchimento, não de falha da bomba nem de perda de volume."}]}, {"id": "A2-8", "parte": 2, "bloco": "AE no Paciente com Choque Circulatório", "tema": "choque", "num": "8", "pergunta": "Utilizando a teoria das Necessidades Humanas Básicas de Wanda Horta, cite pelo menos quatro cuidados de enfermagem relacionados às alterações identificadas no choque circulatório, relacionando cada cuidado à necessidade afetada.", "resposta": "<table class=\"t\">\n<tr><th>Necessidade afetada<\/th><th>Cuidado de enfermagem<\/th><\/tr>\n<tr><td>Oxigenação<\/td><td>Monitorar SpO2 e padrão respiratório, ofertar O2 suplementar ou preparar para ventilação assistida<\/td><\/tr>\n<tr><td>Circulação/regulação vascular<\/td><td>Monitorar PA, FC e perfusão periférica; instalar e regular acesso venoso para fluidos e vasopressores<\/td><\/tr>\n<tr><td>Eliminação (urinária)<\/td><td>Controlar débito urinário horário (sonda vesical de demora) como indicador indireto de perfusão renal<\/td><\/tr>\n<tr><td>Percepção/segurança (nível de consciência)<\/td><td>Avaliar nível de consciência de forma seriada (Glasgow) para detectar hipoperfusão cerebral precoce<\/td><\/tr>\n<\/table>", "fonte": "Literatura de apoio (fora da pasta de referências)", "flashcards": [{"f": "Cuidado de enfermagem na necessidade de Oxigenação (Horta) no choque", "v": "Monitorar <strong>SpO2 e padrão respiratório<\/strong>, ofertar O2 suplementar ou preparar para ventilação assistida."}, {"f": "Cuidado de enfermagem na necessidade de Circulação/regulação vascular", "v": "Monitorar <strong>PA, FC e perfusão periférica<\/strong>; instalar e regular acesso venoso para fluidos e vasopressores."}, {"f": "Cuidado de enfermagem na necessidade de Eliminação urinária", "v": "Controlar <strong>débito urinário horário<\/strong> (sonda vesical de demora) como indicador indireto de perfusão renal."}, {"f": "Cuidado de enfermagem na necessidade de Percepção/segurança", "v": "Avaliar o <strong>nível de consciência de forma seriada (Glasgow)<\/strong> para detectar hipoperfusão cerebral precoce."}], "multipla": [{"p": "Qual cuidado atende a necessidade de Eliminação urinária no choque, segundo Horta?", "o": ["Avaliação seriada do Glasgow", "Monitorização da SpO2 e oferta de O2", "Controle do débito urinário horário com sonda vesical de demora", "Instalação de acesso venoso para vasopressores"], "c": 2, "e": "O débito urinário horário é indicador indireto de perfusão renal."}, {"p": "A avaliação seriada do nível de consciência (Glasgow) atende qual necessidade afetada no choque?", "o": ["Oxigenação", "Percepção/segurança", "Eliminação urinária", "Circulação/regulação vascular"], "c": 1, "e": "Detecta precocemente a hipoperfusão cerebral."}], "vf": [{"a": "Monitorar SpO2 e padrão respiratório é cuidado da necessidade de Oxigenação no choque.", "v": true, "e": "Inclui ofertar O2 suplementar ou preparar para ventilação assistida."}, {"a": "O controle do débito urinário horário é cuidado da necessidade de Oxigenação.", "v": false, "e": "Pertence à necessidade de Eliminação urinária, como indicador indireto de perfusão renal."}]}, {"id": "C0-1", "parte": 2, "bloco": "Terapia Infusional", "tema": "infusional", "num": "1", "pergunta": "Descreva as três túnicas que compõem a parede das veias (adventícia, média e íntima), explicando a função de cada camada e por que a túnica íntima é considerada especialmente importante na prevenção de tromboflebite.", "resposta": "<ul>\n<li><strong>Adventícia<\/strong>: camada externa de tecido conjuntivo, dá sustentação estrutural e fixa o vaso aos tecidos vizinhos.<\/li>\n<li><strong>Média<\/strong>: composta por músculo liso e fibras elásticas, permite vasoconstrição/vasodilatação.<\/li>\n<li><strong>Íntima<\/strong>: camada interna, revestida por endotélio liso em contato direto com o sangue e com o cateter.<\/li>\n<\/ul>\n<p>A íntima é a mais relevante na prevenção de tromboflebite porque qualquer lesão do endotélio (punção traumática, cateter de calibre inadequado, movimento do dispositivo) expõe o colágeno subendotelial, ativa a cascata de coagulação e favorece agregação plaquetária e inflamação da parede.<\/p>", "fonte": "Literatura de apoio (fora da pasta de referências) - INS 2021 Standards of Practice.", "flashcards": [{"f": "Adventícia: posição e função", "v": "Camada <strong>externa<\/strong> de tecido conjuntivo: dá sustentação estrutural e fixa o vaso aos tecidos vizinhos."}, {"f": "Média da veia: composição e função", "v": "Músculo liso e fibras elásticas: permite <strong>vasoconstrição e vasodilatação<\/strong>."}, {"f": "Túnica íntima: por que importa na tromboflebite?", "v": "Endotélio liso em contato com o sangue e o cateter. Lesão dele expõe o <strong>colágeno subendotelial<\/strong>, ativa a coagulação e a inflamação."}], "multipla": [{"p": "Qual túnica da veia é a camada interna, revestida por endotélio liso em contato direto com o cateter?", "o": ["Média", "Adventícia", "Íntima", "Subendotelial muscular"], "c": 2, "e": "A íntima é a camada interna, com endotélio liso em contato com o sangue e o cateter."}, {"p": "Após punção traumática, o colágeno subendotelial fica exposto. Qual a consequência descrita para a prevenção de tromboflebite?", "o": ["Ativação da cascata de coagulação, agregação plaquetária e inflamação da parede", "Vasodilatação da média com melhora do fluxo", "Fixação do vaso aos tecidos pela adventícia", "Formação de barreira protetora sobre o endotélio"], "c": 0, "e": "A lesão do endotélio expõe o colágeno, ativa a coagulação e favorece agregação plaquetária e inflamação."}], "vf": [{"a": "A túnica média da veia é composta por músculo liso e fibras elásticas.", "v": true, "e": "Isso permite vasoconstrição e vasodilatação."}, {"a": "A adventícia é a camada mais interna da veia e fica em contato direto com o cateter.", "v": false, "e": "Quem fica em contato com o cateter é a íntima; a adventícia é a camada externa."}]}, {"id": "C0-2", "parte": 2, "bloco": "Terapia Infusional", "tema": "infusional", "num": "2", "pergunta": "Explique a Lei de Poiseuille (Lei da Quarta Potência), relacionando o diâmetro do vaso com a taxa de fluxo sanguíneo. Por que essa lei é relevante na escolha do calibre do cateter?", "resposta": "<p>A lei estabelece que o fluxo através de um tubo é proporcional à <strong>quarta potência do raio<\/strong> (fluxo ∝ r⁴): dobrar o raio multiplica o fluxo possível por 16. Assim, pequenas variações no calibre do cateter ou no diâmetro da veia alteram muito a vazão de infusão.<\/p>\n<p>Na prática, isso orienta a escolher o <strong>menor calibre eficaz<\/strong> para a terapia (menos trauma endotelial e menos flebite mecânica), mas cateteres maiores permitem infusão mais rápida quando o quadro exige (ex.: reposição volêmica agressiva).<\/p>", "fonte": "Literatura de apoio (fora da pasta de referências) - INS 2021 Standards of Practice.", "flashcards": [{"f": "Lei de Poiseuille: relação entre fluxo e raio", "v": "Fluxo é proporcional à <strong>quarta potência do raio<\/strong> (fluxo ∝ r⁴)."}, {"f": "O que acontece com o fluxo se o raio dobra?", "v": "O fluxo possível é multiplicado por <strong>16<\/strong>."}, {"f": "Poiseuille na escolha do cateter", "v": "Usar o <strong>menor calibre eficaz<\/strong> (menos trauma e flebite mecânica); calibre maior quando precisa infundir rápido (ex.: reposição volêmica agressiva)."}], "multipla": [{"p": "Segundo a Lei de Poiseuille, dobrar o raio do vaso multiplica o fluxo possível por quanto?", "o": ["2", "16", "4", "8"], "c": 1, "e": "O fluxo é proporcional a r⁴, então dobrar o raio multiplica por 16."}, {"p": "Paciente estável recebe antibiótico intermitente. Pela lógica de Poiseuille e do endotélio, qual a conduta de escolha do cateter?", "o": ["Maior calibre disponível para garantir fluxo", "Calibre grande para reduzir a flebite mecânica", "Qualquer calibre, pois o raio não altera a vazão", "Menor calibre eficaz para a terapia"], "c": 3, "e": "O menor calibre eficaz causa menos trauma endotelial e flebite mecânica; calibre maior fica para quadros que exigem infusão rápida."}], "vf": [{"a": "O fluxo por um tubo é proporcional à quarta potência do raio.", "v": true, "e": "É o enunciado da Lei de Poiseuille."}, {"a": "Segundo Poiseuille, dobrar o raio do cateter dobra o fluxo.", "v": false, "e": "Como o fluxo depende de r⁴, dobrar o raio multiplica o fluxo por 16."}]}, {"id": "C0-3", "parte": 2, "bloco": "Terapia Infusional", "tema": "infusional", "num": "3", "pergunta": "Diferencie flebite, infiltração e extravasamento quanto à definição, aos sinais clínicos e à gravidade, indicando qual substância (vesicante, irritante ou não vesicante) está associada a cada complicação.", "resposta": "<table class=\"t\">\n<tr><th><\/th><th>Definição<\/th><th>Sinais<\/th><th>Substância associada<\/th><\/tr>\n<tr><td><strong>Flebite<\/strong><\/td><td>Inflamação da parede da veia (mecânica, química ou infecciosa)<\/td><td>Dor, eritema, calor, cordão venoso palpável<\/td><td>Irritante<\/td><\/tr>\n<tr><td><strong>Infiltração<\/strong><\/td><td>Extravasamento de solução não vesicante para o tecido perivascular<\/td><td>Edema, pele fria, sem dor importante<\/td><td>Não vesicante<\/td><\/tr>\n<tr><td><strong>Extravasamento<\/strong><\/td><td>Extravasamento de solução vesicante para o tecido, com potencial de necrose<\/td><td>Edema, dor intensa, bolhas, necrose tecidual<\/td><td>Vesicante<\/td><\/tr>\n<\/table>\n<p>O extravasamento é o mais grave dos três, pela lesão tecidual irreversível que a substância vesicante pode causar.<\/p>", "fonte": "ANVISA 2017; Literatura de apoio (INS 2021) para a classificação vesicante/irritante/não vesicante.", "flashcards": [{"f": "Flebite: definição e sinais", "v": "Inflamação da parede da veia (mecânica, química ou infecciosa). Dor, eritema, calor e <strong>cordão venoso palpável<\/strong>. Substância irritante."}, {"f": "Infiltração: definição e sinais", "v": "Extravasamento de solução <strong>não vesicante<\/strong> para o tecido perivascular. Edema, pele fria, sem dor importante."}, {"f": "Extravasamento: definição e sinais", "v": "Saída de solução <strong>vesicante<\/strong> para o tecido. Edema, dor intensa, bolhas e necrose."}, {"f": "Qual das três complicações é a mais grave?", "v": "<strong>Extravasamento<\/strong>: lesão tecidual irreversível pela substância vesicante."}], "multipla": [{"p": "Paciente com edema e pele fria no local do acesso, sem dor importante, recebendo solução não vesicante. Qual a complicação?", "o": ["Flebite", "Extravasamento", "Flebite química", "Infiltração"], "c": 3, "e": "Infiltração é o extravasamento de solução não vesicante, com edema e pele fria, sem dor importante."}, {"p": "Após infusão de vesicante, o paciente refere dor intensa, com bolhas e áreas de necrose no local. Qual a complicação?", "o": ["Infiltração", "Extravasamento", "Flebite mecânica", "Flebite infecciosa"], "c": 1, "e": "Extravasamento de vesicante causa dor intensa, bolhas e necrose tecidual."}], "vf": [{"a": "A flebite é caracterizada por dor, eritema, calor e cordão venoso palpável.", "v": true, "e": "São os sinais da inflamação da parede da veia."}, {"a": "A infiltração está associada a substâncias vesicantes e cursa com necrose.", "v": false, "e": "Infiltração envolve substância não vesicante; o extravasamento é que se associa a vesicantes e necrose."}]}, {"id": "C0-4", "parte": 2, "bloco": "Terapia Infusional", "tema": "infusional", "num": "4", "pergunta": "Cite e explique os três tipos de causas de flebite (mecânica, química e infecciosa), relacionando cada uma a uma prática inadequada que poderia preveni-la.", "resposta": "<ul>\n<li><strong>Mecânica<\/strong>: irritação da parede pela cânula (calibre grande demais, cateter mal fixado que se movimenta). Prevenção: usar o menor calibre e comprimento adequados à terapia.<\/li>\n<li><strong>Química<\/strong>: irritação por pH ou osmolaridade da solução/fármaco infundido. Prevenção: diluir adequadamente e não infundir soluções de alta osmolaridade por via periférica.<\/li>\n<li><strong>Infecciosa<\/strong>: contaminação do sítio de inserção ou do dispositivo. Prevenção: antissepsia correta da pele e técnica <strong>no touch<\/strong> após a antissepsia.<\/li>\n<\/ul>", "fonte": "ANVISA 2017.", "flashcards": [{"f": "Flebite mecânica: causa e prevenção", "v": "Irritação da parede pela cânula (calibre grande, cateter mal fixado). Prevenção: <strong>menor calibre e comprimento<\/strong> adequados."}, {"f": "Flebite química: causa e prevenção", "v": "Irritação por <strong>pH ou osmolaridade<\/strong> do fármaco. Prevenção: diluir bem e não infundir alta osmolaridade por via periférica."}, {"f": "Flebite infecciosa: causa e prevenção", "v": "Contaminação do sítio ou do dispositivo. Prevenção: antissepsia correta e técnica <strong>no touch<\/strong>."}], "multipla": [{"p": "Cateter mal fixado que se movimenta dentro da veia causa qual tipo de flebite?", "o": ["Mecânica", "Química", "Infecciosa", "Osmótica"], "c": 0, "e": "A movimentação e o calibre inadequado irritam a parede: flebite mecânica."}, {"p": "Qual prática previne a flebite infecciosa?", "o": ["Diluir o fármaco de alta osmolaridade", "Usar o menor calibre e comprimento", "Antissepsia correta da pele e técnica no touch após a antissepsia", "Infundir soluções hiperosmolares por via periférica"], "c": 2, "e": "Diluição e menor calibre atuam nas flebites química e mecânica; a infecciosa se previne com antissepsia e no touch."}], "vf": [{"a": "A flebite química decorre do pH ou da osmolaridade da solução infundida.", "v": true, "e": "É a irritação da parede pela solução ou fármaco."}, {"a": "A flebite infecciosa é prevenida usando o menor calibre e comprimento do cateter.", "v": false, "e": "Isso previne a flebite mecânica; a infecciosa depende de antissepsia e técnica no touch."}]}, {"id": "C0-5", "parte": 2, "bloco": "Terapia Infusional", "tema": "infusional", "num": "5", "pergunta": "Compare o PICC e o Cateter de Linha Média (midline) quanto à localização da ponta do cateter, indicações e restrições de uso.", "resposta": "<table class=\"t\">\n<tr><th><\/th><th>Ponta do cateter<\/th><th>Indicação<\/th><th>Restrição<\/th><\/tr>\n<tr><td><strong>PICC<\/strong><\/td><td>Central: terço inferior da veia cava superior ou átrio direito<\/td><td>Terapias prolongadas, vesicantes, irritantes, nutrição parenteral<\/td><td>Requer confirmação radiológica ou por ECG da posição da ponta<\/td><\/tr>\n<tr><td><strong>Midline<\/strong><\/td><td>Periférica profunda: não atinge veia central, fica na axilar ou subclávia proximal<\/td><td>Terapias de curta/média duração com fármacos não vesicantes<\/td><td>Não deve receber soluções vesicantes, irritantes ou de alta osmolaridade<\/td><\/tr>\n<\/table>", "fonte": "NT ABENTI 01/2026 (definição e classificação do PICC); Literatura de apoio (fora da pasta de referências) para o midline - INS 2021.", "flashcards": [{"f": "Ponta do PICC", "v": "<strong>Central<\/strong>: terço inferior da veia cava superior ou átrio direito."}, {"f": "Ponta do midline", "v": "<strong>Periférica profunda<\/strong>: não atinge veia central, fica na axilar ou subclávia proximal."}, {"f": "Indicações do PICC", "v": "Terapias prolongadas, vesicantes, irritantes e nutrição parenteral. Exige confirmação da ponta por RX ou ECG."}, {"f": "Restrição do midline", "v": "Não receber soluções <strong>vesicantes, irritantes ou de alta osmolaridade<\/strong>. Indicado p/ terapia curta/média não vesicante."}], "multipla": [{"p": "Paciente precisa de nutrição parenteral prolongada. Qual dispositivo é o indicado entre os dois?", "o": ["Midline", "PICC", "Ambos servem igualmente", "Cateter periférico curto apenas"], "c": 1, "e": "PICC tem ponta central e atende NPT e terapias prolongadas; o midline não recebe soluções de alta osmolaridade."}, {"p": "Qual a localização da ponta do midline?", "o": ["Terço inferior da veia cava superior", "Átrio direito", "Veia cava inferior", "Veia periférica profunda (axilar ou subclávia proximal), sem atingir veia central"], "c": 3, "e": "O midline não atinge veia central; a ponta central é do PICC."}], "vf": [{"a": "O PICC exige confirmação da posição da ponta por RX ou ECG.", "v": true, "e": "É a restrição descrita para o PICC."}, {"a": "O midline pode receber vesicantes, pois sua ponta é central.", "v": false, "e": "A ponta do midline é periférica profunda e ele não deve receber vesicantes."}]}, {"id": "C0-6", "parte": 2, "bloco": "Terapia Infusional", "tema": "infusional", "num": "6", "pergunta": "Descreva os critérios técnicos para a seleção do cateter venoso periférico (calibre, comprimento), relacionando o tipo de terapia (fluidos viscosos, cristaloides, fármacos intermitentes) ao gauge recomendado.", "resposta": "<p>A seleção deve se basear no objetivo da terapia, na duração, na viscosidade e nos componentes do fluido, sempre priorizando o <strong>menor calibre e comprimento<\/strong> capazes de atender à necessidade: cateteres finos causam menos flebite mecânica e menos obstrução do fluxo.<\/p>\n<ul>\n<li>Fármacos intermitentes/infusões de rotina: calibres menores.<\/li>\n<li>Fluidos viscosos ou reposição volêmica rápida: calibre maior, para permitir vazão adequada.<\/li>\n<li>Cateteres periféricos não devem ser usados para vesicantes contínuos, NPT com dextrose acima de 10% ou soluções com osmolaridade acima de 900 mOsm/L.<\/li>\n<\/ul>", "fonte": "ANVISA 2017.", "flashcards": [{"f": "Regra geral de escolha do cateter periférico", "v": "Escolher o <strong>menor calibre e comprimento<\/strong> capazes de atender à terapia."}, {"f": "Por que cateter fino é preferível?", "v": "Causa <strong>menos flebite mecânica<\/strong> e menos obstrução do fluxo."}, {"f": "Fluidos viscosos ou reposição volêmica rápida", "v": "Pedem <strong>calibre maior<\/strong> para permitir vazão adequada."}, {"f": "O que não vai em cateter periférico", "v": "Vesicantes contínuos, NPT com dextrose &gt; 10% e osmolaridade &gt; <strong>900 mOsm/L<\/strong>."}], "multipla": [{"p": "Qual solução NÃO deve ser infundida em cateter periférico?", "o": ["Fármaco intermitente de rotina", "Cristaloide de reposição rápida", "NPT com dextrose acima de 10%", "Fluido viscoso em calibre maior"], "c": 2, "e": "Cateteres periféricos não devem receber NPT com dextrose acima de 10%, vesicantes contínuos ou osmolaridade acima de 900 mOsm/L."}, {"p": "Reposição volêmica rápida em paciente grave. Qual a escolha de calibre?", "o": ["Calibre maior, para permitir vazão adequada", "Menor calibre possível, por causar menos flebite", "Calibre menor, por reduzir a obstrução do fluxo", "Cateter longo de menor calibre"], "c": 0, "e": "Fluidos viscosos ou reposição rápida exigem calibre maior para vazão adequada."}], "vf": [{"a": "Cateteres periféricos não devem receber soluções com osmolaridade acima de 900 mOsm/L.", "v": true, "e": "Esse é um dos limites citados para uso periférico."}, {"a": "Cateteres de maior calibre causam menos flebite mecânica que os finos.", "v": false, "e": "Cateteres finos causam menos flebite mecânica e menos obstrução do fluxo."}]}, {"id": "C0-7", "parte": 2, "bloco": "Terapia Infusional", "tema": "infusional", "num": "7", "pergunta": "Explique o processo de antissepsia da pele antes da punção venosa, incluindo os antissépticos recomendados, seus respectivos tempos de aplicação e a técnica do \"no touch\".", "resposta": "<ul>\n<li>Antissépticos recomendados: <strong>gliconato de clorexidina alcoólica &gt; 0,5%<\/strong>, PVP-I alcoólico 10% ou álcool 70%.<\/li>\n<li>Tempo de aplicação: <strong>clorexidina 30 segundos<\/strong> (movimentos de vai e vem); <strong>PVP-I 1,5 a 2,0 minutos<\/strong> (movimentos circulares, de dentro para fora).<\/li>\n<li>Aguardar a secagem espontânea do antisséptico antes da punção.<\/li>\n<li><strong>Técnica no touch<\/strong>: após a antissepsia, o sítio de inserção não deve ser tocado novamente; se for necessário palpar, usar luva estéril.<\/li>\n<\/ul>", "fonte": "ANVISA 2017.", "flashcards": [{"f": "Antissépticos recomendados na punção", "v": "<strong>Clorexidina alcoólica &gt; 0,5%<\/strong>, PVP-I alcoólico 10% ou álcool 70%."}, {"f": "Tempo de aplicação da clorexidina", "v": "<strong>30 segundos<\/strong>, em movimentos de vai e vem."}, {"f": "Tempo de aplicação do PVP-I", "v": "<strong>1,5 a 2,0 minutos<\/strong>, em movimentos circulares, de dentro para fora."}, {"f": "Técnica no touch", "v": "Após a antissepsia o sítio <strong>não é tocado<\/strong>; se precisar palpar, usar luva estéril. Aguardar secagem espontânea."}], "multipla": [{"p": "Qual o tempo de aplicação e o movimento indicados para a clorexidina alcoólica?", "o": ["1,5 a 2,0 minutos, em movimentos circulares", "30 segundos, em vai e vem", "30 segundos, em movimentos circulares", "1,5 a 2,0 minutos, em vai e vem"], "c": 1, "e": "Clorexidina: 30 s em vai e vem. PVP-I: 1,5 a 2,0 min em movimentos circulares, de dentro para fora."}, {"p": "Após a antissepsia, o enfermeiro precisa palpar a veia. Qual a conduta pela técnica no touch?", "o": ["Usar luva estéril para palpar", "Palpar com luva de procedimento limpa", "Palpar sem luva e reaplicar o antisséptico", "Soprar o local para acelerar a secagem e palpar"], "c": 0, "e": "O sítio não deve ser tocado; se for necessário palpar, usa-se luva estéril."}], "vf": [{"a": "O PVP-I deve ser aplicado por 1,5 a 2,0 minutos em movimentos circulares, de dentro para fora.", "v": true, "e": "Esse é o tempo e a técnica do PVP-I."}, {"a": "A clorexidina deve ser aplicada por 1,5 a 2,0 minutos.", "v": false, "e": "O tempo da clorexidina é 30 segundos; 1,5 a 2,0 min é do PVP-I."}]}, {"id": "C0-8", "parte": 2, "bloco": "Terapia Infusional", "tema": "infusional", "num": "8", "pergunta": "O que é o \"Capital Venoso\" e por que sua gestão é considerada importante na prática de enfermagem? Cite pelo menos três características desse conceito.", "resposta": "<p>Capital venoso é o conjunto finito de acessos venosos disponíveis que um paciente possui ao longo da vida ou de uma internação. Preservá-lo é importante porque punções repetidas e mal indicadas esgotam essa reserva, dificultando tratamentos futuros.<\/p>\n<ul>\n<li>É <strong>limitado<\/strong>: cada punção traumática ou complicação (flebite, trombose) reduz vasos disponíveis.<\/li>\n<li>É <strong>individual<\/strong>: varia com idade, comorbidades, uso prévio de quimioterapia, número de punções anteriores.<\/li>\n<li>Deve ser <strong>planejado<\/strong>: escolher o dispositivo (periférico, PICC, port) conforme a duração e o tipo de terapia, começando pelas veias mais distais.<\/li>\n<\/ul>", "fonte": "Literatura de apoio (fora da pasta de referências) - INS 2021 Standards of Practice.", "flashcards": [{"f": "O que é capital venoso?", "v": "Conjunto <strong>finito<\/strong> de acessos venosos disponíveis ao paciente ao longo da vida ou de uma internação."}, {"f": "Por que preservar o capital venoso?", "v": "Punções repetidas e mal indicadas esgotam a reserva e <strong>dificultam tratamentos futuros<\/strong>."}, {"f": "Capital venoso é individual: de que depende?", "v": "Idade, comorbidades, quimioterapia prévia e número de punções anteriores."}, {"f": "Capital venoso deve ser planejado: como?", "v": "Escolher o dispositivo (periférico, PICC, port) pela duração e tipo de terapia, <strong>começando pelas veias mais distais<\/strong>."}], "multipla": [{"p": "Por que o capital venoso é considerado limitado?", "o": ["Porque todo paciente nasce com o mesmo número de veias", "Porque só o PICC consome capital venoso", "Cada punção traumática ou complicação reduz os vasos disponíveis", "Porque ele se regenera após cada punção"], "c": 2, "e": "Punções traumáticas, flebite e trombose reduzem os vasos disponíveis."}, {"p": "Na gestão do capital venoso, por onde se recomenda começar as punções?", "o": ["Pelas veias mais proximais", "Direto por cateter central", "Pela veia mais calibrosa da fossa antecubital", "Pelas veias mais distais"], "c": 3, "e": "O planejamento começa pelas veias mais distais, escolhendo o dispositivo conforme a terapia."}], "vf": [{"a": "O capital venoso varia entre pacientes conforme idade, comorbidades e quimioterapia prévia.", "v": true, "e": "Por isso é considerado individual."}, {"a": "O capital venoso é ilimitado, por isso o número de punções não importa.", "v": false, "e": "Ele é finito e punções repetidas e mal indicadas o esgotam."}]}, {"id": "C0-10", "parte": 2, "bloco": "Terapia Infusional", "tema": "infusional", "num": "10", "pergunta": "Compare os cateteres venosos centrais de longa permanência: semi-implantado (tunelizado) e totalmente implantável (port), quanto ao material, indicações e cuidados específicos na sua manutenção.", "resposta": "<table class=\"t\">\n<tr><th><\/th><th>Material<\/th><th>Indicação<\/th><th>Cuidados<\/th><\/tr>\n<tr><td><strong>Tunelizado (com cuff)<\/strong><\/td><td>Poliuretano ou silicone; trajeto subcutâneo com cuff de fixação/barreira<\/td><td>Terapia prolongada com necessidade de acesso frequente (quimioterapia, hemodiálise, NPT domiciliar)<\/td><td>Curativo do sítio de saída, avaliação diária de sinais de infecção, técnica asséptica na manipulação<\/td><\/tr>\n<tr><td><strong>Port (totalmente implantável)<\/strong><\/td><td>Reservatório de titânio/silicone implantado sob a pele, sem exteriorização<\/td><td>Terapia intermitente de longo prazo, com menor impacto estético e de autocuidado<\/td><td>Acesso apenas com agulha própria (Huber), heparinização ao final do uso, sem curativo permanente entre acessos<\/td><\/tr>\n<\/table>\n<div class=\"dica\">Ambos reduzem o risco de IPCS por manipulação em relação aos cateteres não tunelizados, pois o trajeto subcutâneo funciona como barreira mecânica à migração bacteriana.<\/div>", "fonte": "NT ABENTI 01/2026 (material e classificação); Literatura de apoio (fora da pasta de referências) para cuidados de manutenção específicos (agulha de Huber, heparinização).", "flashcards": [{"f": "Cateter tunelizado: material e desenho", "v": "Poliuretano ou silicone; trajeto subcutâneo com <strong>cuff<\/strong> de fixação e barreira."}, {"f": "Indicações do tunelizado", "v": "Terapia prolongada com acesso frequente: quimioterapia, hemodiálise, NPT domiciliar."}, {"f": "Port: o que é", "v": "Reservatório de titânio/silicone implantado sob a pele, <strong>sem exteriorização<\/strong>."}, {"f": "Cuidados de manutenção do port", "v": "Acessar só com <strong>agulha Huber<\/strong>, heparinizar ao final do uso; sem curativo permanente entre acessos."}], "multipla": [{"p": "Qual cateter é acessado somente com agulha própria (Huber)?", "o": ["Tunelizado com cuff", "Port (totalmente implantável)", "PICC", "Midline"], "c": 1, "e": "O port exige agulha Huber e heparinização ao final do uso."}, {"p": "Qual cuidado é específico do cateter tunelizado?", "o": ["Curativo do sítio de saída e avaliação diária de sinais de infecção", "Ausência de curativo entre os acessos", "Heparinização como único cuidado após cada uso", "Acesso apenas com agulha Huber"], "c": 0, "e": "O tunelizado tem saída exteriorizada e pede curativo e avaliação diária; o port fica sem curativo permanente."}], "vf": [{"a": "O port é totalmente implantado sob a pele, sem exteriorização.", "v": true, "e": "Esse é o principal traço do port."}, {"a": "O cuff do cateter tunelizado serve para reduzir o fluxo sanguíneo pelo cateter.", "v": false, "e": "O cuff é de fixação e barreira mecânica à migração bacteriana no trajeto subcutâneo."}]}, {"id": "C1-1", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "1", "pergunta": "Descreva a anatomia da via respiratória inferior, desde a traqueia até os alvéolos, explicando a diferença entre brônquios e bronquíolos quanto à presença de cartilagem e função na condução/troca gasosa.", "resposta": "<p>A traqueia (16 a 20 anéis cartilaginosos) se divide na carina nos <strong>brônquios<\/strong> direito e esquerdo, que se ramificam em brônquios lobares e segmentares e ainda possuem cartilagem, mantendo a via aérea aberta e conduzindo o ar sem trocas gasosas.<\/p>\n<p>Os brônquios se ramificam em <strong>bronquíolos<\/strong>, que perdem a cartilagem (paredes de musculatura lisa) e terminam nos bronquíolos terminais; a sequência final é bronquíolos terminais até os alvéolos, onde ocorre a troca gasosa por difusão na interface alvéolo-capilar.<\/p>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "Traqueia: estrutura e divisão", "v": "16 a 20 <strong>anéis cartilaginosos<\/strong>; divide-se na carina em brônquios direito e esquerdo."}, {"f": "Brônquios: cartilagem e função", "v": "<strong>Têm cartilagem<\/strong>, mantêm a via aérea aberta e conduzem o ar, sem trocas gasosas."}, {"f": "Bronquíolos: diferença dos brônquios", "v": "<strong>Perdem a cartilagem<\/strong> (parede de musculatura lisa) e terminam nos bronquíolos terminais."}, {"f": "Onde ocorre a troca gasosa?", "v": "Nos <strong>alvéolos<\/strong>, por difusão na interface alvéolo-capilar."}], "multipla": [{"p": "Qual a diferença de parede entre brônquios e bronquíolos?", "o": ["Bronquíolos têm cartilagem; brônquios não", "Ambos têm cartilagem", "Brônquios têm cartilagem; bronquíolos não, e têm musculatura lisa", "Nenhum tem cartilagem, só os alvéolos"], "c": 2, "e": "Os bronquíolos perdem a cartilagem, com paredes de musculatura lisa."}, {"p": "Em qual estrutura ocorre a troca gasosa por difusão?", "o": ["Alvéolos, na interface alvéolo-capilar", "Brônquios lobares", "Carina", "Traqueia"], "c": 0, "e": "Brônquios e traqueia conduzem o ar; a troca ocorre nos alvéolos."}], "vf": [{"a": "A traqueia se divide na carina em brônquios direito e esquerdo.", "v": true, "e": "É a bifurcação da traqueia."}, {"a": "Os brônquios conduzem o ar e participam das trocas gasosas.", "v": false, "e": "Os brônquios apenas conduzem o ar, sem trocas gasosas."}]}, {"id": "C1-2", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "2", "pergunta": "Explique os conceitos de complacência pulmonar e resistência das vias respiratórias, citando fatores que aumentam ou diminuem cada um e relacionando com condições clínicas específicas.", "resposta": "<ul>\n<li><strong>Complacência<\/strong>: elasticidade e capacidade de expansão do pulmão. Diminui na fibrose pulmonar (proliferação de colágeno) e na SARA (déficit de surfactante, pulmões rígidos); pulmão pouco complacente exige mais pressão para distender.<\/li>\n<li><strong>Resistência<\/strong>: determinada principalmente pelo raio da via aérea. Aumenta na asma (broncoespasmo), na bronquite crônica (espessamento da mucosa), no enfisema (perda de elasticidade) e por obstrução por muco, tumor ou corpo estranho.<\/li>\n<\/ul>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "Complacência pulmonar", "v": "Elasticidade e capacidade de <strong>expansão<\/strong> do pulmão."}, {"f": "Quando a complacência diminui?", "v": "<strong>Fibrose pulmonar<\/strong> (colágeno) e <strong>SARA<\/strong> (déficit de surfactante). Exige mais pressão para distender."}, {"f": "Resistência das vias aéreas: principal determinante", "v": "O <strong>raio<\/strong> da via aérea."}, {"f": "Condições que aumentam a resistência", "v": "Asma (broncoespasmo), bronquite crônica (espessamento da mucosa), enfisema, obstrução por muco, tumor ou corpo estranho."}], "multipla": [{"p": "Paciente com SARA, pulmões rígidos por déficit de surfactante. Que propriedade está alterada?", "o": ["Complacência aumentada", "Complacência diminuída", "Resistência diminuída por broncodilatação", "Espaço morto diminuído"], "c": 1, "e": "Na SARA e na fibrose, a complacência cai e é preciso mais pressão para distender o pulmão."}, {"p": "Qual condição aumenta a resistência das vias aéreas por broncoespasmo?", "o": ["Fibrose pulmonar", "SARA", "Déficit de surfactante", "Asma"], "c": 3, "e": "Asma (broncoespasmo) aumenta a resistência; fibrose e SARA reduzem a complacência."}], "vf": [{"a": "A resistência das vias aéreas é determinada principalmente pelo raio da via.", "v": true, "e": "Quanto menor o raio, maior a resistência."}, {"a": "Na fibrose pulmonar a complacência aumenta, pois o pulmão fica mais elástico.", "v": false, "e": "Na fibrose há proliferação de colágeno e a complacência diminui."}]}, {"id": "C1-3", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "3", "pergunta": "Diferencie os principais ritmos respiratórios (Cheyne-Stokes, Biot e Kussmaul) quanto ao padrão de movimentos e às condições clínicas associadas a cada um.", "resposta": "<table class=\"t\">\n<tr><th>Ritmo<\/th><th>Padrão<\/th><th>Condições associadas<\/th><\/tr>\n<tr><td><strong>Cheyne-Stokes<\/strong><\/td><td>Movimentos progressivamente mais amplos e rápidos, depois redução até apneia prolongada (cerca de 20s), reiniciando o ciclo<\/td><td>TCE, AVC, insuficiência cardíaca, hipertensão intracraniana<\/td><\/tr>\n<tr><td><strong>Biot<\/strong><\/td><td>Períodos de respiração normal (3 a 4 incursões) seguidos de apneia variável (10 a 60s), padrão atáxico<\/td><td>Superdosagem de fármacos, lesão encefálica (bulbo)<\/td><\/tr>\n<tr><td><strong>Kussmaul<\/strong><\/td><td>Movimentos inspiratórios e expiratórios amplos, com apneia ao fim de cada um<\/td><td>Acidose grave<\/td><\/tr>\n<\/table>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "Cheyne-Stokes: padrão", "v": "Movimentos progressivamente mais amplos e rápidos, depois redução até <strong>apneia prolongada (cerca de 20 s)<\/strong>, reiniciando o ciclo."}, {"f": "Cheyne-Stokes: condições associadas", "v": "TCE, AVC, insuficiência cardíaca, hipertensão intracraniana."}, {"f": "Biot: padrão e causas", "v": "3 a 4 incursões normais seguidas de apneia de <strong>10 a 60 s<\/strong>, atáxico. Superdosagem de fármacos, lesão bulbar."}, {"f": "Kussmaul: padrão e causa", "v": "Movimentos amplos, com apneia ao fim de cada um. <strong>Acidose grave<\/strong>."}], "multipla": [{"p": "Respiração com 3 a 4 incursões normais seguidas de apneia variável de 10 a 60 s, padrão atáxico, após superdosagem de fármacos. Qual o ritmo?", "o": ["Cheyne-Stokes", "Kussmaul", "Padrão obstrutivo", "Biot"], "c": 3, "e": "Biot: períodos de respiração normal com apneia variável, associado a superdosagem e lesão bulbar."}, {"p": "Paciente com acidose grave apresenta movimentos inspiratórios e expiratórios amplos. Qual o ritmo?", "o": ["Kussmaul", "Biot", "Cheyne-Stokes", "Respiração atáxica"], "c": 0, "e": "Kussmaul se associa à acidose grave."}], "vf": [{"a": "A respiração de Cheyne-Stokes tem incursões progressivamente mais amplas seguidas de apneia.", "v": true, "e": "O ciclo termina em apneia prolongada e reinicia."}, {"a": "O padrão de Kussmaul está associado a TCE e hipertensão intracraniana.", "v": false, "e": "Isso é do Cheyne-Stokes; Kussmaul se associa à acidose grave."}]}, {"id": "C1-4", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "4", "pergunta": "Explique por que a administração de oxigênio em altas concentrações pode ser perigosa em pacientes com DPOC, descrevendo o mecanismo fisiológico que leva à hipoventilação e à narcose por CO2.", "resposta": "<p>No DPOC crônico, o estímulo para respirar deixa de ser a elevação do CO2 e passa a ser a <strong>baixa tensão de oxigênio<\/strong> no sangue. Ao oferecer O2 em alta concentração, esse estímulo hipóxico é suprimido, a ventilação pulmonar cai e o CO2 se acumula progressivamente, levando a <strong>narcose por CO2<\/strong> e acidose, podendo evoluir para apneia.<\/p>\n<p>Por isso recomenda-se oxigênio em baixo fluxo (1 a 2 L/min) nesses pacientes.<\/p>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "Estímulo respiratório no DPOC crônico", "v": "Deixa de ser a elevação do CO2 e passa a ser a <strong>baixa tensão de O2<\/strong> (estímulo hipóxico)."}, {"f": "Por que O2 em alta concentração é perigoso no DPOC?", "v": "Suprime o estímulo hipóxico: a ventilação cai, o CO2 se acumula e leva à <strong>narcose por CO2<\/strong> e acidose."}, {"f": "Conduta de oxigenoterapia no DPOC", "v": "Oxigênio em <strong>baixo fluxo (1 a 2 L/min)<\/strong>."}], "multipla": [{"p": "Paciente com DPOC crônico recebe O2 em alta concentração e fica sonolento, com hipoventilação. Qual o mecanismo?", "o": ["Aumento do estímulo por CO2 e taquipneia", "Supressão do estímulo hipóxico, com acúmulo de CO2 e narcose", "Broncoespasmo pelo oxigênio", "Perda do surfactante alveolar"], "c": 1, "e": "Sem o estímulo hipóxico, a ventilação cai e o CO2 se acumula, causando narcose e acidose."}, {"p": "Qual a oferta de oxigênio recomendada ao paciente com DPOC?", "o": ["Alto fluxo para corrigir a hipóxia", "Máscara não reinalante em alta concentração", "Baixo fluxo, de 1 a 2 L/min", "Sem oxigênio, para preservar o drive"], "c": 2, "e": "Recomenda-se oxigênio em baixo fluxo (1 a 2 L/min) nesses pacientes."}], "vf": [{"a": "No DPOC crônico o estímulo para respirar passa a ser a baixa tensão de oxigênio.", "v": true, "e": "Por isso o excesso de O2 pode reduzir a ventilação."}, {"a": "No DPOC, O2 em alta concentração aumenta a ventilação e elimina o CO2.", "v": false, "e": "A alta concentração suprime o estímulo hipóxico, reduzindo a ventilação e acumulando CO2."}]}, {"id": "C1-5", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "5", "pergunta": "Compare a Ventilação Não Invasiva (VNI) na modalidade CPAP e BiPAP, e liste pelo menos quatro contraindicações absolutas para o uso da VNI.", "resposta": "<table class=\"t\">\n<tr><th><\/th><th>Mecanismo<\/th><th>Ajuste típico<\/th><\/tr>\n<tr><td><strong>CPAP<\/strong><\/td><td>Pressão positiva contínua e única durante todo o ciclo, ventilação espontânea<\/td><td>5 a 10 cmH2O<\/td><\/tr>\n<tr><td><strong>BiPAP<\/strong><\/td><td>Dois níveis de pressão: IPAP (inspiratória) e EPAP (expiratória)<\/td><td>EPAP 5 a 10 cmH2O; IPAP até 15 cmH2O<\/td><\/tr>\n<\/table>\n<p><strong>Contraindicações absolutas<\/strong>: parada cardíaca ou respiratória; necessidade de intubação imediata; Glasgow &lt; 8; obstrução de via aérea superior ou trauma de face grave.<\/p>", "fonte": "Orientações Práticas de VM (AMIB/SBPT); Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "CPAP: mecanismo e ajuste", "v": "Pressão positiva <strong>contínua e única<\/strong> no ciclo, ventilação espontânea. 5 a 10 cmH2O."}, {"f": "BiPAP: mecanismo", "v": "<strong>Dois níveis<\/strong> de pressão: IPAP (inspiratória) e EPAP (expiratória)."}, {"f": "Ajuste típico do BiPAP", "v": "EPAP 5 a 10 cmH2O; IPAP até <strong>15 cmH2O<\/strong>."}, {"f": "Contraindicações absolutas da VNI", "v": "Parada cardíaca ou respiratória, necessidade de IOT imediata, <strong>Glasgow &lt; 8<\/strong>, obstrução de VAS ou trauma grave de face."}], "multipla": [{"p": "Qual modalidade de VNI usa dois níveis de pressão, inspiratória e expiratória?", "o": ["BiPAP", "CPAP", "PSV invasiva", "PCV"], "c": 0, "e": "BiPAP tem IPAP e EPAP; CPAP tem pressão única."}, {"p": "Qual paciente tem contraindicação absoluta para VNI?", "o": ["Paciente com Glasgow 15 e dispneia", "Glasgow menor que 8", "Paciente com drive respiratório próprio e cooperativo", "Paciente que usa CPAP a 8 cmH2O"], "c": 1, "e": "Glasgow &lt; 8, parada, necessidade de IOT imediata, obstrução de VAS e trauma grave de face são contraindicações absolutas."}], "vf": [{"a": "O CPAP mantém uma pressão positiva contínua e única durante todo o ciclo respiratório.", "v": true, "e": "É o que o diferencia do BiPAP."}, {"a": "A necessidade de intubação imediata é indicação de VNI, e não contraindicação.", "v": false, "e": "É contraindicação absoluta da VNI."}]}, {"id": "C1-6", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "6", "pergunta": "Descreva os cuidados de enfermagem essenciais para um paciente em intubação orotraqueal.", "resposta": "<ul>\n<li>Confirmar posição do tubo: ausculta bilateral, expansão torácica simétrica, escala em cm no tubo e RX (ponta 3 a 4 anéis acima da carina).<\/li>\n<li>Verificar e manter a <strong>pressão do cuff entre 15 e 20 mmHg<\/strong>, checando a cada 8 a 12h.<\/li>\n<li>Fixação adequada do tubo (mulheres 20 a 22 cm, homens 22 a 24 cm na comissura labial), evitando compressão de jugulares.<\/li>\n<li>Aspiração de secreções apenas quando indicada (sons adventícios ou secreção visível), por no máximo 10 a 15 segundos.<\/li>\n<li>Monitorização contínua de FC, FR, PA, nível de consciência, oximetria e capnografia.<\/li>\n<\/ul>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "Pressão do cuff na IOT", "v": "Manter entre <strong>15 e 20 mmHg<\/strong>, checando a cada 8 a 12 h."}, {"f": "Confirmação da posição do tubo", "v": "Ausculta bilateral, expansão torácica simétrica, escala em cm e RX com ponta <strong>3 a 4 anéis acima da carina<\/strong>."}, {"f": "Fixação do tubo na comissura labial", "v": "Mulheres 20 a 22 cm; homens 22 a 24 cm. Evitar compressão de jugulares."}, {"f": "Aspiração no paciente com IOT", "v": "Só quando indicada (sons adventícios ou secreção visível), por no máximo <strong>10 a 15 segundos<\/strong>."}], "multipla": [{"p": "Qual a faixa de pressão do cuff a ser mantida no paciente intubado?", "o": ["5 a 10 mmHg", "25 a 35 mmHg", "15 a 20 mmHg", "40 a 50 mmHg"], "c": 2, "e": "O cuff deve ser mantido entre 15 e 20 mmHg, checado a cada 8 a 12 h."}, {"p": "Qual o tempo máximo de cada aspiração de secreções no paciente com IOT?", "o": ["10 a 15 segundos", "30 a 45 segundos", "Até a via ficar limpa", "1 minuto"], "c": 0, "e": "A aspiração é feita só quando indicada e por no máximo 10 a 15 segundos."}], "vf": [{"a": "No RX, a ponta do tubo deve ficar 3 a 4 anéis acima da carina.", "v": true, "e": "É um dos critérios de confirmação da posição."}, {"a": "A aspiração de secreções deve ser feita de rotina, em horários fixos.", "v": false, "e": "A aspiração só é feita quando indicada, por sons adventícios ou secreção visível."}]}, {"id": "C1-7", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "7", "pergunta": "Diferencie os principais modos ventilatórios (VCV, PCV e PSV) quanto à variável controlada (volume ou pressão) e às indicações clínicas de cada modalidade.", "resposta": "<table class=\"t\">\n<tr><th>Modo<\/th><th>Variável controlada<\/th><th>Indicação<\/th><\/tr>\n<tr><td><strong>VCV<\/strong><\/td><td>Volume (a ciclagem ocorre pelo volume programado)<\/td><td>Garantir volume/minuto constante; risco de picos de pressão em pulmão pouco complacente<\/td><\/tr>\n<tr><td><strong>PCV<\/strong><\/td><td>Pressão (limita o pico de pressão inspiratória)<\/td><td>Protege contra barotrauma; volume corrente varia com a complacência pulmonar<\/td><\/tr>\n<tr><td><strong>PSV<\/strong><\/td><td>Pressão de suporte, ciclagem a fluxo<\/td><td>Paciente com drive respiratório próprio; usada também como estratégia de desmame<\/td><\/tr>\n<\/table>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "VCV: variável controlada", "v": "<strong>Volume<\/strong>. Garante volume/minuto constante; risco de picos de pressão em pulmão pouco complacente."}, {"f": "PCV: variável controlada", "v": "<strong>Pressão<\/strong> (limita o pico inspiratório). Protege de barotrauma; o volume corrente varia com a complacência."}, {"f": "PSV: quando usar", "v": "Paciente com <strong>drive respiratório próprio<\/strong>; também estratégia de desmame. Ciclagem a fluxo."}, {"f": "O que varia no PCV?", "v": "O <strong>volume corrente<\/strong>, conforme a complacência pulmonar."}], "multipla": [{"p": "Qual modo ventilatório controla o volume e garante volume/minuto constante?", "o": ["PCV", "VCV", "PSV", "CPAP"], "c": 1, "e": "VCV controla o volume; o risco é de picos de pressão em pulmão pouco complacente."}, {"p": "Paciente com drive próprio em preparo para desmame. Qual o modo indicado?", "o": ["VCV", "PCV", "VCV com volume fixo", "PSV"], "c": 3, "e": "PSV é usada com drive respiratório próprio e como estratégia de desmame."}], "vf": [{"a": "No PCV, o volume corrente varia com a complacência pulmonar.", "v": true, "e": "A pressão é o parâmetro controlado."}, {"a": "Na VCV o risco é o baixo volume corrente com pulmão pouco complacente.", "v": false, "e": "O risco na VCV é de picos de pressão em pulmão pouco complacente, pois o volume é fixo."}]}, {"id": "C1-8", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "8", "pergunta": "Explique o conceito de PEEP (Pressão Positiva no Final da Expiração), citando suas vantagens e desvantagens.", "resposta": "<p>PEEP mantém uma pressão intra-alveolar positiva durante todo o ciclo respiratório, evitando o colabamento alveolar ao final da expiração. A PEEP fisiológica é de 5 cmH2O.<\/p>\n<ul>\n<li><strong>Vantagens<\/strong>: melhora a oxigenação, reduz lesão pulmonar em SARA, reduz o trabalho respiratório imposto pelo auto-PEEP.<\/li>\n<li><strong>Desvantagens<\/strong>: reduz o retorno venoso e pode reduzir o débito cardíaco em pacientes hipovolêmicos; risco maior em hiperinsuflação, fístula broncopleural e instabilidade hemodinâmica.<\/li>\n<\/ul>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "O que é PEEP?", "v": "Pressão intra-alveolar positiva mantida durante o ciclo, <strong>evitando o colabamento alveolar<\/strong> ao final da expiração."}, {"f": "PEEP fisiológica", "v": "<strong>5 cmH2O<\/strong>."}, {"f": "Vantagens da PEEP", "v": "Melhora a oxigenação, reduz lesão pulmonar na SARA e o trabalho respiratório imposto pelo auto-PEEP."}, {"f": "Desvantagens da PEEP", "v": "Reduz o <strong>retorno venoso<\/strong> e pode reduzir o débito cardíaco em hipovolêmicos. Risco em hiperinsuflação, fístula broncopleural e instabilidade."}], "multipla": [{"p": "Paciente hipovolêmico e instável recebe PEEP elevada. Qual o principal risco descrito?", "o": ["Aumento do retorno venoso", "Colabamento alveolar no fim da expiração", "Redução do retorno venoso e do débito cardíaco", "Piora da oxigenação por falta de pressão"], "c": 2, "e": "A PEEP reduz o retorno venoso e pode reduzir o débito cardíaco em hipovolêmicos."}, {"p": "Qual o valor da PEEP fisiológica?", "o": ["5 cmH2O", "0 cmH2O", "10 cmH2O", "15 cmH2O"], "c": 0, "e": "A PEEP fisiológica é de 5 cmH2O."}], "vf": [{"a": "A PEEP evita o colabamento alveolar ao final da expiração.", "v": true, "e": "É a base da melhora da oxigenação."}, {"a": "A PEEP aumenta o retorno venoso e o débito cardíaco.", "v": false, "e": "Ela reduz o retorno venoso e pode reduzir o débito cardíaco."}]}, {"id": "C1-9", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "9", "pergunta": "Descreva o Bundle de Prevenção da Pneumonia Associada à Ventilação Mecânica (PAVM), explicando a justificativa fisiológica de pelo menos três das medidas.", "resposta": "<ul>\n<li><strong>Elevação da cabeceira a 30-35°<\/strong>: reduz o refluxo e a microaspiração de conteúdo gástrico para a via aérea inferior.<\/li>\n<li><strong>Higiene oral com clorexidina aquosa 0,12%<\/strong>: reduz o biofilme e a carga bacteriana da orofaringe que seria microaspirada ao redor do tubo.<\/li>\n<li><strong>Manutenção da pressão do cuff (15 a 20 mmHg)<\/strong>: veda a traqueia, impedindo a passagem de secreções acumuladas acima do balonete para a via aérea inferior.<\/li>\n<li>Manipulação asséptica do circuito e evitar que a água condensada avance ao trato respiratório.<\/li>\n<\/ul>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN); ANVISA 2017 (higiene oral com clorexidina).", "flashcards": [{"f": "Cabeceira no bundle de PAVM", "v": "Elevar a <strong>30 a 35°<\/strong>: reduz refluxo e microaspiração de conteúdo gástrico."}, {"f": "Higiene oral no bundle de PAVM", "v": "<strong>Clorexidina aquosa 0,12%<\/strong>: reduz biofilme e carga bacteriana da orofaringe."}, {"f": "Cuff no bundle de PAVM", "v": "Manter pressão de <strong>15 a 20 mmHg<\/strong>: veda a traqueia e impede passagem de secreções acima do balonete."}, {"f": "Cuidado com o circuito do ventilador", "v": "Manipulação asséptica e evitar que a <strong>água condensada<\/strong> avance ao trato respiratório."}], "multipla": [{"p": "Qual a justificativa da elevação da cabeceira a 30-35° na prevenção de PAVM?", "o": ["Aumentar a pressão do cuff", "Reduzir refluxo e microaspiração de conteúdo gástrico", "Reduzir o biofilme da orofaringe", "Diminuir o volume corrente"], "c": 1, "e": "A cabeceira elevada reduz o refluxo e a microaspiração para a via aérea inferior."}, {"p": "Qual antisséptico é usado na higiene oral do bundle de PAVM?", "o": ["Clorexidina alcoólica 0,5%", "PVP-I 10%", "Álcool 70%", "Clorexidina aquosa 0,12%"], "c": 3, "e": "A higiene oral usa clorexidina aquosa 0,12% para reduzir biofilme e carga bacteriana."}], "vf": [{"a
