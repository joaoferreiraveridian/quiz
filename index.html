<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Plantão ENC472</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: faixa de monitor multiparamétrico no topo, trilho de navegação (barra inferior no celular, coluna lateral em tela larga) e coluna de leitura alinhada à esquerda */
:root{
  --bg:#e9f0ee; --surface:#f6f9f8; --surface2:#dbe6e3; --ink:#12262b; --ink2:#48616a; --line:#bccbc7;
  --accent:#0a5561; --on-accent:#f4faf9; --focus:#0e7285; --shade:rgba(10,38,44,.22);
  --ok:#1f7a3a; --ok-bg:#d8efdf; --bad:#b3261e; --bad-bg:#f8dcd9; --warn:#a85a00; --warn-bg:#fbe6c8; --on-sem:#ffffff;
  --mon-bg:#07181b; --mon-fg:#6ff0b0; --mon-dim:#4c8f86; --mon-ink:#e8fff5;
  --tri-vermelho:#d62828; --tri-laranja:#f77f00; --tri-amarelo:#f6c90e; --tri-verde:#2a9d4b; --tri-azul:#1f6fd1; --tri-preto:#111111;
  --c-choque:#b0543a; --c-sepse:#8a6d1f; --c-pcr:#3c6e9e; --c-cardio:#a63d5e; --c-infusional:#2f7f6f; --c-vm:#5a6a9c; --c-risco:#6b7f2a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c191c; --surface:#132226; --surface2:#1b2e33; --ink:#e3efec; --ink2:#9db5b3; --line:#2b4147;
    --accent:#5cc0cf; --on-accent:#062227; --focus:#7fd6e4; --shade:rgba(0,0,0,.55);
    --ok:#5fd48a; --ok-bg:#12341f; --bad:#ff8a80; --bad-bg:#3d1916; --warn:#ffb457; --warn-bg:#3b2810; --on-sem:#0c191c;
    --c-choque:#e58a6e; --c-sepse:#d1ae4a; --c-pcr:#7fb0e0; --c-cardio:#e07f9c; --c-infusional:#68c4ae; --c-vm:#9fb0e6; --c-risco:#a9c05a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c191c; --surface:#132226; --surface2:#1b2e33; --ink:#e3efec; --ink2:#9db5b3; --line:#2b4147;
  --accent:#5cc0cf; --on-accent:#062227; --focus:#7fd6e4; --shade:rgba(0,0,0,.55);
  --ok:#5fd48a; --ok-bg:#12341f; --bad:#ff8a80; --bad-bg:#3d1916; --warn:#ffb457; --warn-bg:#3b2810; --on-sem:#0c191c;
  --c-choque:#e58a6e; --c-sepse:#d1ae4a; --c-pcr:#7fb0e0; --c-cardio:#e07f9c; --c-infusional:#68c4ae; --c-vm:#9fb0e6; --c-risco:#a9c05a;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.2;margin:0}
p{margin:0 0 .7em}
a{color:var(--accent)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}

.shell{padding-inline:16px;padding-block:12px 0;max-width:1080px;overflow-x:hidden}
.top{position:relative;overflow:hidden;background:var(--mon-bg);color:var(--mon-fg);border-radius:4px 20px 4px 20px;padding:14px 16px;min-height:88px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ecg-svg{position:absolute;inset:0;width:100%;height:100%;opacity:.4}
.ecg{fill:none;stroke:var(--mon-fg);stroke-width:1.5;vector-effect:non-scaling-stroke}
.brand{position:relative}
.brand small{display:block;font-size:.66rem;letter-spacing:.14em;color:var(--mon-dim);text-transform:uppercase}
.brand b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.55rem;color:var(--mon-ink);line-height:1.1}
.read{position:relative;display:flex;gap:16px;text-align:right}
.read span{display:block;font-size:.6rem;letter-spacing:.1em;color:var(--mon-dim)}
.read b{font-size:1.3rem;font-weight:600}
.read .er b{color:var(--tri-laranja)}

.layout{display:block}
main{padding-block:18px 108px;min-width:0}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:4px 8px calc(4px + env(safe-area-inset-bottom, 0px));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail a{flex:1 0 62px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;color:var(--ink2);text-decoration:none;border-radius:8px}
.rail a[aria-current="page"]{color:var(--accent);background:var(--surface2);font-weight:700}
.rail svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:200px minmax(0,780px);gap:36px;margin-top:20px}
  .rail{position:sticky;top:12px;align-self:start;flex-direction:column;border:0;background:none;padding:0;overflow:visible;gap:2px}
  .rail a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:0 12px}
  main{padding-block:0 60px}
}

.vh{margin-bottom:16px}
.vh h1{font-size:1.7rem}
.vh p{color:var(--ink2);margin:4px 0 0;font-size:.95rem}
.flt{color:var(--accent);font-weight:700;white-space:nowrap}
.sec{font-size:1.15rem;margin:26px 0 10px}
.sec small{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-weight:400;color:var(--ink2);font-size:.85rem;margin-left:6px}

.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:8px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g-err{background:var(--bad);border-color:var(--bad);color:var(--on-sem)}
.btn.g-part{background:var(--warn);border-color:var(--warn);color:var(--on-sem)}
.btn.g-ok{background:var(--ok);border-color:var(--ok);color:var(--on-sem)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:.92rem}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));background:var(--surface2);font-weight:700;box-shadow:inset 0 0 0 1px var(--c,var(--accent))}

.bar{height:8px;background:var(--surface2);border-radius:2px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));transition:width .3s}
.hero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 4px 16px;padding:14px 16px;margin-bottom:8px}
.hero .big{font-size:2.1rem;font-weight:600;color:var(--accent);line-height:1}
.hero .bar{flex:1;height:12px}
.hero small{display:block;color:var(--ink2);font-size:.8rem}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n c" "b p";gap:2px 12px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:center}
.trow .tn{grid-area:n;font-weight:700;display:flex;align-items:center;gap:8px}
.trow .tn::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.trow .tc{grid-area:c;color:var(--ink2);font-size:.8rem}
.trow .bar{grid-area:b}
.trow .tp{grid-area:p;font-size:.85rem;text-align:right}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;min-height:96px;padding:12px 12px 12px 16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:3px 16px 3px 16px;text-decoration:none;color:var(--ink)}
.tile svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:1.02rem}
.tile span{font-size:.8rem;color:var(--ink2)}
.tile.warn{border-left-color:var(--tri-laranja)}
.tile:hover{background:var(--surface2)}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}

.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ph .bar{flex:1}
.ph .mono{font-size:.95rem;font-weight:600}
.streak{color:var(--warn)}
.tag{display:inline-block;padding:2px 10px;border-radius:3px;font-size:.75rem;font-weight:700;letter-spacing:.03em;background:var(--surface2);color:var(--ink);border-left:4px solid var(--c,var(--accent));margin-bottom:10px}
.hint{color:var(--ink2);font-size:.8rem;margin-top:14px}

.fcw{perspective:1400px}
.card{display:grid;min-height:290px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s ease}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--line);border-radius:22px 4px 22px 4px;padding:22px 18px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;box-shadow:0 14px 26px -18px var(--shade)}
.face.back{transform:rotateY(180deg);background:var(--surface2);border-color:var(--accent)}
.big{font-size:1.2rem;line-height:1.45}
.big ul,.big ol{padding-left:1.2em;margin:.4em 0}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.nav2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.switch{min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:0 14px;cursor:pointer}
.switch[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2);font-weight:700}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}

.qtext{font-size:1.15rem;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:52px;padding:10px 12px;margin-bottom:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px 14px 8px 14px;cursor:pointer;color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:5px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600}
.opt.sel{border-color:var(--accent);background:var(--surface2)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.vfg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vfg .opt{min-height:92px;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;margin:0;border-radius:4px 22px 4px 22px}
.fb{margin-top:14px;padding:12px 14px;border-left:6px solid var(--ok);background:var(--ok-bg);border-radius:0 12px 12px 0}
.fb.no{border-left-color:var(--bad);background:var(--bad-bg)}
.fb strong.h{display:block;margin-bottom:4px}
details.mini{margin-top:10px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:700}
.next{margin-top:14px;display:flex;justify-content:flex-end}

.score{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.score .mono{font-size:3rem;font-weight:600;color:var(--accent);line-height:1}
.wr{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:0 12px 12px 0;padding:10px 14px;margin-bottom:10px}
.wr .wq{font-weight:700}
.wr .ex{color:var(--ink2);font-size:.95rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px 16px}

textarea,input[type="search"]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:120px;resize:vertical;margin-block:10px}
.pill{font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--surface2)}
.st-nao{background:var(--bad-bg);color:var(--bad)}
.st-parcial{background:var(--warn-bg);color:var(--warn)}
.st-sabia{background:var(--ok-bg);color:var(--ok)}

.grp{font-size:1.05rem;margin:22px 0 6px;color:var(--accent)}
.grp small{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.75rem;color:var(--ink2);margin-left:6px}
details.acc{border:1px solid var(--line);background:var(--surface);border-radius:3px 12px 3px 12px;margin-bottom:8px;padding:0 12px}
details.acc>summary{color:var(--ink);font-weight:400;display:flex;gap:10px;align-items:center;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .mono{font-size:.75rem;color:var(--ink2);flex:none}

.resp{padding-block:4px 12px}
.resp ul,.resp ol{padding-left:1.3em;margin:.4em 0 .8em}
.resp li{margin-bottom:.25em}
.fonte{font-size:.8rem;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px}
.tw{overflow-x:auto;margin-block:12px;border:1px solid var(--line);border-radius:6px}
table.t{border-collapse:collapse;min-width:100%;font-size:.92rem}
table.t th{background:var(--accent);color:var(--on-accent);text-align:left;padding:8px 10px;white-space:nowrap}
table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:var(--surface2)}
.dica{border-left:5px solid var(--tri-amarelo);background:var(--warn-bg);padding:10px 14px;border-radius:0 10px 10px 0;margin-block:12px}
.cor{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:-.1em;margin-inline:.2em;box-shadow:0 0 0 1.5px var(--ink2)}
.cor.vermelho{background:var(--tri-vermelho)}.cor.laranja{background:var(--tri-laranja)}.cor.amarelo{background:var(--tri-amarelo)}
.cor.verde{background:var(--tri-verde)}.cor.azul{background:var(--tri-azul)}.cor.preto{background:var(--tri-preto)}

.reset{margin-top:34px;padding-top:14px;border-top:1px dashed var(--line);font-size:.85rem;color:var(--ink2)}
.reset .link{background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:12px}
</style>
</head>
<body>


<div class="shell">
  <header class="top">
    <svg class="ecg-svg" viewBox="0 0 600 88" preserveAspectRatio="none" aria-hidden="true"><path class="ecg" d="M0 60 H70 L80 60 L88 40 L96 70 L108 12 L120 78 L130 60 H210 L222 52 L236 60 H330 L340 60 L348 40 L356 70 L368 12 L380 78 L390 60 H470 L482 52 L496 60 H600"/></svg>
    <div class="brand"><small>ENC472 · EEAN/UFRJ</small><b>Plantão ENC472</b></div>
    <div class="read mono" aria-live="polite"><div><span>PROG</span><b id="rdP">0%</b></div><div class="er"><span>ERROS</span><b id="rdE">0</b></div></div>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Modos de estudo"></nav>
    <main id="view"></main>
  </div>
</div>

<script>
const DATA = [{"id": "A0-1", "parte": 1, "bloco": "Choque Circulatório e Sepse", "tema": "choque", "num": "1", "pergunta": "Como os consensos nacionais e internacionais definem o choque circulatório e quais são as vertentes fisiopatológicas englobadas nesta definição?", "resposta": "<p>O consenso de 2014 da Sociedade Europeia de Cuidados Intensivos define choque como uma <strong>falência circulatória aguda, generalizada e potencialmente fatal<\/strong>, associada a utilização inadequada de oxigênio a nível celular.<\/p>\n<p>Essa definição engloba duas vertentes fisiopatológicas:<\/p>\n<ul>\n<li><strong>Falência macrocirculatória<\/strong>: a falência circulatória aguda propriamente dita, é a expressão clínica mais acessível do choque e orienta a divisão em subtipos (hipovolêmico, cardiogênico, obstrutivo, distributivo).<\/li>\n<li><strong>Falência microcirculatória<\/strong>: a utilização inadequada de O2 a nível celular, presente sobretudo no choque séptico, onde há incapacidade de extração celular de oxigênio mesmo com entrega mantida.<\/li>\n<\/ul>", "fonte": "Revisão Narrativa (Acta Med Port, Dantas et al., 2021)", "flashcards": [{"f": "Definição de choque (consenso europeu de 2014)", "v": "<strong>Falência circulatória aguda, generalizada e potencialmente fatal<\/strong>, associada a utilização inadequada de oxigênio a nível celular."}, {"f": "Falência macrocirculatória no choque", "v": "É a falência circulatória aguda propriamente dita: expressão clínica <strong>mais acessível<\/strong> e que orienta a divisão em subtipos (hipovolêmico, cardiogênico, obstrutivo, distributivo)."}, {"f": "Falência microcirculatória no choque", "v": "Utilização inadequada de O2 na célula, sobretudo no <strong>choque séptico<\/strong>: a célula não extrai oxigênio mesmo com a entrega mantida."}], "multipla": [{"p": "Qual definição de choque é adotada pelo consenso europeu de 2014?", "o": ["Falência circulatória aguda, generalizada e potencialmente fatal, com utilização inadequada de O2 celular", "Queda isolada da PAM abaixo de 65 mmHg, independentemente da perfusão tecidual", "Falência crônica da bomba cardíaca com retenção hídrica progressiva", "Perda de volume intravascular superior a 30% da volemia total"], "c": 0, "e": "O consenso define choque pela falência circulatória aguda com uso inadequado de O2 celular, não apenas pela pressão arterial."}, {"p": "No choque séptico, a incapacidade de a célula extrair oxigênio mesmo com entrega mantida caracteriza:", "o": ["Falência macrocirculatória", "Falência exclusivamente cardiogênica", "Hipovolemia absoluta", "Falência microcirculatória"], "c": 3, "e": "A falência microcirculatória é a utilização inadequada de O2 celular, presente sobretudo no choque séptico."}], "vf": [{"a": "A falência macrocirculatória é a expressão clínica mais acessível do choque e orienta a divisão em subtipos.", "v": true, "e": "Os subtipos (hipovolêmico, cardiogênico, obstrutivo e distributivo) derivam da falência macrocirculatória."}, {"a": "A falência microcirculatória é definida pela falta de entrega de O2, com extração celular sempre preservada.", "v": false, "e": "Na falência microcirculatória a entrega pode estar mantida, mas a célula não consegue extrair/utilizar o O2."}]}, {"id": "A0-2", "parte": 1, "bloco": "Choque Circulatório e Sepse", "tema": "choque", "num": "2", "pergunta": "Quais são os principais sinais e sintomas clínicos que devem alertar precocemente a(o) enfermeira(o) para a identificação de um quadro de choque circulatório?", "resposta": "<ul>\n<li>Alteração do estado cognitivo/de consciência<\/li>\n<li>Dispneia/taquipneia<\/li>\n<li>Instabilidade hemodinâmica (hipotensão ou taquicardia)<\/li>\n<li>Má perfusão periférica<\/li>\n<li>Diminuição do débito urinário<\/li>\n<li>Elevação do lactato sérico<\/li>\n<li>Sinais de falência de outros órgãos ou sistemas<\/li>\n<\/ul>", "fonte": "Revisão Narrativa (Acta Med Port, Dantas et al., 2021)", "flashcards": [{"f": "Sinais respiratórios e neurológicos de alerta no choque", "v": "<strong>Alteração do estado cognitivo/de consciência<\/strong> e <strong>dispneia/taquipneia<\/strong>."}, {"f": "Sinais hemodinâmicos e de perfusão de alerta no choque", "v": "Hipotensão ou taquicardia (instabilidade hemodinâmica), <strong>má perfusão periférica<\/strong> e diminuição do débito urinário."}, {"f": "Alerta laboratorial e sistêmico do choque", "v": "<strong>Elevação do lactato sérico<\/strong> e sinais de falência de outros órgãos ou sistemas."}], "multipla": [{"p": "Qual conjunto de achados deve alertar precocemente a enfermagem para choque circulatório?", "o": ["Bradicardia, poliúria, pele quente e rosada e hiperglicemia", "Hipertensão, aumento do débito urinário e lactato normal", "Alteração do nível de consciência, taquipneia, má perfusão periférica e diminuição do débito urinário", "Febre isolada com perfusão periférica preservada e diurese normal"], "c": 2, "e": "Rebaixamento cognitivo, dispneia, má perfusão e oligúria refletem hipoperfusão tecidual; poliúria e hipertensão não fazem parte do quadro."}, {"p": "Qual exame laboratorial está elevado e sinaliza choque circulatório?", "o": ["Hemoglobina glicada", "Lactato sérico", "Colesterol total", "Ácido úrico"], "c": 1, "e": "A elevação do lactato sérico é um dos sinais de alerta listados para choque."}], "vf": [{"a": "Diminuição do débito urinário é um dos sinais clínicos de alerta para choque circulatório.", "v": true, "e": "A oligúria indica hipoperfusão renal."}, {"a": "O aumento do débito urinário e a pele bem perfundida são os primeiros sinais de alerta para choque.", "v": false, "e": "Os sinais de alerta são diminuição do débito urinário e má perfusão periférica."}]}, {"id": "A0-3", "parte": 1, "bloco": "Choque Circulatório e Sepse", "tema": "choque", "num": "3", "pergunta": "Numa primeira avaliação do paciente, como é possível diferenciar o choque circulatório obstrutivo do choque circulatório hipovolêmico?", "resposta": "<p>Os dois cursam com <strong>vasoconstrição<\/strong> e débito cardíaco comprometido, mas o estado volêmico intravascular os diferencia:<\/p>\n<table class=\"t\">\n<tr><th><\/th><th>Choque hipovolêmico<\/th><th>Choque obstrutivo<\/th><\/tr>\n<tr><td>Estado volêmico<\/td><td>Depleção intravascular<\/td><td>Sobrecarga hídrica direita (represamento antes da obstrução)<\/td><\/tr>\n<tr><td>Achado de apoio<\/td><td>História de perda de fluido/sangue, veia cava colapsada<\/td><td>Ingurgitamento jugular, veia cava distendida, sinais próprios (desvio de traqueia no pneumotórax, pulso paradoxal no tamponamento)<\/td><\/tr>\n<\/table>\n<p>Ou seja: hipovolêmico \"vazio\" nas câmaras direitas, obstrutivo \"cheio e represado\" antes do ponto de obstrução.<\/p>", "fonte": "Revisão Narrativa (Acta Med Port, Dantas et al., 2021)", "flashcards": [{"f": "O que os choques hipovolêmico e obstrutivo têm em comum?", "v": "Ambos cursam com <strong>vasoconstrição<\/strong> e débito cardíaco comprometido."}, {"f": "Estado volêmico do choque hipovolêmico", "v": "<strong>Depleção intravascular<\/strong>: história de perda de fluido/sangue e veia cava colapsada."}, {"f": "Estado volêmico do choque obstrutivo", "v": "<strong>Sobrecarga hídrica direita<\/strong> (represamento antes da obstrução): ingurgitamento jugular e veia cava distendida."}, {"f": "Sinais próprios do choque obstrutivo", "v": "Desvio de traqueia no <strong>pneumotórax<\/strong> e pulso paradoxal no <strong>tamponamento<\/strong> cardíaco."}], "multipla": [{"p": "Paciente em choque com ingurgitamento jugular e veia cava distendida. Qual o tipo mais provável?", "o": ["Hipovolêmico", "Obstrutivo", "Distributivo neurogênico", "Hipovolêmico por hemorragia"], "c": 1, "e": "Jugulares ingurgitadas e cava distendida indicam represamento antes da obstrução, típico do obstrutivo; no hipovolêmico a cava é colapsada."}, {"p": "Paciente com história de perda sanguínea importante e veia cava colapsada. Qual o tipo de choque?", "o": ["Hipovolêmico", "Obstrutivo", "Cardiogênico obstrutivo", "Séptico"], "c": 0, "e": "História de perda de fluido/sangue com cava colapsada indica depleção intravascular, característica do hipovolêmico."}], "vf": [{"a": "Os choques hipovolêmico e obstrutivo cursam com vasoconstrição e débito cardíaco comprometido.", "v": true, "e": "O que os diferencia é o estado volêmico intravascular."}, {"a": "No choque obstrutivo a veia cava está colapsada, como no hipovolêmico.", "v": false, "e": "No obstrutivo a veia cava está distendida e há ingurgitamento jugular."}]}, {"id": "A0-4", "parte": 1, "bloco": "Choque Circulatório e Sepse", "tema": "sepse", "num": "4", "pergunta": "Como o Guideline da Surviving Sepsis Campaign (SSC) de 2026 define a sepse e o choque séptico?", "resposta": "<p>O SSC 2026 mantém as definições de <strong>Sepsis-3<\/strong>: sepse é a disfunção orgânica com risco de vida causada por uma resposta desregulada do hospedeiro à infecção; choque séptico é o subtipo de sepse com disfunções circulatórias e celulares/metabólicas graves, identificado clinicamente por <strong>hipotensão com necessidade de vasopressor para manter PAM ≥ 65 mmHg<\/strong> associada a <strong>lactato > 2 mmol/L<\/strong> após ressuscitação volêmica adequada.<\/p>\n<p>O guideline também traz categorias de probabilidade diagnóstica (sepse confirmada, provável, possível e improvável), que orientam o tempo de antibioticoterapia.<\/p>", "fonte": "SSC 2026; Sepsis-3 (Singer et al., 2016)", "flashcards": [{"f": "Definição de sepse (Sepsis-3, mantida no SSC 2026)", "v": "<strong>Disfunção orgânica com risco de vida<\/strong> causada por resposta desregulada do hospedeiro à infecção."}, {"f": "Critérios do choque séptico (SSC 2026)", "v": "Hipotensão com <strong>vasopressor para manter PAM ≥ 65 mmHg<\/strong> e <strong>lactato > 2 mmol/L<\/strong>, após ressuscitação volêmica adequada."}, {"f": "Categorias de probabilidade diagnóstica no SSC 2026", "v": "Sepse <strong>confirmada, provável, possível e improvável<\/strong>: orientam o tempo de antibioticoterapia."}], "multipla": [{"p": "Segundo o SSC 2026, o choque séptico é identificado clinicamente por:", "o": ["PAM &lt; 65 mmHg com lactato ≥ 4 mmol/L, independentemente do uso de vasopressor", "Vasopressor para PAM ≥ 65 mmHg e lactato > 4 mmol/L após volume", "Apenas dois ou mais critérios de SIRS com foco infeccioso", "Vasopressor para manter PAM ≥ 65 mmHg e lactato > 2 mmol/L após volume adequado"], "c": 3, "e": "O choque séptico exige vasopressor para PAM ≥ 65 mmHg mais lactato > 2 mmol/L após ressuscitação volêmica; o corte de lactato não é 4."}, {"p": "Como o SSC 2026 define sepse?", "o": ["Presença de dois ou mais critérios de SIRS com hemocultura positiva", "Infecção localizada sem repercussão sistêmica, tratada ambulatorialmente", "Disfunção orgânica com risco de vida por resposta desregulada do hospedeiro à infecção", "Qualquer quadro febril com leucocitose"], "c": 2, "e": "O SSC 2026 mantém a definição Sepsis-3, baseada em disfunção orgânica, não em SIRS."}], "vf": [{"a": "O SSC 2026 mantém as definições de Sepsis-3.", "v": true, "e": "Sepse é disfunção orgânica por resposta desregulada à infecção."}, {"a": "No SSC 2026, o choque séptico exige lactato > 4 mmol/L após ressuscitação volêmica.", "v": false, "e": "O critério de lactato do choque séptico é > 2 mmol/L."}]}, {"id": "A0-5", "parte": 1, "bloco": "Choque Circulatório e Sepse", "tema": "sepse", "num": "5", "pergunta": "Qual é a recomendação atual sobre o uso do qSOFA como ferramenta para o rastreio de sepse em pacientes internados?", "resposta": "<p>O SSC 2026 <strong>recomenda contra o uso isolado do qSOFA<\/strong> como ferramenta única de rastreio: para pacientes internados adultos, recomenda-se usar NEWS, NEWS2, MEWS ou SIRS em vez do qSOFA como ferramenta isolada (recomendação forte, evidência de certeza moderada), já que o qSOFA tem baixa sensibilidade (23,1% pré-hospitalar) apesar de estudos recentes mostrarem utilidade em sistemas de alerta eletrônico para detectar deterioração c possível sepse sem choque?", "resposta": "<ul>\n<li><strong>Choque séptico (possível, provável ou confirmado)<\/strong>: administração imediata, idealmente dentro de <strong>1 hora<\/strong> do reconhecimento (recomendação forte).<\/li>\n<li><strong>Sepse provável ou confirmada sem choque<\/strong>: também imediata, idealmente dentro de <strong>1 hora<\/strong>.<\/li>\n<li><strong>Possível sepse sem choque<\/strong>: avaliação rápida da causa infecciosa vs. não infecciosa; se a suspeita de infecção persistir, administrar em até <strong>3 horas<\/strong> do momento em que a sepse foi suspeitada.<\/li>\n<\/ul>", "fonte": "SSC 2026", "flashcards": [{"f": "Tempo do antimicrobiano no choque séptico (SSC 2026)", "v": "<strong>Imediato, idealmente em até 1 hora<\/strong> do reconhecimento (recomendação forte)."}, {"f": "Tempo do antimicrobiano na sepse provável/confirmada sem choque", "v": "Também <strong>imediato, idealmente em até 1 hora<\/strong>."}, {"f": "Tempo do antimicrobiano na possível sepse sem choque", "v": "Avaliação rápida da causa infecciosa vs. não infecciosa; se a suspeita persistir, antimicrobiano em até <strong>3 horas<\/strong> da suspeita."}], "multipla": [{"p": "Paciente com choque séptico. Qual o prazo ideal para o antimicrobiano?", "o": ["Imediato, idealmente em até 1 hora do reconhecimento", "Em até 3 horas do reconhecimento", "Em até 6 horas, após resultado das culturas", "Em até 12 horas, após estabilização hemodinâmica"], "c": 0, "e": "Choque séptico exige antimicrobiano imediato, idealmente em 1 hora; o prazo de 3 horas vale só para possível sepse sem choque."}, {"p": "Em possível sepse sem choque, com suspeita de infecção persistindo após avaliação rápida, o antimicrobiano deve ser dado em até:", "o": ["1 hora do momento da suspeita", "6 horas do momento da suspeita", "24 horas do momento da suspeita", "3 horas do momento da suspeita"], "c": 3, "e": "Na possível sepse sem choque há tempo para avaliar a causa; se a suspeita de infecção persistir, o limite é 3 horas."}], "vf": [{"a": "Na sepse provável ou confirmada sem choque, o antimicrobiano também deve ser imediato, idealmente em até 1 hora.", "v": true, "e": "A janela de 1 hora vale para o choque séptico e para a sepse provável ou confirmada."}, {"a": "Na possível sepse sem choque, o antimicrobiano deve ser dado em até 1 hora, sem avaliação da causa.", "v": false, "e": "Nesse caso faz-se avaliação rápida e, persistindo a suspeita, o prazo é de até 3 horas."}]}, {"id": "A1-1", "parte": 2, "bloco": "AE na Sepse", "tema": "sepse", "num": "1", "pergunta": "Explique a diferença entre sepse e choque séptico, destacando os critérios clínicos necessários para identificar o choque séptico.", "resposta": "<p><strong>Sepse<\/strong> é a disfunção orgânica com risco de vida causada por resposta inflamatória sistêmica exacerbada desencadeada por agente infeccioso (bactéria, fungo, vírus ou protozoário). O <strong>choque séptico<\/strong> é uma complicação da sepse, com disfunções circulatórias e celulares/metabólicas graves que aumentam substancialmente o risco de morte.<\/p>\n<p>Critérios clínicos do choque séptico: <strong>hipotensão persistente com necessidade de vasopressor<\/strong> para manter PAM ≥ 65 mmHg (idosos: 60-65 mmHg, hipotensão permissiva), associada a <strong>lactato > 2 mmol/L<\/strong> mesmo após ressuscitação volêmica adequada.<\/p>", "fonte": "Aula AE na Sepse 2026 (EEAN/UFRJ); Sepsis-3", "flashcards": [{"f": "Sepse vs. choque séptico", "v": "Sepse é a disfunção orgânica com risco de vida por resposta inflamatória exacerbada a agente infeccioso. <strong>Choque séptico é uma complicação da sepse<\/strong>, com disfunção circulatória e celular/metabólica grave."}, {"f": "Critérios clínicos do choque séptico", "v": "<strong>Hipotensão persistente com vasopressor<\/strong> para PAM ≥ 65 mmHg + <strong>lactato > 2 mmol/L<\/strong> após ressuscitação volêmica adequada."}, {"f": "Meta de PAM em idosos no choque séptico", "v": "<strong>60 a 65 mmHg<\/strong> (hipotensão permissiva)."}], "multipla": [{"p": "Qual afirmação diferencia corretamente sepse de choque séptico?", "o": ["A sepse exige vasopressor e lactato > 2 mmol/L, e o choque séptico não", "O choque séptico ocorre sem infecção, e a sepse sempre com infecção", "São sinônimos, sem diferença de gravidade ou prognóstico", "O choque séptico é uma complicação da sepse, com disfunção circulatória e metabólica grave"], "c": 3, "e": "O choque séptico é o subtipo mais grave, com hipotensão que exige vasopressor e lactato elevado."}, {"p": "Paciente séptico com PAM 58 mmHg em uso de noradrenalina, lactato 3,2 mmol/L após volume adequado. Isso corresponde a:", "o": ["Sepse sem choque", "Choque hipovolêmico", "Choque séptico", "Choque cardiogênico"], "c": 2, "e": "Vasopressor para manter a PAM mais lactato > 2 mmol/L após volume adequado define o choque séptico."}], "vf": [{"a": "Em idosos, admite-se meta de PAM de 60 a 65 mmHg (hipotensão permissiva) no choque séptico.", "v": true, "e": "Para adultos em geral a meta é PAM ≥ 65 mmHg; em idosos aceita-se 60 a 65."}, {"a": "O choque séptico é definido por lactato > 2 mmol/L mesmo sem necessidade de vasopressor.", "v": false, "e": "O critério exige hipotensão persistente com vasopressor associada ao lactato > 2 mmol/L."}]}, {"id": "A1-2", "parte": 2, "bloco": "AE na Sepse", "tema": "sepse", "num": "2", "pergunta": "Descreva a dinâmica imunológica da sepse, explicando o balanço entre a fase de hiperinflamação e a fase de imunossupressão.", "resposta": "<p>Após a resposta imune inata inicial, há dois picos de risco de morte:<\/p>\n<ul>\n<li><strong>Fase de hiperinflamação<\/strong>: resposta inflamatória exacerbada precoce, responsável por cerca de 10% das mortes.<\/li>\n<li><strong>Fase de imunossupressão<\/strong>: por incapacidade de combater infecções secundárias, resposta imune adaptativa deprimida, responsável por cerca de 30% das mortes (mais tardia).<\/li>\n<\/ul>\n<p>Cerca de 60% dos pacientes atingem homeostase e recuperação. O equilíbrio entre essas duas fases determina o desfecho.<\/p>", "fonte": "Aula AE na Sepse 2026 (EEAN/UFRJ)", "flashcards": [{"f": "Fase de hiperinflamação da sepse", "v": "Resposta inflamatória exacerbada <strong>precoce<\/strong>, responsável por cerca de <strong>10% das mortes<\/strong>."}, {"f": "Fase de imunossupressão da sepse", "v": "Resposta imune adaptativa deprimida, com incapacidade de combater infecções secundárias: cerca de <strong>30% das mortes<\/strong> (mais tardia)."}, {"f": "Percentual de pacientes que atingem homeostase e recuperação na sepse", "v": "Cerca de <strong>60%<\/strong>."}], "multipla": [{"p": "Qual fase da sepse responde por cerca de 30% das mortes, por incapacidade de combater infecções secundárias?", "o": ["Hiperinflamação", "Imunossupressão", "Resposta imune inata inicial", "Homeostase e recuperação"], "c": 1, "e": "A imunossupressão é mais tardia e responde por cerca de 30% das mortes; a hiperinflamação, por cerca de 10%."}, {"p": "Na dinâmica imunológica da sepse, a hiperinflamação precoce é responsável por aproximadamente:", "o": ["10% das mortes", "30% das mortes", "60% das mortes", "90% das mortes"], "c": 0, "e": "A hiperinflamação responde por cerca de 10% das mortes; cerca de 60% dos pacientes se recuperam."}], "vf": [{"a": "A fase de imunossupressão é mais tardia e responde por mais mortes que a hiperinflamação precoce.", "v": true, "e": "Imunossupressão: cerca de 30% das mortes; hiperinflamação: cerca de 10%."}, {"a": "A hiperinflamação precoce responde por cerca de 30% das mortes, e a imunossupressão por cerca de 10%.", "v": false, "e": "Os valores estão trocados: hiperinflamação 10% e imunossupressão 30%."}]}, {"id": "A1-3", "parte": 2, "bloco": "AE na Sepse", "tema": "sepse", "num": "3", "pergunta": "Como o desequilíbrio entre a permeabilidade vascular e a perfusão tecidual durante o estado de edema inflamatório contribui para a hipóxia celular?", "resposta": "<p>Citocinas liberadas por leucócitos ativados aumentam a permeabilidade vascular dos capilares e causam vasodilatação. Isso desloca líquido do capilar para o interstício (edema), reduzindo o volume circulante efetivo e a perfusão tissular. Com menor entrega e maior distância de difusão de O2 até a célula, ocorre queda na oferta de O2 e aumento relativo do consumo, gerando <strong>disfunção celular e orgânica<\/strong> (hipóxia mesmo com débito cardíaco preservado).<\/p>", "fonte": "Aula AE na Sepse 2026 (EEAN/UFRJ)", "flashcards": [{"f": "Efeito das citocinas na microcirculação da sepse", "v": "Aumentam a <strong>permeabilidade vascular<\/strong> dos capilares e causam <strong>vasodilatação<\/strong>."}, {"f": "Consequência do edema inflamatório na perfusão", "v": "O líquido sai do capilar para o interstício, reduzindo o <strong>volume circulante efetivo<\/strong> e a perfusão tissular."}, {"f": "Por que há hipóxia celular na sepse mesmo com débito cardíaco preservado?", "v": "Menor entrega e <strong>maior distância de difusão<\/strong> de O2 até a célula: cai a oferta e aumenta o consumo relativo, gerando disfunção celular e orgânica."}], "multipla": [{"p": "Como o edema inflamatório da sepse contribui para a hipóxia celular?", "o": ["Desloca líquido para o interstício, reduz o volume circulante efetivo e aumenta a distância de difusão de O2", "Aumenta o volume circulante efetivo e sobrecarrega o ventrículo direito", "Reduz a permeabilidade capilar e diminui o consumo de O2", "Provoca vasoconstrição periférica com aumento da oferta de O2 à célula"], "c": 0, "e": "Citocinas aumentam a permeabilidade e causam vasodilatação, o que leva a edema e menor perfusão."}, {"p": "Qual efeito das citocinas liberadas por leucócitos ativados na sepse?", "o": ["Diminuição da permeabilidade vascular e vasoconstrição", "Aumento da oferta de O2 pela redução do edema", "Estabilização do volume circulante efetivo", "Aumento da permeabilidade vascular e vasodilatação"], "c": 3, "e": "As citocinas aumentam a permeabilidade capilar e causam vasodilatação, iniciando o edema inflamatório."}], "vf": [{"a": "Na sepse, pode haver hipóxia celular mesmo com débito cardíaco preservado.", "v": true, "e": "O edema aumenta a distância de difusão de O2 e reduz a perfusão tissular."}, {"a": "O edema inflamatório da sepse aumenta o volume circulante efetivo e melhora a perfusão tissular.", "v": false, "e": "O edema desloca líquido para o interstício e reduz o volume circulante efetivo."}]}, {"id": "A1-4", "parte": 2, "bloco": "AE na Sepse", "tema": "sepse", "num": "4", "pergunta": "Cite ao menos três indicadores de disfunção orgânica (em sistemas diferentes) que podem sinalizar o diagnóstico de sepse, mesmo na ausência de critérios de SIRS.", "resposta": "<ul>\n<li><strong>Renal<\/strong>: oligúria (≤ 0,5 mL/kg/h) ou elevação de creatinina (> 2 mg/dL)<\/li>\n<li><strong>Hematológico<\/strong>: plaquetas < 100.000/mm³ ou queda de 50% em relação ao maior valor nos últimos 3 dias<\/li>\n<li><strong>Respiratório<\/strong>: relação PaO2/FiO2 < 300 ou necessidade de O2 para manter SpO2 > 90%<\/li>\n<li><strong>Hepático<\/strong>: elevação significativa de bilirrubinas (> 2x o valor de referência)<\/li>\n<li><strong>Neurológico<\/strong>: rebaixamento do nível de consciência, agitação, delirium<\/li>\n<\/ul>\n<div class=\"dica\">A presença de qualquer disfunção orgânica, sem outra explicação e com foco infeccioso presumível, já basta para diagnosticar sepse e iniciar o pacote de tratamento, mesmo sem SIRS.<\/div>", "fonte": "Aula AE na Sepse 2026 (EEAN/UFRJ)", "flashcards": [{"f": "Disfunção renal como indicador de sepse", "v": "<strong>Oligúria (≤ 0,5 mL/kg/h)<\/strong> ou creatinina > 2 mg/dL."}, {"f": "Disfunção hematológica como indicador de sepse", "v": "<strong>Plaquetas &lt; 100.000/mm³<\/strong> ou queda de 50% em relação ao maior valor nos últimos 3 dias."}, {"f": "Disfunção respiratória como indicador de sepse", "v": "<strong>PaO2/FiO2 &lt; 300<\/strong> ou necessidade de O2 para manter SpO2 > 90%."}, {"f": "Disfunção hepática e neurológica como indicadores de sepse", "v": "Hepática: bilirrubinas > 2x o valor de referência. Neurológica: rebaixamento da consciência, agitação, delirium."}], "multipla": [{"p": "Qual valor indica disfunção hematológica na sepse?", "o": ["Plaquetas &lt; 300.000/mm³", "Plaquetas > 450.000/mm³", "Plaquetas &lt; 100.000/mm³", "Leucócitos &lt; 100.000/mm³"], "c": 2, "e": "Plaquetas &lt; 100.000/mm³ ou queda de 50% em 3 dias sinalizam disfunção hematológica."}, {"p": "Qual achado indica disfunção respiratória na sepse?", "o": ["Relação PaO2/FiO2 > 400", "Relação PaO2/FiO2 &lt; 300", "SpO2 de 98% em ar ambiente", "Relação PaO2/FiO2 &lt; 30"], "c": 1, "e": "PaO2/FiO2 &lt; 300 ou necessidade de O2 para SpO2 > 90% caracteriza disfunção respiratória."}], "vf": [{"a": "A presença de disfunção orgânica com foco infeccioso presumível já basta para diagnosticar sepse, mesmo sem SIRS.", "v": true, "e": "Nesse caso já se inicia o pacote de tratamento."}, {"a": "Oligúria como indicador de disfunção renal na sepse é definida como débito urinário ≤ 2 mL/kg/h.", "v": false, "e": "O critério é ≤ 0,5 mL/kg/h."}]}, {"id": "A1-5", "parte": 2, "bloco": "AE na Sepse", "tema": "sepse", "num": "5", "pergunta": "Um paciente com suspeita de pneumonia chega ao pronto-socorro apresentando hipotensão persistente (PAM &lt; 65 mmHg) e lactato de 4,5 mmol/L. Com base no \"Bundle de 1 hora\", descreva a sequência de ações prioritárias que a equipe deve realizar.", "resposta": "<ul>\n<li>Dosar lactato (repetir após correção, já que o valor inicial é > 2 mmol/L)<\/li>\n<li>Coletar hemoculturas (preferencialmente antes do antibiótico)<\/li>\n<li>Administrar antibióticos de amplo espectro<\/li>\n<li>Iniciar infusão rápida de cristaloides 30 mL/kg (indicada por hipotensão e lactato ≥ 4 mmol/L)<\/li>\n<li>Administrar vasopressores durante ou após a ressuscitação volêmica para manter PAM ≥ 65 ± 5 mmHg<\/li>\n<\/ul>\n<p>Todas essas ações devem ocorrer dentro da <strong>primeira hora<\/strong> de reconhecimento do quadro.<\/p>", "fonte": "Aula AE na Sepse 2026 (EEAN/UFRJ); SSC 2026", "flashcards": [{"f": "Lactato no bundle de 1 hora", "v": "Dosar lactato e <strong>repetir após correção<\/strong> se o valor inicial for > 2 mmol/L."}, {"f": "Condutas de coleta e antibiótico no bundle de 1 hora", "v": "Coletar <strong>hemoculturas, preferencialmente antes do antibiótico<\/strong>, e administrar antibióticos de amplo espectro."}, {"f": "Volume de cristaloide no bundle de 1 hora", "v": "<strong>30 mL/kg<\/strong> de infusão rápida, indicada por hipotensão e lactato ≥ 4 mmol/L."}, {"f": "Meta do vasopressor no bundle de 1 hora", "v": "Durante ou após a ressuscitação volêmica, para manter <strong>PAM ≥ 65 ± 5 mmHg<\/strong>."}], "multipla": [{"p": "Paciente com PAM &lt; 65 mmHg e lactato de 4,5 mmol/L. No bundle de 1 hora, qual volume de cristaloide rápido está indicado?", "o": ["10 mL/kg", "30 mL/kg", "20 mL/kg", "60 mL/kg"], "c": 1, "e": "Hipotensão e lactato ≥ 4 mmol/L indicam infusão rápida de cristaloides 30 mL/kg."}, {"p": "No bundle de 1 hora, qual a ordem correta entre coleta de hemoculturas e antibiótico?", "o": ["Hemoculturas preferencialmente antes do antibiótico", "Antibiótico obrigatoriamente antes das hemoculturas", "Hemoculturas só após 6 horas de antibiótico", "Hemoculturas dispensáveis se o lactato estiver alto"], "c": 0, "e": "As hemoculturas devem ser coletadas preferencialmente antes do antibiótico."}], "vf": [{"a": "No bundle de 1 hora, o lactato inicial > 2 mmol/L deve ser repetido após a correção.", "v": true, "e": "A dosagem repetida acompanha a resposta às medidas."}, {"a": "No bundle de 1 hora, o vasopressor deve ser administrado antes de qualquer volume, para manter PAM ≥ 65 ± 5 mmHg.", "v": false, "e": "O vasopressor é administrado durante ou após a ressuscitação volêmica."}]}, {"id": "A1-6", "parte": 2, "bloco": "AE na Sepse", "tema": "sepse", "num": "6", "pergunta": "Explique o objetivo dos escores de alerta precoce, como o NEWS e o MEWS, detalhando como a pontuação total auxilia a equipe na detecção precoce da deterioração clínica e na definição da urgência da resposta assistencial.", "resposta": "<p>NEWS, NEWS2, MEWS e SIRS são válidos para triagem de risco de sepse e avaliação de deterioração clínica, mas <strong>não servem para diagnóstico de sepse<\/strong>. Cada escore soma pontos de parâmetros fisiológicos (FR, FC, PAS, SpO2, temperatura, nível de consciência); quanto maior o somatório, maior o risco clínico e mais urgente a resposta.<\/p>\n<table class=\"t\">\n<tr><th>Escore<\/th><th>Faixa/cor de alerta máximo<\/th><th>Conduta<\/th><\/tr>\n<tr><td>NEWS2<\/td><td>≥ 7 pontos<\/td><td>Resposta urgente/emergência, equipe de terapia intensiva<\/td><\/tr>\n<tr><td>MEWS<\/td><td>3-4 (vermelho) / &gt;4<\/td><td>Reavaliação em 1-4h / intervenção imediata<\/td><\/tr>\n<\/table>", "fonte": "Aula AE na Sepse 2026 (EEAN/UFRJ)", "flashcards": [{"f": "Finalidade do NEWS, NEWS2, MEWS e SIRS", "v": "Triagem de risco de sepse e avaliação de deterioração clínica, mas <strong>não servem para diagnosticar sepse<\/strong>."}, {"f": "Parâmetros somados nos escores de alerta precoce", "v": "FR, FC, PAS, SpO2, temperatura e nível de consciência: <strong>quanto maior a soma, maior o risco e mais urgente a resposta<\/strong>."}, {"f": "Alerta máximo do NEWS2", "v": "<strong>≥ 7 pontos<\/strong>: resposta urgente/emergência, equipe de terapia intensiva."}, {"f": "Faixas de alerta do MEWS", "v": "<strong>3-4 (vermelho)<\/strong>: reavaliação em 1-4 h. <strong>> 4<\/strong>: intervenção imediata."}], "multipla": [{"p": "Os escores NEWS e MEWS são úteis para:", "o": ["Diagnóstico definitivo de sepse", "Substituir a dosagem de lactato", "Definir apenas a dose do vasopressor", "Triagem de risco e detecção de deterioração clínica, sem servir para diagnosticar sepse"], "c": 3, "e": "São escores de triagem de risco e deterioração; o diagnóstico de sepse segue outros critérios."}, {"p": "Paciente com NEWS2 = 7. Qual a conduta indicada?", "o": ["Reavaliação de rotina em 12 horas", "Apenas registrar em prontuário e manter conduta", "Resposta urgente/emergência, com equipe de terapia intensiva", "Alta assistida com retorno se piorar"], "c": 2, "e": "NEWS2 ≥ 7 é o alerta máximo e exige resposta urgente/emergência com equipe de terapia intensiva."}], "vf": [{"a": "Quanto maior a pontuação total do escore de alerta precoce, maior o risco clínico e mais urgente a resposta.", "v": true, "e": "A soma dos parâmetros fisiológicos define a urgência da resposta."}, {"a": "No MEWS, pontuação > 4 indica reavaliação em 1 a 4 horas.", "v": false, "e": "MEWS > 4 indica intervenção imediata; a reavaliação em 1 a 4 h corresponde a 3-4 pontos."}]}, {"id": "A1-7", "parte": 2, "bloco": "AE na Sepse", "tema": "sepse", "num": "7", "pergunta": "Descreva a importância do controle glicêmico no paciente séptico, indicando a meta recomendada pelo manual e explicando como a hiperglicemia pode interferir negativamente no metabolismo celular e no combate aos microrganismos.", "resposta": "<p>A meta apresentada na aula é manter a glicemia entre <strong>144 e 180 mg/dL<\/strong>, garantindo oferta adequada de nutrientes ao metabolismo celular e controle do crescimento microbiano. O SSC 2026 recomenda iniciar insulinoterapia quando a glicemia atingir <strong>≥ 180 mg/dL<\/strong> (recomendação forte).<\/p>\n<p>A hiperglicemia favorece o crescimento de microrganismos, agrava a acidose metabólica e a hiperlactatemia, e compromete o metabolismo celular já prejudicado pela hipóxia da sepse.<\/p>", "fonte": "Aula AE na Sepse 2026 (EEAN/UFRJ); SSC 2026", "flashcards": [{"f": "Meta de glicemia no paciente séptico (aula)", "v": "Manter entre <strong>144 e 180 mg/dL<\/strong>."}, {"f": "Quando iniciar insulinoterapia no SSC 2026?", "v": "Quando a glicemia atingir <strong>≥ 180 mg/dL<\/strong> (recomendação forte)."}, {"f": "Efeitos negativos da hiperglicemia na sepse", "v": "Favorece o crescimento de microrganismos, agrava <strong>acidose metabólica e hiperlactatemia<\/strong> e compromete o metabolismo celular."}], "multipla": [{"p": "Qual a meta de glicemia apresentada para o paciente séptico?", "o": ["80 a 100 mg/dL", "200 a 250 mg/dL", "144 a 180 mg/dL", "Acima de 250 mg/dL"], "c": 2, "e": "A meta é manter entre 144 e 180 mg/dL, com oferta de nutrientes e controle do crescimento microbiano."}, {"p": "Segundo o SSC 2026, a insulinoterapia deve ser iniciada quando a glicemia atinge:", "o": ["≥ 100 mg/dL", "≥ 180 mg/dL", "≥ 144 mg/dL", "≥ 300 mg/dL"], "c": 1, "e": "O SSC 2026 recomenda iniciar insulina com glicemia ≥ 180 mg/dL; 144 é apenas o limite inferior da meta."}], "vf": [{"a": "A hiperglicemia no paciente séptico favorece o crescimento de microrganismos e agrava a acidose e a hiperlactatemia.", "v": true, "e": "Ela também compromete o metabolismo celular já prejudicado pela hipóxia."}, {"a": "O SSC 2026 recomenda iniciar insulina quando a glicemia atingir ≥ 144 mg/dL.", "v": false, "e": "O limiar recomendado para iniciar insulina é ≥ 180 mg/dL."}]}, {"id": "B0-1", "parte": 2, "bloco": "AE em PCR e RCP em Adultos", "tema": "pcr", "num": "1", "pergunta": "Descreva os três sinais clínicos principais para o reconhecimento imediato de uma PCR e explique por que a respiração agônica (gasping) pode ser um sinal enganador para socorristas leigos.", "resposta": "<ul>\n<li><strong>Irresponsividade<\/strong> (não responde a estímulos)<\/li>\n<li><strong>Ausência de respiração normal<\/strong> ou respiração anormal<\/li>\n<li><strong>Ausência de pulso central<\/strong> palpável (avaliação feita pelo profissional treinado)<\/li>\n<\/ul>\n<p>O <strong>gasping<\/strong> (respiração agônica) é um padrão respiratório reflexo do tronco encefálico em hipóxia grave, com movimentos irregulares e ruidosos. O socorrista leigo pode interpretar isso como \"respiração normal\" e deixar de iniciar a RCP, retardando o atendimento.<\/p>", "fonte": "AHA 2020", "flashcards": [{"f": "Três sinais clínicos para reconhecer uma PCR", "v": "<strong>Irresponsividade<\/strong>, <strong>ausência de respiração normal<\/strong> (ou respiração anormal) e <strong>ausência de pulso central<\/strong> palpável."}, {"f": "Quem avalia o pulso central no reconhecimento da PCR?", "v": "O <strong>profissional treinado<\/strong>. A ausência de pulso central palpável é avaliada por ele."}, {"f": "O que é gasping (respiração agônica)?", "v": "Padrão respiratório <strong>reflexo do tronco encefálico<\/strong> em hipóxia grave, com movimentos irregulares e ruidosos."}, {"f": "Por que o gasping engana o socorrista leigo?", "v": "Ele pode interpretá-lo como <strong>respiração normal<\/strong> e não iniciar a RCP, <strong>retardando o atendimento<\/strong>."}], "multipla": [{"p": "Vítima não responde e apresenta movimentos irregulares e ruidosos da boca, sem pulso central palpável. Qual é a interpretação correta?", "o": ["Sono profundo, estimular novamente", "PCR com gasping, iniciar RCP", "Respiração normal, apenas observar", "Crise convulsiva, aguardar"], "c": 1, "e": "Gasping é reflexo do tronco encefálico em hipóxia grave e, com irresponsividade e ausência de pulso, indica PCR."}, {"p": "Por que o gasping é um sinal enganador para o leigo?", "o": ["Aparece só em vítimas de trauma", "Parece respiração normal e atrasa a RCP", "Sempre vem com pulso central presente", "Indica que o coração ainda bombeia bem"], "c": 1, "e": "O leigo pode achar que é respiração normal e deixar de iniciar a RCP."}], "vf": [{"a": "Irresponsividade, ausência de respiração normal e ausência de pulso central são os três sinais de reconhecimento da PCR.", "v": true, "e": "São os três sinais principais descritos."}, {"a": "O gasping é um sinal confiável de que a respiração está normal e a RCP pode ser adiada.", "v": false, "e": "O gasping é reflexo do tronco encefálico em hipóxia grave, não respiração normal."}]}, {"id": "B0-2", "parte": 2, "bloco": "AE em PCR e RCP em Adultos", "tema": "pcr", "num": "2", "pergunta": "Explique o acrônimo CABD e justifique por que as compressões torácicas (\"C\") são a prioridade absoluta no atendimento inicial.", "resposta": "<ul>\n<li><strong>C<\/strong>: Circulation (compressões torácicas)<\/li>\n<li><strong>A<\/strong>: Airway (via aérea)<\/li>\n<li><strong>B<\/strong>: Breathing (ventilação)<\/li>\n<li><strong>D<\/strong>: Defibrillation (desfibrilação)<\/li>\n<\/ul>\n<p>As compressões vêm primeiro porque geram o fluxo sanguíneo mínimo que mantém a perfusão cerebral e coronariana; sem circulação, oxigênio nas vias aéreas não chega aos tecidos. Iniciar por A ou B atrasa a única medida capaz de manter perfusão até a desfibrilação.<\/p>", "fonte": "fisiologia consolidada / AHA 2020", "flashcards": [{"f": "O que significa o acrônimo CABD?", "v": "<strong>C<\/strong> Circulation (compressões), <strong>A<\/strong> Airway (via aérea), <strong>B<\/strong> Breathing (ventilação), <strong>D<\/strong> Defibrillation (desfibrilação)."}, {"f": "Qual a primeira letra do CABD e o que ela representa?", "v": "<strong>C<\/strong>: Circulation, ou seja, as <strong>compressões torácicas<\/strong>."}, {"f": "Por que as compressões vêm antes da via aérea?", "v": "Geram o <strong>fluxo sanguíneo mínimo<\/strong> que mantém a perfusão cerebral e coronariana. Sem circulação, o O2 não chega aos tecidos."}, {"f": "O que ocorre se iniciar por A ou B?", "v": "<strong>Atrasa<\/strong> a única medida capaz de manter perfusão até a desfibrilação."}], "multipla": [{"p": "Na sequência CABD, a letra D corresponde a:", "o": ["Desfibrilação", "Drenagem", "Drogas", "Diagnóstico"], "c": 0, "e": "D é Defibrillation (desfibrilação)."}, {"p": "Por que as compressões torácicas são a prioridade absoluta no início da PCR?", "o": ["Porque a via aérea nunca precisa ser abordada", "Porque dispensam a desfibrilação depois", "Porque o O2 nas vias aéreas chega sozinho aos tecidos", "Porque geram fluxo mínimo que mantém perfusão cerebral e coronariana"], "c": 3, "e": "Sem circulação, oxigênio nas vias aéreas não chega aos tecidos; as compressões mantêm perfusão até a desfibrilação."}], "vf": [{"a": "No CABD, a letra B representa Breathing (ventilação).", "v": true, "e": "B é Breathing, a ventilação."}, {"a": "Iniciar a RCP pela via aérea (A) é preferível porque garante perfusão cerebral antes das compressões.", "v": false, "e": "Sem circulação, o oxigênio não chega aos tecidos; iniciar por A atrasa a medida que mantém a perfusão."}]}, {"id": "B0-3", "parte": 2, "bloco": "AE em PCR e RCP em Adultos", "tema": "pcr", "num": "3", "pergunta": "Quais são os componentes necessários para garantir uma RCP de alta qualidade em termos de profundidade, frequência, retorno do tórax e interrupções?", "resposta": "<table class=\"t\">\n<tr><th>Componente<\/th><th>Meta<\/th><\/tr>\n<tr><td>Profundidade<\/td><td>5 a 6 cm<\/td><\/tr>\n<tr><td>Frequência<\/td><td>100 a 120 compressões/min<\/td><\/tr>\n<tr><td>Retorno do tórax<\/td><td>Total, sem apoiar-se sobre o tórax entre compressões<\/td><\/tr>\n<tr><td>Fração de compressão<\/td><td>Maior que 60%, idealmente próxima de 80% do tempo total<\/td><\/tr>\n<tr><td>Interrupções<\/td><td>Minimizadas, menos de 10 segundos<\/td><\/tr>\n<\/table>", "fonte": "AHA 2020", "flashcards": [{"f": "Profundidade das compressões na RCP de alta qualidade", "v": "<strong>5 a 6 cm<\/strong>."}, {"f": "Frequência das compressões", "v": "<strong>100 a 120 compressões/min<\/strong>."}, {"f": "Retorno do tórax na RCP de alta qualidade", "v": "Retorno <strong>total<\/strong>, sem apoiar-se sobre o tórax entre as compressões."}, {"f": "Fração de compressão e limite de interrupções", "v": "Fração <strong>maior que 60%<\/strong>, idealmente próxima de 80%. Interrupções <strong>menores que 10 segundos<\/strong>."}], "multipla": [{"p": "Qual conjunto de metas descreve uma RCP de alta qualidade?", "o": ["5 a 6 cm e 120 a 140/min", "3 a 4 cm e 80 a 100/min", "5 a 6 cm e 100 a 120/min", "7 a 8 cm e 100 a 120/min"], "c": 2, "e": "Profundidade de 5 a 6 cm e frequência de 100 a 120 compressões/min."}, {"p": "Durante a RCP, a equipe se apoia sobre o tórax entre as compressões e as pausas passam de 10 segundos. Qual componente falhou?", "o": ["Apenas a frequência", "Apenas a fração de compressão ideal", "Apenas a profundidade", "Retorno do tórax e interrupções"], "c": 3, "e": "O retorno do tórax deve ser total e as interrupções, menores que 10 segundos."}], "vf": [{"a": "A fração de compressão deve ser maior que 60%, idealmente próxima de 80% do tempo total.", "v": true, "e": "Essa é a meta de fração de compressão."}, {"a": "As interrupções nas compressões são aceitáveis até 30 segundos.", "v": false, "e": "As interrupções devem ser minimizadas, menos de 10 segundos."}]}, {"id": "B0-4", "parte": 2, "bloco": "AE em PCR e RCP em Adultos", "tema": "pcr", "num": "4", "pergunta": "Diferencie os ritmos chocáveis (FV e TVSP) dos ritmos não chocáveis (AESP e Assistolia), explicando o objetivo da desfibrilação nos casos indicados.", "resposta": "<table class=\"t\">\n<tr><th>Chocáveis<\/th><th>Não chocáveis<\/th><\/tr>\n<tr><td>Fibrilação Ventricular (FV)<\/td><td>Atividade Elétrica Sem Pulso (AESP)<\/td><\/tr>\n<tr><td>Taquicardia Ventricular Sem Pulso (TVSP)<\/td><td>Assistolia<\/td><\/tr>\n<\/table>\n<p>Nos ritmos chocáveis há atividade elétrica desorganizada ou muito rápida sem bomba eficaz; o choque despolariza simultaneamente as células miocárdicas, interrompendo o circuito e permitindo que o nó sinusal retome um ritmo organizado. Nos ritmos não chocáveis não há esse circuito a interromper, então o choque não ajuda: a prioridade é RCP contínua e tratar a causa reversível.<\/p>", "fonte": "AHA 2020", "flashcards": [{"f": "Ritmos chocáveis da PCR", "v": "<strong>FV<\/strong> (fibrilação ventricular) e <strong>TVSP<\/strong> (taquicardia ventricular sem pulso)."}, {"f": "Ritmos não chocáveis da PCR", "v": "<strong>AESP<\/strong> (atividade elétrica sem pulso) e <strong>assistolia<\/strong>."}, {"f": "Objetivo da desfibrilação nos ritmos chocáveis", "v": "Despolarizar simultaneamente as células miocárdicas, <strong>interrompendo o circuito<\/strong> e permitindo que o nó sinusal retome um ritmo organizado."}, {"f": "Conduta nos ritmos não chocáveis", "v": "Não há circuito a interromper, então o choque não ajuda. Prioridade: <strong>RCP contínua<\/strong> e tratar a <strong>causa reversível<\/strong>."}], "multipla": [{"p": "Qual par contém apenas ritmos chocáveis?", "o": ["FV e AESP", "FV e TVSP", "TVSP e assistolia", "AESP e assistolia"], "c": 1, "e": "Os ritmos chocáveis são FV e TVSP."}, {"p": "Paciente em PCR com assistolia no monitor. Qual a conduta?", "o": ["Apenas ventilar sem compressões", "Choque imediato", "Cardioversão sincronizada", "RCP contínua e tratar causa reversível"], "c": 3, "e": "Assistolia é não chocável: prioridade é RCP contínua e tratar a causa reversível."}], "vf": [{"a": "A atividade elétrica sem pulso (AESP) é um ritmo chocável.", "v": false, "e": "AESP e assistolia são não chocáveis."}, {"a": "O choque na FV despolariza simultaneamente as células miocárdicas, interrompendo o circuito.", "v": true, "e": "É assim que a desfibrilação permite ao nó sinusal retomar um ritmo organizado."}]}, {"id": "B0-5", "parte": 2, "bloco": "AE em PCR e RCP em Adultos", "tema": "pcr", "num": "5", "pergunta": "Explique a importância da Capacidade Residual Funcional (CRF) durante uma PCR e como ela influencia a oxigenação nos primeiros minutos de atendimento.", "resposta": "<p>A <strong>CRF<\/strong> é o volume de ar que permanece nos pulmões após uma expiração normal, funcionando como um reservatório de oxigênio. Durante a PCR, mesmo sem ventilação ativa, esse reservatório mantém alguma troca gasosa nos primeiros minutos, o que justifica priorizar as compressões torácicas antes da ventilação: a reserva de O2 na CRF ainda sustenta uma oxigenação mínima enquanto o sangue é impulsionado pelas compressões.<\/p>", "fonte": "fisiologia respiratória consolidada", "flashcards": [{"f": "O que é a CRF (Capacidade Residual Funcional)?", "v": "Volume de ar que <strong>permanece nos pulmões após uma expiração normal<\/strong>, funcionando como reservatório de oxigênio."}, {"f": "Papel da CRF nos primeiros minutos da PCR", "v": "Mesmo sem ventilação ativa, mantém <strong>alguma troca gasosa<\/strong> nos primeiros minutos."}, {"f": "Como a CRF justifica priorizar compressões antes da ventilação?", "v": "A reserva de O2 na CRF ainda sustenta oxigenação mínima enquanto o sangue é <strong>impulsionado pelas compressões<\/strong>."}], "multipla": [{"p": "A CRF é definida como:", "o": ["Volume de ar que permanece nos pulmões após expiração normal", "Volume máximo expirado após inspiração forçada", "Volume de ar inspirado em uma respiração normal", "Volume de ar que nunca deixa os pulmões"], "c": 0, "e": "A CRF é o volume que permanece nos pulmões após uma expiração normal."}, {"p": "Como a CRF influencia o atendimento inicial da PCR?", "o": ["Torna a ventilação inútil em qualquer momento", "Elimina a necessidade de compressões", "Sustenta oxigenação mínima e justifica priorizar as compressões", "Obriga a ventilar antes de comprimir"], "c": 2, "e": "O reservatório de O2 mantém troca gasosa mínima nos primeiros minutos, então as compressões vêm antes."}], "vf": [{"a": "A CRF funciona como reservatório de oxigênio que mantém alguma troca gasosa nos primeiros minutos da PCR.", "v": true, "e": "É o papel descrito da CRF."}, {"a": "Como há reserva de O2 na CRF, as compressões podem ser adiadas até a ventilação estar pronta.", "v": false, "e": "A CRF justifica o contrário: priorizar compressões antes da ventilação."}]}, {"id": "B0-6", "parte": 2, "bloco": "AE em PCR e RCP em Adultos", "tema": "pcr", "num": "6", "pergunta": "Após o Retorno da Circulação Espontânea (RCE), o que é o Controle Direcionado de Temperatura (CDT) e qual a faixa de temperatura e duração recomendadas para pacientes comatosos?", "resposta": "<p>O <strong>CDT<\/strong> consiste em manter e monitorar a temperatura corporal do paciente comatoso pós-PCR de forma controlada, para reduzir lesão neurológica secundária.<\/p>\n<p>Pela <strong>AHA 2020<\/strong>, a meta é manter temperatura constante entre <strong>32°C e 36°C por pelo menos 24 horas<\/strong>.<\/p>\n<div class=\"dica\">Atualização: a AHA 2025 mudou o foco de hipotermia induzida para prevenção ativa de febre e normotermia controlada (temperatura abaixo de 37,5°C), podendo se estender por até 5 dias em pacientes comatosos, com base em estudos que não mostraram benefício adicional do resfriamento agressivo.<\/div>", "fonte": "AHA 2020; atualização AHA 2025", "flashcards": [{"f": "O que é o CDT (Controle Direcionado de Temperatura)?", "v": "Manter e monitorar a temperatura do paciente <strong>comatoso pós-PCR<\/strong> de forma controlada, para reduzir lesão neurológica secundária."}, {"f": "Meta de temperatura do CDT pela AHA 2020", "v": "Temperatura constante entre <strong>32 e 36 °C por pelo menos 24 horas<\/strong>."}, {"f": "Mudança de foco da AHA 2025 no CDT", "v": "De hipotermia induzida para <strong>prevenção ativa de febre<\/strong> e normotermia controlada."}, {"f": "Meta e duração do CDT na AHA 2025", "v": "Temperatura <strong>abaixo de 37,5 °C<\/strong>, podendo se estender por <strong>até 5 dias<\/strong> em pacientes comatosos."}], "multipla": [{"p": "Pela AHA 2020, qual a meta do CDT em paciente comatoso pós-RCE?", "o": ["Abaixo de 37,5 °C por até 5 dias", "32 a 36 °C por pelo menos 24 horas", "30 a 32 °C por 6 horas", "36 a 38 °C por 12 horas"], "c": 1, "e": "A AHA 2020 indica 32 a 36 °C por pelo menos 24 horas."}, {"p": "O que a AHA 2025 mudou no controle de temperatura pós-PCR?", "o": ["Definiu hipotermia de 32 °C como padrão", "Suspendeu qualquer monitoração de temperatura", "Focou em prevenir febre, mantendo abaixo de 37,5 °C", "Indicou resfriamento agressivo para todos"], "c": 2, "e": "O foco passou da hipotermia induzida para prevenção ativa de febre e normotermia controlada, sem benefício adicional do resfriamento agressivo."}], "vf": [{"a": "A AHA 2025 mantém a hipotermia induzida como foco principal do controle de temperatura pós-PCR.", "v": false, "e": "A AHA 2025 mudou o foco para prevenção ativa de febre e normotermia controlada."}, {"a": "O CDT se aplica ao paciente comatoso após o retorno da circulação espontânea.", "v": true, "e": "O CDT é feito no paciente comatoso pós-PCR."}]}, {"id": "B0-7", "parte": 2, "bloco": "AE em PCR e RCP em Adultos", "tema": "pcr", "num": "7", "pergunta": "Durante o atendimento de uma gestante em PCR cujo útero está acima da cicatriz umbilical, qual manobra específica deve ser realizada pelo socorrista para otimizar o retorno venoso e por que o monitoramento fetal deve ser ignorado nesse momento?", "resposta": "<p>Deve-se realizar o <strong>deslocamento uterino manual para a esquerda<\/strong>, aliviando a compressão do útero sobre a veia cava inferior e a aorta, o que melhora o retorno venoso e o débito cardíaco durante as compressões.<\/p>\n<p>O monitoramento fetal é postergado porque a prioridade absoluta é a ressuscitação materna: sem RCE materno não há chance de sobrevida fetal, e a monitorização não modifica a conduta de emergência nesse momento.<\/p>", "fonte": "AHA 2020/2025", "flashcards": [{"f": "Manobra para gestante em PCR com útero acima da cicatriz umbilical", "v": "<strong>Deslocamento uterino manual para a esquerda<\/strong>."}, {"f": "Efeito do deslocamento uterino durante a RCP", "v": "Alivia a compressão do útero sobre a <strong>veia cava inferior e a aorta<\/strong>, melhorando o retorno venoso e o débito cardíaco."}, {"f": "Por que o monitoramento fetal é postergado?", "v": "A prioridade absoluta é a <strong>ressuscitação materna<\/strong>. Ele não modifica a conduta de emergência naquele momento."}, {"f": "Relação entre RCE materno e sobrevida fetal", "v": "Sem <strong>RCE materno<\/strong> não há chance de sobrevida fetal."}], "multipla": [{"p": "Gestante em PCR, útero acima da cicatriz umbilical. Qual manobra otimiza o retorno venoso?", "o": ["Compressão do abdome", "Elevação dos membros superiores", "Deslocamento uterino manual para a esquerda", "Deslocamento uterino manual para a direita"], "c": 2, "e": "O deslocamento uterino manual para a esquerda alivia a compressão da veia cava inferior e da aorta."}, {"p": "Por que o monitoramento fetal fica em segundo plano nessa PCR?", "o": ["Porque a prioridade é a ressuscitação materna", "Porque o monitor atrapalha a desfibrilação", "Porque o feto não depende da mãe", "Porque é proibido monitorar o feto"], "c": 0, "e": "Sem RCE materno não há sobrevida fetal, e a monitorização não muda a conduta de emergência."}], "vf": [{"a": "O deslocamento uterino na gestante em PCR é feito para a direita.", "v": false, "e": "O deslocamento é manual para a esquerda."}, {"a": "O monitoramento fetal é postergado porque a prioridade absoluta é a ressuscitação materna.", "v": true, "e": "Sem RCE materno não há chance de sobrevida fetal."}]}, {"id": "B0-8", "parte": 2, "bloco": "AE em PCR e RCP em Adultos", "tema": "pcr", "num": "8", "pergunta": "Um profissional de saúde atende uma vítima de acidente automobilístico inconsciente com suspeita de lesão na coluna cervical. Qual técnica de abertura de vias aéreas deve ser priorizada e porquê?", "resposta": "<p>A <strong>tração da mandíbula (jaw thrust)<\/strong>, sem extensão do pescoço, deve ser priorizada, pois abre a via aérea sem mobilizar a coluna cervical, reduzindo o risco de lesão medular secundária em vítima de trauma com suspeita de lesão cervical.<\/p>", "fonte": "AHA 2020", "flashcards": [{"f": "Técnica de abertura de via aérea na suspeita de lesão cervical", "v": "<strong>Tração da mandíbula (jaw thrust)<\/strong>, sem extensão do pescoço."}, {"f": "Por que priorizar a tração da mandíbula no trauma?", "v": "Abre a via aérea <strong>sem mobilizar a coluna cervical<\/strong>, reduzindo o risco de lesão medular secundária."}, {"f": "Cenário de indicação do jaw thrust", "v": "Vítima de <strong>trauma inconsciente com suspeita de lesão cervical<\/strong>, como em acidente automobilístico."}], "multipla": [{"p": "Vítima inconsciente de acidente automobilístico com suspeita de lesão cervical. Qual técnica priorizar?", "o": ["Tração da mandíbula sem extensão do pescoço", "Rotação lateral da cabeça", "Flexão da cabeça sobre o tórax", "Extensão do pescoço com elevação do queixo"], "c": 0, "e": "A tração da mandíbula abre a via aérea sem mobilizar a coluna cervical."}, {"p": "Qual o motivo de evitar a extensão do pescoço nessa vítima?", "o": ["Reduz a saturação de oxigênio", "Impede a compressão torácica", "Pode causar lesão medular secundária", "Fecha a via aérea inferior"], "c": 2, "e": "A mobilização cervical aumenta o risco de lesão medular secundária."}], "vf": [{"a": "Na suspeita de lesão cervical, a tração da mandíbula (jaw thrust) é priorizada por não mobilizar a coluna cervical.", "v": true, "e": "Ela abre a via aérea sem extensão do pescoço."}, {"a": "Em vítima de trauma com suspeita de lesão cervical, a extensão do pescoço é a técnica prioritária.", "v": false, "e": "A técnica prioritária é a tração da mandíbula, sem extensão do pescoço."}]}, {"id": "B0-9", "parte": 2, "bloco": "AE em PCR e RCP em Adultos", "tema": "pcr", "num": "9", "pergunta": "Durante uma manobra de ressuscitação avançada, o capnógrafo indica um valor de CO2 expirado inferior a 10 mmHg. Analise o que esse valor representa para a qualidade da RCP e cite dois exemplos de causas reversíveis (5Hs e 5Ts) que a equipe deve investigar.", "resposta": "<p>ETCO2 <strong>menor que 10 mmHg<\/strong> após 20 minutos de RCP indica <strong>baixo débito cardíaco gerado pelas compressões<\/strong> (perfusão pulmonar insuficiente) e está associado a prognóstico ruim; sugere necessidade de reavaliar qualidade das compressões e investigar causas reversíveis.<\/p>\n<p>Exemplos de causas reversíveis (5Hs e 5Ts):<\/p>\n<ul>\n<li><strong>Hipovolemia<\/strong> e <strong>Hipóxia<\/strong> (dos 5Hs)<\/li>\n<li><strong>Tamponamento cardíaco<\/strong> e <strong>pneumotórax hipertensivo<\/strong> (dos 5Ts)<\/li>\n<\/ul>", "fonte": "AHA 2020", "flashcards": [{"f": "ETCO2 abaixo de 10 mmHg após 20 minutos de RCP", "v": "Indica <strong>baixo débito cardíaco<\/strong> gerado pelas compressões (perfusão pulmonar insuficiente) e prognóstico ruim."}, {"f": "Conduta diante de ETCO2 menor que 10 mmHg", "v": "Reavaliar a <strong>qualidade das compressões<\/strong> e investigar as <strong>causas reversíveis<\/strong>."}, {"f": "Dois exemplos de causas reversíveis dos 5Hs", "v": "<strong>Hipovolemia<\/strong> e <strong>hipóxia<\/strong>."}, {"f": "Dois exemplos de causas reversíveis dos 5Ts", "v": "<strong>Tamponamento cardíaco<\/strong> e <strong>pneumotórax hipertensivo<\/strong>."}], "multipla": [{"p": "Após 20 minutos de RCP, o capnógrafo marca ETCO2 menor que 10 mmHg. O que isso sugere?", "o": ["Ventilação excessiva sem repercussão", "Perfusão pulmonar excelente", "Baixo débito cardíaco pelas compressões e prognóstico ruim", "RCE iminente"], "c": 2, "e": "ETCO2 menor que 10 mmHg indica perfusão pulmonar insuficiente e está associado a mau prognóstico."}, {"p": "Qual par contém causas reversíveis citadas (um dos 5Hs e um dos 5Ts)?", "o": ["Choque e assistolia", "Hipovolemia e tamponamento cardíaco", "Hipovolemia e hipóxia", "Tamponamento cardíaco e pneumotórax hipertensivo"], "c": 1, "e": "Hipovolemia é um dos 5Hs e tamponamento cardíaco é um dos 5Ts."}], "vf": [{"a": "ETCO2 menor que 10 mmHg após 20 minutos de RCP indica boa qualidade das compressões.", "v": false, "e": "Indica baixo débito gerado pelas compressões e prognóstico ruim."}, {"a": "Pneumotórax hipertensivo e tamponamento cardíaco são exemplos de causas reversíveis dos 5Ts.", "v": true, "e": "Ambos foram citados entre os 5Ts."}]}, {"id": "B1-1", "parte": 2, "bloco": "AE em Distúrbios Cardiovasculares", "tema": "cardio", "num": "1", "pergunta": "Explique a diferença entre a Síndrome Coronariana Aguda com Supradesnivelamento do Segmento ST e a Síndrome Coronariana Aguda sem Supradesnivelamento do Segmento ST, destacando as principais alterações no ECG e a necessidade de reperfusão imediata em cada grupo.", "resposta": "<table class=\"t\">\n<tr><th>IAMCSST<\/th><th>SCASSST<\/th><\/tr>\n<tr><td>Supradesnivelamento do segmento ST, oclusão coronariana total<\/td><td>Infradesnivelamento de ST, inversão de T ou ECG normal; oclusão parcial/suboclusão<\/td><\/tr>\n<tr><td>Reperfusão imediata (ICP primária ou fibrinólise)<\/td><td>Estratificação de risco; reperfusão conforme risco, não necessariamente imediata<\/td><\/tr>\n<\/table>", "fonte": "Diretriz SBC IAM com supra ST (2015); Diretriz SBC SCASSST (2021)", "flashcards": [{"f": "ECG do IAMCSST", "v": "<strong>Supradesnivelamento do segmento ST<\/strong>, com oclusão coronariana total."}, {"f": "ECG da SCASSST", "v": "<strong>Infradesnivelamento de ST<\/strong>, inversão de T ou ECG normal, com oclusão parcial ou suboclusão."}, {"f": "Reperfusão no IAMCSST", "v": "<strong>Imediata<\/strong>: ICP primária ou fibrinólise."}, {"f": "Reperfusão na SCASSST", "v": "Faz-se <strong>estratificação de risco<\/strong>. Reperfusão conforme o risco, não necessariamente imediata."}], "multipla": [{"p": "Qual achado caracteriza o IAMCSST?", "o": ["Supradesnivelamento de ST com oclusão total", "Infradesnivelamento de ST com oclusão parcial", "Inversão de onda T isolada", "ECG normal com suboclusão"], "c": 0, "e": "O IAMCSST tem supra de ST e oclusão coronariana total."}, {"p": "Qual conduta de reperfusão se aplica à SCASSST?", "o": ["Nenhuma reperfusão em qualquer caso", "Fibrinólise imediata em todos", "ICP primária imediata em todos", "Estratificação de risco e reperfusão conforme risco"], "c": 3, "e": "Na SCASSST a reperfusão depende do risco, não é necessariamente imediata."}], "vf": [{"a": "Na SCASSST a reperfusão imediata é sempre obrigatória, como no IAMCSST.", "v": false, "e": "Na SCASSST faz-se estratificação de risco e a reperfusão depende do risco."}, {"a": "O IAMCSST se associa a oclusão coronariana total, e a SCASSST a oclusão parcial ou suboclusão.", "v": true, "e": "Essa é a diferença de oclusão entre os dois grupos."}]}, {"id": "B1-2", "parte": 2, "bloco": "AE em Distúrbios Cardiovasculares", "tema": "cardio", "num": "2", "pergunta": "Descreva como a ruptura de uma placa aterosclerótica leva à formação de trombos e descreva as manifestações clínicas que advém da oclusão de vasos coronários por esses trombos.", "resposta": "<p>A ruptura da <strong>placa aterosclerótica<\/strong> expõe o núcleo lipídico e o colágeno subendotelial, ativando a agregação plaquetária e a cascata de coagulação, formando um <strong>trombo<\/strong> que oclui total ou parcialmente o vaso.<\/p>\n<p>Manifestações: <strong>dor precordial em aperto<\/strong> irradiada para braço/mandíbula, sudorese, náusea, dispneia e, em casos graves, instabilidade hemodinâmica ou arritmias por isquemia miocárdica.<\/p>", "fonte": "fisiopatologia consolidada / Diretriz SBC IAM", "flashcards": [{"f": "O que a ruptura da placa aterosclerótica expõe?", "v": "O <strong>núcleo lipídico<\/strong> e o <strong>colágeno subendotelial<\/strong>."}, {"f": "Como se forma o trombo coronariano?", "v": "A exposição ativa a <strong>agregação plaquetária<\/strong> e a <strong>cascata de coagulação<\/strong>, formando um trombo que oclui total ou parcialmente o vaso."}, {"f": "Manifestação clássica da oclusão coronariana", "v": "<strong>Dor precordial em aperto<\/strong> irradiada para braço ou mandíbula."}, {"f": "Outros sinais e casos graves da isquemia miocárdica", "v": "Sudorese, náusea, dispneia. Nos casos graves: <strong>instabilidade hemodinâmica<\/strong> ou arritmias."}], "multipla": [{"p": "O que a ruptura da placa aterosclerótica desencadeia?", "o": ["Vasodilatação coronariana", "Ativação plaquetária e da coagulação com formação de trombo", "Dissolução do trombo existente", "Redução da agregação plaquetária"], "c": 1, "e": "A exposição do núcleo lipídico e do colágeno ativa plaquetas e coagulação, formando o trombo."}, {"p": "Qual quadro é típico da oclusão coronariana por trombo?", "o": ["Dor pleurítica sem irradiação", "Dor precordial em aperto irradiada, sudorese e náusea", "Cefaleia com rigidez de nuca", "Dor em pontada que piora ao toque"], "c": 1, "e": "Dor precordial em aperto, irradiação para braço ou mandíbula, sudorese e náusea."}], "vf": [{"a": "A ruptura da placa expõe o núcleo lipídico e o colágeno subendotelial.", "v": true, "e": "Isso ativa a agregação plaquetária e a coagulação."}, {"a": "O trombo formado sobre a placa rota nunca causa oclusão total do vaso.", "v": false, "e": "O trombo pode ocluir total ou parcialmente o vaso."}]}, {"id": "B1-3", "parte": 2, "bloco": "AE em Distúrbios Cardiovasculares", "tema": "cardio", "num": "3", "pergunta": "Analise a importância da Troponina, CK-MB e Mioglobina no diagnóstico do IAM, especificando qual desses marcadores é considerado o mais específico para a lesão miocárdica e o tempo aproximado para sua detecção sérica.", "resposta": "<table class=\"t\">\n<tr><th>Marcador<\/th><th>Início de elevação<\/th><th>Observação<\/th><\/tr>\n<tr><td><strong>Troponina<\/strong><\/td><td>3 a 4 horas<\/td><td>Marcador <strong>mais específico<\/strong> para lesão miocárdica; permanece elevada por dias<\/td><\/tr>\n<tr><td>CK-MB<\/td><td>4 a 6 horas<\/td><td>Menos específica, útil para reinfarto precoce<\/td><\/tr>\n<tr><td>Mioglobina<\/td><td>1 a 2 horas<\/td><td>Mais precoce, porém pouco específica<\/td><\/tr>\n<\/table>", "fonte": "fisiologia/bioquímica consolidada", "flashcards": [{"f": "Marcador mais específico para lesão miocárdica", "v": "<strong>Troponina<\/strong>."}, {"f": "Início de elevação da troponina", "v": "<strong>3 a 4 horas<\/strong>. Permanece elevada por dias."}, {"f": "CK-MB: início e observação", "v": "Eleva em <strong>4 a 6 horas<\/strong>. Menos específica, útil para <strong>reinfarto precoce<\/strong>."}, {"f": "Mioglobina: início e observação", "v": "Eleva em <strong>1 a 2 horas<\/strong>. É a mais precoce, porém <strong>pouco específica<\/strong>."}], "multipla": [{"p": "Qual marcador é o mais específico para lesão miocárdica?", "o": ["Nenhum deles é específico", "CK-MB", "Troponina", "Mioglobina"], "c": 2, "e": "A troponina é o marcador mais específico e permanece elevada por dias."}, {"p": "Qual marcador se eleva mais cedo (1 a 2 horas), porém é pouco específico?", "o": ["CK-MB", "Troponina", "Nenhum eleva em menos de 4 horas", "Mioglobina"], "c": 3, "e": "A mioglobina é a mais precoce e pouco específica."}], "vf": [{"a": "A troponina começa a se elevar em 3 a 4 horas e permanece elevada por dias.", "v": true, "e": "Esse é o perfil descrito da troponina."}, {"a": "A mioglobina é o marcador mais específico para lesão miocárdica.", "v": false, "e": "A mioglobina é a mais precoce, mas pouco específica; a mais específica é a troponina."}]}, {"id": "B1-4", "parte": 2, "bloco": "AE em Distúrbios Cardiovasculares", "tema": "cardio", "num": "4", "pergunta": "Diferencie as manifestações clínicas da IC esquerda das manifestações da IC direita, explicando como a fisiopatologia dessas manifestações.", "resposta": "<table class=\"t\">\n<tr><th>IC esquerda<\/th><th>IC direita<\/th><\/tr>\n<tr><td>Congestão pulmonar: dispneia, ortopneia, estertores, tosse<\/td><td>Congestão sistêmica: edema de membros inferiores, turgência jugular, hepatomegalia<\/td><\/tr>\n<tr><td>Sangue represa a montante do VE, nos pulmões<\/td><td>Sangue represa a montante do VD, na circulação venosa sistêmica<\/td><\/tr>\n<\/table>", "fonte": "fisiopatologia consolidada", "flashcards": [{"f": "Manifestações da IC esquerda", "v": "Congestão pulmonar: <strong>dispneia, ortopneia, estertores e tosse<\/strong>."}, {"f": "Manifestações da IC direita", "v": "Congestão sistêmica: <strong>edema de membros inferiores, turgência jugular e hepatomegalia<\/strong>."}, {"f": "Fisiopatologia da IC esquerda", "v":
