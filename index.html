": "A pressão do cuff entre 15 e 20 mmHg impede a passagem de secreções acima do balonete.", "v": true, "e": "O cuff veda a traqueia."}, {"a": "A higiene oral no bundle é feita com clorexidina alcoólica 0,12%.", "v": false, "e": "É clorexidina aquosa 0,12%."}]}, {"id": "C1-10", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "10", "pergunta": "Explique os critérios utilizados para avaliar se um paciente está pronto para o desmame da ventilação mecânica.", "resposta": "<ul>\n<li>Estabilidade hemodinâmica e resolução (ou controle) da causa que levou à VM.<\/li>\n<li>Processo infeccioso tratado, hematócrito/hemoglobina e eletrólitos/gasometria estáveis.<\/li>\n<li>Nível de consciência adequado para entender e cooperar com o desmame.<\/li>\n<\/ul>\n<p>Durante o teste de respiração espontânea (tubo T com O2), são critérios de <strong>suspensão<\/strong> do desmame: FR &gt; 35 irpm, Índice de Tobin (FR/VC) &gt; 100, SaO2 &lt; 90%, FC &gt; 140 bpm (ou aumento de 20% do basal), PA sistólica &gt; 180 ou &lt; 90 mmHg, agitação, sudorese ou alteração do nível de consciência.<\/p>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "Pré-requisitos gerais para desmame", "v": "Estabilidade hemodinâmica, causa da VM resolvida ou controlada, infecção tratada, eletrólitos/gasometria estáveis, consciência adequada."}, {"f": "Teste de respiração espontânea", "v": "Feito em <strong>tubo T com O2<\/strong>."}, {"f": "Critérios de suspensão: FR e Tobin", "v": "FR &gt; <strong>35 irpm<\/strong> e Índice de Tobin (FR/VC) &gt; <strong>100<\/strong>."}, {"f": "Critérios de suspensão: SaO2, FC e PA", "v": "SaO2 &lt; 90%; FC &gt; 140 bpm (ou +20% do basal); PAS &gt; 180 ou &lt; 90 mmHg."}], "multipla": [{"p": "Durante o teste de respiração espontânea, qual achado indica suspender o desmame?", "o": ["SaO2 de 96%", "FR de 22 irpm", "Índice de Tobin (FR/VC) acima de 100", "PAS de 120 mmHg"], "c": 2, "e": "Tobin &gt; 100, FR &gt; 35, SaO2 &lt; 90%, FC &gt; 140 e alterações de PA ou consciência suspendem o teste."}, {"p": "Paciente em tubo T apresenta SaO2 de 88%, sudorese e agitação. Qual a conduta?", "o": ["Suspender o teste de respiração espontânea", "Manter o teste e observar por mais tempo", "Reduzir o O2 do tubo T", "Considerar critério de sucesso do desmame"], "c": 0, "e": "SaO2 &lt; 90%, sudorese e agitação são critérios de suspensão do desmame."}], "vf": [{"a": "FC acima de 140 bpm ou aumento de 20% do basal é critério de suspensão do desmame.", "v": true, "e": "Está entre os critérios de suspensão."}, {"a": "FR acima de 35 irpm é critério de sucesso do teste de respiração espontânea.", "v": false, "e": "FR &gt; 35 irpm é critério de suspensão."}]}, {"id": "C1-11", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "11", "pergunta": "Compare a traqueostomia com a intubação endotraqueal quanto às indicações, vantagens e possíveis complicações (imediatas e tardias), justificando em que momento a traqueostomia deve ser considerada em substituição ao tubo orotraqueal.", "resposta": "<table class=\"t\">\n<tr><th><\/th><th>Indicação<\/th><th>Complicações<\/th><\/tr>\n<tr><td><strong>IOT<\/strong><\/td><td>Via aérea de emergência, uso de curto prazo<\/td><td>Desconforto, deprime tosse e deglutição (risco de aspiração), estenose traqueal por uso prolongado, lesão de corda vocal<\/td><\/tr>\n<tr><td><strong>TQT<\/strong><\/td><td>Obstrução de VAS, remoção de secreções, prolongamento da VM<\/td><td>Imediatas: sangramento, pneumotórax, embolia gasosa, enfisema subcutâneo/mediastinal, lesão do nervo laríngeo recorrente. Tardias: obstrução por secreção, infecção, ruptura da artéria inominada, disfagia, fístula traqueoesofágica<\/td><\/tr>\n<\/table>\n<p>A traqueostomia deve ser considerada quando a intubação se prolonga por <strong>14 a 21 dias<\/strong>, para reduzir irritação e trauma da mucosa traqueal e a incidência de lesão do nervo laríngeo.<\/p>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN).", "flashcards": [{"f": "Indicação da IOT", "v": "Via aérea de <strong>emergência<\/strong>, uso de curto prazo."}, {"f": "Complicações da IOT", "v": "Desconforto, deprime tosse e deglutição (aspiração), <strong>estenose traqueal<\/strong> se prolongada, lesão de corda vocal."}, {"f": "Indicações da TQT", "v": "Obstrução de VAS, remoção de secreções, <strong>prolongamento da VM<\/strong>."}, {"f": "Quando considerar TQT no lugar da IOT?", "v": "Quando a intubação se prolonga por <strong>14 a 21 dias<\/strong>."}], "multipla": [{"p": "Paciente intubado há 15 dias, sem previsão de extubação. Qual a conduta descrita?", "o": ["Manter IOT indefinidamente", "Considerar traqueostomia para reduzir trauma da mucosa e do nervo laríngeo", "Traqueostomia só após 60 dias", "Trocar o tubo orotraqueal por outro de mesmo tipo"], "c": 1, "e": "A TQT é considerada quando a IOT se prolonga por 14 a 21 dias."}, {"p": "Qual é uma complicação tardia da traqueostomia?", "o": ["Pneumotórax", "Sangramento no ato", "Embolia gasosa", "Ruptura da artéria inominada"], "c": 3, "e": "Tardias: obstrução por secreção, infecção, ruptura da artéria inominada, disfagia, fístula traqueoesofágica. Pneumotórax e embolia gasosa são imediatas."}], "vf": [{"a": "Sangramento, pneumotórax e embolia gasosa são complicações imediatas da TQT.", "v": true, "e": "Estão entre as complicações imediatas descritas."}, {"a": "A IOT é indicada para uso prolongado e não causa estenose traqueal.", "v": false, "e": "A IOT é de curto prazo e o uso prolongado pode causar estenose traqueal."}]}, {"id": "C1-12", "parte": 2, "bloco": "AE ao Paciente em Ventilação Mecânica", "tema": "vm", "num": "12", "pergunta": "Diferencie os principais volumes e capacidades pulmonares (volume corrente, volume residual, espaço morto anatômico e ventilação minuto), explicando o que cada um representa na mecânica respiratória.", "resposta": "<ul>\n<li><strong>Volume corrente (VC)<\/strong>: cerca de 500 mL (5 a 8 mL/kg) inspirados/expirados em cada ciclo; aproximadamente 350 mL chegam aos alvéolos.<\/li>\n<li><strong>Espaço morto anatômico<\/strong>: cerca de 150 mL (2 mL/kg) que ficam nas vias aéreas condutoras, sem participar da troca gasosa.<\/li>\n<li><strong>Ventilação minuto<\/strong>: volume expirado por minuto, produto do VC pela frequência respiratória.<\/li>\n<li><strong>Volume residual<\/strong>: volume que permanece no pulmão após uma expiração forçada máxima (não é esvaziado, mantém os alvéolos abertos).<\/li>\n<\/ul>", "fonte": "Apostila AE nos Distúrbios Respiratórios (EEAN); volume residual: literatura de apoio (fora da pasta de referências).", "flashcards": [{"f": "Volume corrente", "v": "Cerca de <strong>500 mL<\/strong> (5 a 8 mL/kg) por ciclo; cerca de 350 mL chegam aos alvéolos."}, {"f": "Espaço morto anatômico", "v": "Cerca de <strong>150 mL<\/strong> (2 mL/kg) nas vias condutoras, sem troca gasosa."}, {"f": "Ventilação minuto", "v": "Volume expirado por minuto: <strong>VC x FR<\/strong>."}, {"f": "Volume residual", "v": "Volume que permanece no pulmão após expiração forçada máxima; <strong>mantém os alvéolos abertos<\/strong>."}], "multipla": [{"p": "Qual volume permanece no pulmão após uma expiração forçada máxima?", "o": ["Volume corrente", "Espaço morto anatômico", "Volume residual", "Ventilação minuto"], "c": 2, "e": "O volume residual não é esvaziado e mantém os alvéolos abertos."}, {"p": "Como se calcula a ventilação minuto?", "o": ["Volume corrente multiplicado pela frequência respiratória", "Volume residual multiplicado pelo VC", "Espaço morto dividido pela FR", "Volume corrente somado ao espaço morto"], "c": 0, "e": "Ventilação minuto é o produto do VC pela FR."}], "vf": [{"a": "O espaço morto anatômico, cerca de 150 mL, não participa da troca gasosa.", "v": true, "e": "Fica nas vias aéreas condutoras."}, {"a": "Dos 500 mL do volume corrente, todo o volume chega aos alvéolos.", "v": false, "e": "Cerca de 350 mL chegam aos alvéolos; o restante fica no espaço morto."}]}, {"id": "D0-1", "parte": 2, "bloco": "Classificação de Risco e Deterioração Clínica", "tema": "risco", "num": "1", "pergunta": "Segundo o parecer do COFEN 44/2023, como o acolhimento com classificação de risco deve ser entendido? O que o enfermeiro deve fazer, em um serviço sem médico, ao identificar sinais de alerta de maior gravidade? Qual é a regra para o usuário classificado por cores, e qual é a exceção?", "resposta": "<p>O <strong>acolhimento<\/strong> deve ser entendido como processo dinâmico de identificação de usuários que precisam de intervenção médica ou de enfermagem, conforme o potencial de risco, o agravo à saúde e o grau de sofrimento. Ele não é sinônimo de <strong>classificação de risco<\/strong> (esta é atividade privativa do enfermeiro e pode ocorrer em qualquer ponto da rede).<\/p>\n<p>Em serviço sem médico, o enfermeiro deve realizar a consulta de enfermagem dentro do protocolo institucional e, ao identificar sinais de alerta de maior gravidade, <strong>acionar o serviço de urgência e emergência<\/strong> e agir conforme sua competência, sem aguardar avaliação médica presencial para as medidas cabíveis a ele.<\/p>\n<p><strong>Regra:<\/strong> o usuário já classificado por cor não pode deixar o serviço sem atendimento médico. <strong>Exceção:<\/strong> a cor branca, cujas condutas de dispensa cabem ao enfermeiro, conforme protocolo próprio do serviço.<\/p>", "fonte": "Parecer COFEN 44/2023.", "flashcards": [{"f": "Acolhimento e classificação de risco são sinônimos? (Parecer COFEN 44/2023)", "v": "<strong>Não.<\/strong> Acolhimento é processo dinâmico de identificar quem precisa de intervenção médica ou de enfermagem. A classificação de risco é atividade <strong>privativa do enfermeiro<\/strong>."}, {"f": "Serviço sem médico: o que o enfermeiro faz ao ver sinais de alerta de maior gravidade?", "v": "Realiza a consulta de enfermagem no protocolo institucional e <strong>aciona o serviço de urgência e emergência<\/strong>, agindo conforme sua competência."}, {"f": "Usuário já classificado por cor pode sair sem atendimento médico?", "v": "<strong>Não<\/strong>, essa é a regra. A exceção é a <strong>cor branca<\/strong>, cuja dispensa cabe ao enfermeiro conforme protocolo do serviço."}], "multipla": [{"p": "Pelo Parecer COFEN 44/2023, qual é a exceção à regra de que o usuário classificado por cor não pode deixar o serviço sem atendimento médico?", "o": ["Cor azul", "Cor branca", "Cor verde", "Cor amarela"], "c": 1, "e": "A cor branca é a exceção, com condutas de dispensa a cargo do enfermeiro conforme protocolo próprio do serviço."}, {"p": "Em um serviço sem médico, o enfermeiro identifica sinais de alerta de maior gravidade. Qual a conduta correta?", "o": ["Aguardar avaliação médica presencial antes de qualquer medida", "Dispensar o usuário com orientações de retorno", "Acionar o serviço de urgência e emergência e agir conforme sua competência", "Reclassificar para a cor branca e encerrar o atendimento"], "c": 2, "e": "Ele deve acionar a urgência e emergência e agir dentro da competência, sem aguardar avaliação médica presencial para as medidas cabíveis a ele."}], "vf": [{"a": "O acolhimento é sinônimo de classificação de risco.", "v": false, "e": "O acolhimento é um processo dinâmico mais amplo; a classificação de risco é atividade privativa do enfermeiro."}, {"a": "A classificação de risco é atividade privativa do enfermeiro e pode ocorrer em qualquer ponto da rede.", "v": true, "e": "O parecer descreve a classificação de risco como privativa do enfermeiro, em qualquer ponto da rede."}]}, {"id": "D0-2", "parte": 2, "bloco": "Classificação de Risco e Deterioração Clínica", "tema": "risco", "num": "2", "pergunta": "Um paciente chega ao pronto atendimento com dor intensa em aperto no meio do peito, irradiando para o braço esquerdo, com sudorese e náuseas. Ele está com vias aéreas pérvias, respiração adequada e sem sinais de choque. a) Qual fluxograma deve ser utilizado? b) Qual é a prioridade (cor) e o tempo máximo de espera? c) Quais discriminadores justificam essa classificação? d) Por que a queixa principal, sozinha, não define a prioridade clínica?", "resposta": "<p><strong>a)<\/strong> Fluxograma de <strong>dor torácica<\/strong> do Protocolo de Manchester.<\/p>\n<p><strong>b)<\/strong> <span class=\"cor laranja\"><\/span><strong>Laranja<\/strong> (muito urgente), até <strong>10 minutos<\/strong> no Manchester. O Guia SMS/RJ não fixa minutos para o laranja: determina que a equipe fique alerta (sem sinal sonoro, diferente do vermelho) e encaminhe o paciente à sala de emergência ou à unidade intermediária, coerente com a suspeita de dor de origem cardíaca sem instabilidade no momento.<\/p>\n<p><strong>c)<\/strong> Discriminadores: dor sugestiva de origem cardíaca (aperto, irradiação para membro superior), sudorese e náusea associadas, sem os discriminadores de emergência (dor súbita com choque, inconsciência) que levariam ao vermelho.<\/p>\n<p><strong>d)<\/strong> Porque a mesma queixa pode corresponder a quadros de gravidade muito diferente; é a combinação de <strong>discriminadores<\/strong> (sinais, sintomas, tempo de evolução, comorbidades) identificados no fluxograma que define a cor, não a queixa isolada.<\/p>", "fonte": "Protocolo de Manchester; Guia SMS/RJ (2021).", "flashcards": [{"f": "Dor em aperto no peito irradiando para membro superior, com sudorese e náusea: qual fluxograma?", "v": "Fluxograma de <strong>dor torácica<\/strong> do Protocolo de Manchester."}, {"f": "Prioridade e tempo máximo (Manchester) para dor torácica sugestiva de origem cardíaca sem instabilidade?", "v": "<strong>Laranja<\/strong> (muito urgente), até <strong>10 minutos<\/strong> no Manchester."}, {"f": "O Guia SMS/RJ fixa minutos para o laranja?", "v": "<strong>Não.<\/strong> Determina equipe alerta (sem sinal sonoro) e encaminhamento à sala de emergência ou unidade intermediária."}, {"f": "Por que a queixa principal, sozinha, não define a prioridade?", "v": "A mesma queixa pode ter gravidades muito diferentes. A cor vem da combinação de <strong>discriminadores<\/strong> no fluxograma."}], "multipla": [{"p": "Paciente com dor torácica em aperto, irradiação para membro superior, sudorese e náusea, vias aéreas pérvias, respirando bem e sem choque. Qual a prioridade no Manchester?", "o": ["Vermelho, 0 minuto", "Amarelo, 60 minutos", "Laranja, 10 minutos", "Verde, 120 minutos"], "c": 2, "e": "Sem discriminadores de emergência como choque, a dor sugestiva de origem cardíaca é laranja, até 10 minutos."}, {"p": "O que levaria esse mesmo paciente com dor torácica a ser classificado como vermelho?", "o": ["Dor sem irradiação e sem sudorese", "Dor súbita com choque ou inconsciência", "Presença de náusea associada", "Tempo de evolução prolongado"], "c": 1, "e": "Discriminadores de emergência, como dor súbita com choque ou inconsciência, elevam a prioridade ao vermelho."}], "vf": [{"a": "O Guia SMS/RJ determina 10 minutos de espera máxima para o laranja, igual ao Manchester.", "v": false, "e": "O Guia SMS/RJ não fixa minutos para o laranja; só o Manchester fixa 10 minutos."}, {"a": "A prioridade clínica é definida pela combinação de discriminadores do fluxograma, e não pela queixa isolada.", "v": true, "e": "Sinais, sintomas, tempo de evolução e comorbidades identificados no fluxograma definem a cor."}]}, {"id": "D0-3", "parte": 2, "bloco": "Classificação de Risco e Deterioração Clínica", "tema": "risco", "num": "3", "pergunta": "Em um acidente com quatro vítimas, a vítima A caminha. A vítima B não caminha, tem FR de 34 irpm e não apresenta outras alterações. A vítima C não caminha, só respira após a abertura das vias aéreas e tem TEC de 3 segundos. A vítima D não caminha, tem FR de 20 irpm, TEC de 1 segundo e obedece a comandos simples. a) Classifique cada vítima pelo protocolo START e justifique. b) Compare os critérios do START com os da avaliação primária de múltiplas vítimas do Guia da SMS/RJ (frequência respiratória, perfusão e tempo por vítima).", "resposta": "<table class=\"t\">\n<tr><th>Vítima<\/th><th>Cor<\/th><th>Justificativa<\/th><\/tr>\n<tr><td>A<\/td><td><span class=\"cor verde\"><\/span>Verde<\/td><td>Caminha (ferido leve, ambulante)<\/td><\/tr>\n<tr><td>B<\/td><td><span class=\"cor vermelho\"><\/span>Vermelho<\/td><td>Não caminha e FR &gt; 30 irpm<\/td><\/tr>\n<tr><td>C<\/td><td><span class=\"cor vermelho\"><\/span>Vermelho<\/td><td>Só respira após abrir via aérea e TEC &gt; 2 segundos<\/td><\/tr>\n<tr><td>D<\/td><td><span class=\"cor amarelo\"><\/span>Amarelo<\/td><td>Não caminha, mas FR, TEC e estado mental dentro do esperado<\/td><\/tr>\n<\/table>\n<p><strong>b)<\/strong> O START avalia <strong>anda, respiração, perfusão e estado mental<\/strong> (obedece a comandos), em torno de 30 segundos a 1 minuto por vítima, em quatro categorias (verde, amarelo, vermelho, preto). A avaliação primária do Guia SMS/RJ usa <strong>anda, respiração, frequência respiratória (&gt;29 ou &lt;10 irpm) e perfusão<\/strong> (TEC &gt;2s ou, se não mensurável, pulso &gt;120/min), em no máximo <strong>15 segundos<\/strong> por vítima, e não usa estado mental. Tem apenas <strong>três categorias<\/strong> (verde, amarelo, vermelho); a ausência total de respiração após 10 segundos de abertura da via aérea é <strong>óbito<\/strong>, uma determinação médica separada da cor. Nas duas lógicas as vítimas B e C permanecem vermelhas (FR alterada e respiração só após abertura da via aérea, respectivamente).<\/p>", "fonte": "Lin et al. (2021), START; Guia SMS/RJ (2021).", "flashcards": [{"f": "START: como classificar quem caminha?", "v": "<strong>Verde<\/strong> (ferido leve, ambulante)."}, {"f": "START: vítima que não caminha com FR maior que 30 irpm?", "v": "<strong>Vermelho.<\/strong> O START usa FR &gt; 30, enquanto o Guia SMS/RJ usa FR &gt; 29 ou &lt; 10."}, {"f": "Diferença de tempo por vítima: START x avaliação primária do Guia SMS/RJ?", "v": "START: cerca de <strong>30 s a 1 min<\/strong> por vítima. Guia SMS/RJ: no máximo <strong>15 segundos<\/strong> por vítima."}, {"f": "Categorias: START x avaliação primária do Guia SMS/RJ?", "v": "START tem <strong>quatro<\/strong> (verde, amarelo, vermelho, preto). O Guia SMS/RJ tem <strong>três<\/strong> (verde, amarelo, vermelho); ausência de respiração é óbito, decisão médica."}], "multipla": [{"p": "Qual critério existe no START, mas NÃO na avaliação primária de múltiplas vítimas do Guia SMS/RJ?", "o": ["Capacidade de andar", "Frequência respiratória", "Estado mental (obedece a comandos)", "Perfusão pelo TEC"], "c": 2, "e": "O START avalia estado mental; a avaliação primária do Guia SMS/RJ não usa estado mental."}, {"p": "Vítima não caminha e só respira após a abertura das vias aéreas, com TEC de 3 segundos. Qual a cor?", "o": ["Amarelo", "Verde", "Preto", "Vermelho"], "c": 3, "e": "Respirar só após abrir a via aérea e TEC maior que 2 segundos indicam vermelho."}], "vf": [{"a": "No START, uma vítima que não caminha e tem FR de 34 irpm é classificada como vermelha.", "v": true, "e": "FR acima de 30 irpm em vítima que não caminha define vermelho."}, {"a": "A avaliação primária do Guia SMS/RJ considera vermelho a FR maior que 30 irpm, como o START.", "v": false, "e": "O Guia SMS/RJ usa FR maior que 29 ou menor que 10 irpm; o START usa maior que 30."}]}, {"id": "D0-4", "parte": 2, "bloco": "Classificação de Risco e Deterioração Clínica", "tema": "risco", "num": "4", "pergunta": "Cite as cinco prioridades do Sistema Manchester, com nome, cor e tempo-resposta máximo, e aponte as diferenças em relação aos tempos adotados pela SMS/RJ.", "resposta": "<table class=\"t\">\n<tr><th>Cor<\/th><th>Prioridade<\/th><th>Manchester<\/th><th>Conduta SMS/RJ<\/th><\/tr>\n<tr><td><span class=\"cor vermelho\"><\/span>Vermelho<\/td><td>Emergente<\/td><td>0 min<\/td><td>Sala de emergência, com acionamento de sinal, cuidado imediato<\/td><\/tr>\n<tr><td><span class=\"cor laranja\"><\/span>Laranja<\/td><td>Muito urgente<\/td><td>10 min<\/td><td>Equipe alerta (sem sinal sonoro), sala de emergência ou unidade intermediária<\/td><\/tr>\n<tr><td><span class=\"cor amarelo\"><\/span>Amarelo<\/td><td>Urgente<\/td><td>60 min<\/td><td>Sala de espera priorizada, sentado, supervisão contínua, reavaliação a cada 30 min<\/td><\/tr>\n<tr><td><span class=\"cor verde\"><\/span>Verde<\/td><td>Pouco urgente<\/td><td>120 min<\/td><td>Sala de espera comum, atendido após vermelho/laranja/amarelo, reavaliado se o quadro mudar<\/td><\/tr>\n<tr><td><span class=\"cor azul\"><\/span>Azul<\/td><td>Não urgente<\/td><td>240 min<\/td><td>Encaminhado por documento escrito à Atenção Primária de referência ou resolvido pela equipe<\/td><\/tr>\n<\/table>\n<p>A diferença central é que o Manchester fixa um <strong>tempo-resposta máximo em minutos<\/strong> para cada cor; o Guia SMS/RJ não fixa minutos de espera por cor (só define a reavaliação do amarelo a cada 30 minutos), descrevendo em vez disso o destino e a conduta da equipe para cada prioridade.<\/p>", "fonte": "Protocolo de Manchester; Guia SMS/RJ (2021).", "flashcards": [{"f": "Manchester: tempos máximos por cor?", "v": "Vermelho <strong>0<\/strong>, laranja <strong>10<\/strong>, amarelo <strong>60<\/strong>, verde <strong>120<\/strong>, azul <strong>240<\/strong> minutos."}, {"f": "O Guia SMS/RJ fixa minutos de espera por cor?", "v": "<strong>Não.<\/strong> Só o Manchester fixa. O Guia descreve destino e conduta da equipe para cada prioridade."}, {"f": "Guia SMS/RJ: conduta para o amarelo?", "v": "Sala de espera priorizada, paciente sentado, supervisão contínua e <strong>reavaliação a cada 30 min<\/strong>."}, {"f": "Guia SMS/RJ: conduta para o azul?", "v": "Encaminhado por <strong>documento escrito<\/strong> à Atenção Primária de referência ou resolvido pela equipe."}], "multipla": [{"p": "Qual é o tempo-resposta máximo do Manchester para a prioridade verde (pouco urgente)?", "o": ["60 minutos", "240 minutos", "10 minutos", "120 minutos"], "c": 3, "e": "No Manchester, verde é 120 minutos; amarelo é 60 e azul é 240."}, {"p": "Qual a reavaliação prevista no Guia SMS/RJ para pacientes amarelos na sala de espera priorizada?", "o": ["A cada 30 minutos", "A cada 60 minutos", "A cada 10 minutos", "A cada 120 minutos"], "c": 0, "e": "O Guia define reavaliação do amarelo a cada 30 minutos, sem fixar minutos de espera por cor."}], "vf": [{"a": "O Guia SMS/RJ fixa 60 minutos de espera para o amarelo, como o Manchester.", "v": false, "e": "O Guia SMS/RJ não fixa minutos por cor; apenas define reavaliação do amarelo a cada 30 minutos."}, {"a": "Para o laranja, o Guia SMS/RJ prevê equipe alerta, sem sinal sonoro, e encaminhamento à sala de emergência ou unidade intermediária.", "v": true, "e": "Diferente do vermelho, o laranja não aciona sinal sonoro."}]}, {"id": "D0-5", "parte": 2, "bloco": "Classificação de Risco e Deterioração Clínica", "tema": "risco", "num": "5", "pergunta": "Descreva a avaliação primária em situações de múltiplas vítimas (critérios avaliados, categorias de prioridade e tempo por vítima). Em seguida, explique para que serve a avaliação secundária pelo TRTS, quais parâmetros ela considera e como a pontuação define a prioridade.", "resposta": "<p>A <strong>avaliação primária<\/strong> em múltiplas vítimas, pelo Guia SMS/RJ, separa primeiro os menos graves (quem anda) e usa, em no máximo <strong>15 segundos<\/strong> por vítima: capacidade de <strong>andar<\/strong>, <strong>respiração<\/strong> (ausente por 10s mesmo após abrir a via aérea define óbito, competência médica; só após abertura da via aérea é vermelho), <strong>frequência respiratória<\/strong> (&gt;29 ou &lt;10 irpm é vermelho) e <strong>perfusão<\/strong> (TEC &gt;2s, ou pulso &gt;120/min se a perfusão não puder ser medida, é vermelho). Resulta em três categorias: <span class=\"cor verde\"><\/span>verde (anda), <span class=\"cor vermelho\"><\/span>vermelho (crítico) e <span class=\"cor amarelo\"><\/span>amarelo (os demais, dentro dos parâmetros).<\/p>\n<p>A avaliação secundária pelo <strong>TRTS (Triage Revised Trauma Score)<\/strong> serve para <strong>reavaliar<\/strong> as vítimas já separadas na avaliação primária, de forma fisiológica mais refinada. Soma três parâmetros codificados de 0 a 4 cada: <strong>frequência respiratória<\/strong>, <strong>pressão arterial sistólica<\/strong> e <strong>Escala de Coma de Glasgow<\/strong>, totalizando um escore de 0 a 12.<\/p>\n<table class=\"t\">\n<tr><th>TRTS<\/th><th>Prioridade<\/th><\/tr>\n<tr><td>1 a 10<\/td><td>Prioridade 1 (vermelho)<\/td><\/tr>\n<tr><td>11<\/td><td>Prioridade 2 (amarelo)<\/td><\/tr>\n<tr><td>12<\/td><td>Prioridade 3 (verde)<\/td><\/tr>\n<tr><td>0<\/td><td>Prioridade 4<\/td><\/tr>\n<\/table>", "fonte": "Guia SMS/RJ (2021).", "flashcards": [{"f": "Avaliação primária de múltiplas vítimas (Guia SMS/RJ): tempo por vítima e categorias?", "v": "No máximo <strong>15 segundos<\/strong> por vítima; três categorias: verde (anda), vermelho (crítico) e amarelo (demais)."}, {"f": "Pontos de corte da avaliação primária para vermelho?", "v": "FR <strong>maior que 29 ou menor que 10<\/strong> irpm; perfusão com TEC <strong>maior que 2 s<\/strong> (ou pulso maior que 120/min se não mensurável)."}, {"f": "Para que serve o TRTS e o que ele soma?", "v": "<strong>Reavalia<\/strong> vítimas já separadas. Soma FR, pressão arterial sistólica e Glasgow, cada um de 0 a 4, total de 0 a 12."}, {"f": "TRTS: como a pontuação define a prioridade?", "v": "<strong>1 a 10<\/strong>: prioridade 1 (vermelho). <strong>11<\/strong>: prioridade 2 (amarelo). <strong>12<\/strong>: prioridade 3 (verde). <strong>0<\/strong>: prioridade 4."}], "multipla": [{"p": "Qual conjunto de parâmetros compõe o TRTS?", "o": ["FR, pressão arterial sistólica e Escala de Coma de Glasgow", "FR, perfusão e capacidade de andar", "Saturação, temperatura e Glasgow", "Pulso, TEC e estado mental"], "c": 0, "e": "O TRTS codifica de 0 a 4 a frequência respiratória, a PA sistólica e a Glasgow."}, {"p": "Uma vítima obtém TRTS de 11. Qual a prioridade?", "o": ["Prioridade 1 (vermelho)", "Prioridade 3 (verde)", "Prioridade 4", "Prioridade 2 (amarelo)"], "c": 3, "e": "TRTS 11 corresponde à prioridade 2 (amarelo); 1 a 10 é prioridade 1 e 12 é prioridade 3."}], "vf": [{"a": "Na avaliação primária do Guia SMS/RJ, a FR maior que 30 irpm define vermelho.", "v": false, "e": "O ponto de corte do Guia é FR maior que 29 ou menor que 10 irpm."}, {"a": "O TRTS pontua de 0 a 12, e um escore de 12 corresponde à prioridade 3 (verde).", "v": true, "e": "Escore 12 é prioridade 3; 11 é prioridade 2; 1 a 10 é prioridade 1."}]}, {"id": "D0-6", "parte": 2, "bloco": "Classificação de Risco e Deterioração Clínica", "tema": "risco", "num": "6", "pergunta": "Descreva a pontuação de cada componente da Escala de Coma de Glasgow, informando os valores máximo e mínimo do escore. O que significa a pontuação 8 na prática clínica?", "resposta": "<table class=\"t\">\n<tr><th>Componente<\/th><th>Pontuação<\/th><\/tr>\n<tr><td>Abertura ocular<\/td><td>1 a 4<\/td><\/tr>\n<tr><td>Resposta verbal<\/td><td>1 a 5<\/td><\/tr>\n<tr><td>Resposta motora<\/td><td>1 a 6<\/td><\/tr>\n<\/table>\n<p>O escore total varia de <strong>3 (mínimo)<\/strong> a <strong>15 (máximo)<\/strong>. Uma pontuação de <strong>8<\/strong> indica <strong>coma<\/strong> e é o marco clássico para considerar via aérea avançada (proteção de vias aéreas), pelo risco de rebaixamento importante do nível de consciência.<\/p>\n<div class=\"dica\">A resposta pupilar (ECG-P) pode ser somada como componente adicional em algumas versões atuais da escala, refinando a avaliação neurológica.<\/div>", "fonte": "Escala de Coma de Glasgow.", "flashcards": [{"f": "Glasgow: pontuação de cada componente?", "v": "Abertura ocular <strong>1 a 4<\/strong>, resposta verbal <strong>1 a 5<\/strong>, resposta motora <strong>1 a 6<\/strong>."}, {"f": "Glasgow: escore mínimo e máximo?", "v": "Mínimo <strong>3<\/strong>, máximo <strong>15<\/strong>."}, {"f": "O que significa Glasgow 8 na prática?", "v": "Indica <strong>coma<\/strong> e é o marco clássico para considerar <strong>via aérea avançada<\/strong>."}, {"f": "O que é a ECG-P?", "v": "Versão em que a <strong>resposta pupilar<\/strong> é somada como componente adicional, refinando a avaliação neurológica."}], "multipla": [{"p": "Qual é a faixa de pontuação do escore total da Escala de Coma de Glasgow?", "o": ["0 a 15", "3 a 15", "1 a 12", "3 a 18"], "c": 1, "e": "O mínimo é 3 (1+1+1) e o máximo é 15 (4+5+6)."}, {"p": "Paciente com Glasgow 8. Qual a leitura clínica clássica?", "o": ["Consciência preservada, apenas observação", "Rebaixamento leve, sem necessidade de vigilância", "Ausência de resposta motora isolada", "Coma, com marco para considerar via aérea avançada"], "c": 3, "e": "Glasgow 8 indica coma e é o marco clássico para proteção de vias aéreas."}], "vf": [{"a": "A resposta verbal da Glasgow pontua de 1 a 6.", "v": false, "e": "A resposta verbal vai de 1 a 5; é a resposta motora que vai de 1 a 6."}, {"a": "O escore mínimo da Escala de Coma de Glasgow é 3, e não 0.", "v": true, "e": "Cada componente tem no mínimo 1 ponto, então o menor total é 3."}]}, {"id": "D0-7", "parte": 2, "bloco": "Classificação de Risco e Deterioração Clínica", "tema": "risco", "num": "7", "pergunta": "Descreva as etapas do fluxo de atendimento do usuário nas unidades de urgência e emergência da SMS/RJ, do registro à continuidade do cuidado. Explique por que o atendimento não é feito por ordem de chegada e qual é o significado clínico de cada uma das cinco cores de prioridade.", "resposta": "<p>O fluxo é: <strong>acolhimento<\/strong> pela portaria/recepção, <strong>registro<\/strong> do usuário após a identificação, <strong>encaminhamento<\/strong> ao espaço definido pelo fluxo do serviço, <strong>classificação de risco<\/strong> pelo enfermeiro (escuta qualificada, sinais vitais e protocolo), <strong>encaminhamento pela cor<\/strong> definida (sala de emergência, unidade intermediária, sala de espera priorizada ou comum, ou documento de referência à Atenção Primária), e <strong>continuidade do cuidado<\/strong> na rede de atenção à saúde.<\/p>\n<p>Não é por ordem de chegada porque a classificação de risco organiza a fila e os fluxos pelo <strong>potencial de gravidade, risco de agravamento, maior sofrimento e maior vulnerabilidade<\/strong> dos usuários, para priorizar quem corre risco de morte e informar aos demais o tempo provável de espera.<\/p>\n<table class=\"t\">\n<tr><th>Cor<\/th><th>Significado clínico<\/th><\/tr>\n<tr><td><span class=\"cor vermelho\"><\/span>Vermelho<\/td><td>Risco iminente de morte<\/td><\/tr>\n<tr><td><span class=\"cor laranja\"><\/span>Laranja<\/td><td>Risco importante, alto potencial de agravamento<\/td><\/tr>\n<tr><td><span class=\"cor amarelo\"><\/span>Amarelo<\/td><td>Urgência moderada<\/td><\/tr>\n<tr><td><span class=\"cor verde\"><\/span>Verde<\/td><td>Baixo risco de agravamento<\/td><\/tr>\n<tr><td><span class=\"cor azul\"><\/span>Azul<\/td><td>Não urgente, sem risco<\/td><\/tr>\n<\/table>", "fonte": "Guia SMS/RJ (2021).", "flashcards": [{"f": "Fluxo de atendimento nas unidades de urgência e emergência da SMS/RJ?", "v": "Acolhimento, registro, encaminhamento ao espaço do fluxo, <strong>classificação de risco<\/strong> pelo enfermeiro, encaminhamento pela cor e continuidade do cuidado na rede."}, {"f": "Por que o atendimento não é por ordem de chegada?", "v": "A fila segue <strong>gravidade, risco de agravamento, sofrimento e vulnerabilidade<\/strong>, priorizando quem corre risco de morte."}, {"f": "Significado clínico do vermelho e do laranja (SMS/RJ)?", "v": "Vermelho: <strong>risco iminente de morte<\/strong>. Laranja: risco importante, alto potencial de agravamento."}, {"f": "Significado clínico de amarelo, verde e azul (SMS/RJ)?", "v": "Amarelo: urgência moderada. Verde: baixo risco de agravamento. Azul: não urgente, sem risco."}], "multipla": [{"p": "No fluxo de urgência e emergência da SMS/RJ, quem realiza a classificação de risco após o registro e o encaminhamento ao espaço definido?", "o": ["O porteiro, na recepção", "O médico plantonista", "O enfermeiro", "O técnico de enfermagem"], "c": 2, "e": "A classificação de risco é feita pelo enfermeiro, com escuta qualificada, sinais vitais e protocolo."}, {"p": "Qual cor indica risco iminente de morte no Guia SMS/RJ?", "o": ["Vermelho", "Laranja", "Amarelo", "Verde"], "c": 0, "e": "Vermelho é risco iminente de morte; laranja é risco importante com alto potencial de agravamento."}], "vf": [{"a": "A classificação de risco organiza a fila por ordem de chegada, informando o tempo provável de espera.", "v": false, "e": "Ela organiza a fila por gravidade e potencial de agravamento, não por ordem de chegada."}, {"a": "No fluxo da SMS/RJ, o encaminhamento pela cor ocorre depois da classificação de risco.", "v": true, "e": "Primeiro o enfermeiro classifica; depois o usuário é encaminhado conforme a cor definida."}]}, {"id": "D1-1", "parte": 3, "bloco": "Classificação de Risco e Sinais de Deterioração Clínica", "tema": "risco", "num": "1", "pergunta": "Explique a finalidade da classificação de risco nos serviços de urgência e emergência e, com base na resolução COFEN 661/2021, explique os principais aspectos normatizados sobre a atuação do enfermeiro na classificação de risco.", "resposta": "<p>A classificação de risco organiza a fila de atendimento por <strong>gravidade e potencial de agravamento<\/strong>, e não por ordem de chegada, priorizando quem tem risco maior de morte ou sofrimento.<\/p>\n<p>A Resolução COFEN 661/2021 normatiza que a classificação de risco e a priorização da assistência são atividade <strong>privativa do enfermeiro<\/strong> dentro da equipe de enfermagem; que ele não deve exercer outra atividade simultaneamente durante a classificação; e exige <strong>capacitação específica<\/strong> no protocolo adotado pela instituição, além de ambiente e equipamentos adequados.<\/p>\n<\/div>\n<div class=\"dica\">A Resolução 661/2021 revogou a Resolução COFEN 423/2012 e, até onde foi possível confirmar, continua vigente; a bibliografia do estudo também cita a Resolução COFEN 736/2024, que trata da implementação do Processo de Enfermagem em geral (não é específica de classificação de risco, mas reforça o uso de protocolos e escalas de avaliação de risco validados como parte da Avaliação de Enfermagem).", "fonte": "Resolução COFEN 661/2021; Resolução COFEN 736/2024.", "flashcards": [{"f": "Finalidade da classificação de risco nos serviços de urgência e emergência?", "v": "Organizar a fila por <strong>gravidade e potencial de agravamento<\/strong>, e não por ordem de chegada."}, {"f": "Resolução COFEN 661/2021: quem executa a classificação de risco?", "v": "Atividade <strong>privativa do enfermeiro<\/strong> dentro da equipe de enfermagem."}, {"f": "COFEN 661/2021: exigências para o enfermeiro classificador?", "v": "<strong>Capacitação específica<\/strong> no protocolo da instituição, sem outra atividade simultânea, com ambiente e equipamentos adequados."}, {"f": "Resolução COFEN 736/2024 trata de classificação de risco?", "v": "<strong>Não.<\/strong> Trata do Processo de Enfermagem em geral, reforçando protocolos e escalas de risco validados."}], "multipla": [{"p": "Qual resolução COFEN normatiza especificamente a atuação do enfermeiro na classificação de risco?", "o": ["Resolução COFEN 736/2024", "Resolução COFEN 661/2021", "Parecer COFEN 44/2023", "Resolução COFEN 423/2012, em vigor"], "c": 1, "e": "A 661/2021 é a específica; ela revogou a 423/2012, e a 736/2024 trata do Processo de Enfermagem em geral."}, {"p": "Segundo a Resolução COFEN 661/2021, o enfermeiro classificador deve:", "o": ["Acumular outras atividades para agilizar o serviço", "Delegar a classificação ao técnico de enfermagem", "Atuar sem exigência de capacitação prévia", "Ter capacitação específica e não exercer outra atividade simultânea"], "c": 3, "e": "A norma exige capacitação no protocolo adotado e proíbe outra atividade simultân   const isFc=q.type==='fc';
  const front=isFc?q.f:q.item.pergunta;
  let h=tagOf(q.item.tema)+`<p class="qtext">${front}</p>`;
  if(!s.revealed)return h+`<button class="btn" data-act="reveal" data-m="${s.mode}">${isFc?'Virar cartão':'Mostrar resposta modelo'}</button>`;
  h+=isFc?`<div class="fb"><div class="big">${q.v}</div></div>`:ans(q.item);
  h+=isFc?`<div class="grade" style="grid-template-columns:1fr 1fr"><button class="btn g-err" data-act="rgrade" data-m="${s.mode}" data-g="err">Errei</button><button class="btn g-ok" data-act="rgrade" data-m="${s.mode}" data-g="ok">Acertei</button></div>`
    :`<div class="grade"><button class="btn g-err" data-act="rgrade" data-m="${s.mode}" data-g="nao">Não sabia</button><button class="btn g-part" data-act="rgrade" data-m="${s.mode}" data-g="parcial">Parcial</button><button class="btn g-ok" data-act="rgrade" data-m="${s.mode}" data-g="sabia">Sabia</button></div>`;
  return h;
}
function chosenText(r){return r.chosen!=null&&r.q.opts?r.q.opts[r.chosen]:'-'}
function wrongItem(r){
  const q=r.q;
  if(q.type==='fc')return `<div class="wr"><p class="wq">${q.f}</p><div class="ex">${q.v}</div></div>`;
  if(q.type==='dis')return `<div class="wr"><p class="wq">${q.item.pergunta}</p><details class="mini"><summary>Ver resposta modelo</summary>${ans(q.item)}</details></div>`;
  return `<div class="wr"><p class="wq">${q.text}</p><p class="ex">Você marcou: <strong>${chosenText(r)}</strong>. Correta: <strong>${q.opts[q.c]}</strong>.</p><div class="ex">${q.exp||''}</div><details class="mini"><summary>Ver resposta completa</summary>${ans(q.item)}</details></div>`;
}
function result(s){
  const n=s.res.length,ok=s.res.filter(r=>r.ok).length,p=n?Math.round(100*ok/n):0,wrong=s.res.filter(r=>!r.ok);
  let h=`<div class="score"><span class="mono">${s.mode==='sim'?p+'%':ok+'/'+n}</span><span>${s.mode==='sim'?ok+' de '+n+' acertos em '+fmt(s.elapsed):p+'% de acertos'}${s.mode==='vf'?'<br>Melhor sequência geral: '+P.best:''}</span></div>`;
  if(s.mode==='sim'){
    const by={};
    s.res.forEach(r=>{const t=r.q.item.tema;(by[t]=by[t]||{a:0,n:0});by[t].n++;if(r.ok)by[t].a++});
    h+=`<h2 class="sec">Desempenho por tema</h2>`+Object.keys(by).map(t=>{const b=by[t],pp=Math.round(100*b.a/b.n);return `<div class="trow" style="--c:var(--c-${t})"><span class="tn">${TN[t]||t}</span><span class="mono tc">${b.a}/${b.n}</span><div class="bar"><i style="width:${pp}%"></i></div><span class="mono tp">${pp}%</span></div>`}).join('');
  }
  h+=wrong.length?`<h2 class="sec">Para revisar <small>${wrong.length} ${wrong.length>1?'itens':'item'}</small></h2>`+wrong.map(wrongItem).join(''):`<div class="fb"><strong class="h">Sem erros nesta rodada.</strong></div>`;
  h+=`<div class="next"><button class="btn" data-act="again" data-m="${s.mode}">${s.mode==='sim'?'Novo simulado':s.mode==='rev'?'Voltar':'Nova rodada'}</button></div>`;
  return h;
}
function finish(s){
  s.done=true;s.elapsed=Date.now()-s.t0;
  if(s.mode==='sim')s.res.forEach(r=>record(r.q,r.ok));
}
function advance(s){
  s.i++;s.sel=null;s.revealed=false;
  if(s.i>=s.list.length)finish(s);
  window.scrollTo(0,0);
}

/* ---------- telas ---------- */
const V={};
V.inicio=()=>{
  const pl=pools(),all=prog(DATA);
  const chips=`<button class="chip" data-act="chip" data-t="all" aria-pressed="${!P.themes.length}">Todos</button>`+
    Object.keys(TN).map(t=>`<button class="chip" data-act="chip" data-t="${t}" style="--c:var(--c-${t})" aria-pressed="${P.themes.includes(t)}"><i></i>${TN[t]}</button>`).join('');
  const rows=Object.keys(TN).map(t=>{
    const its=DATA.filter(x=>x.tema===t);if(!its.length)return '';
    const p=prog(its);
    return `<div class="trow" style="--c:var(--c-${t})"><span class="tn">${TN[t]}</span><span class="mono tc">${its.length} perg.</span><div class="bar"><i style="width:${p.pct}%"></i></div><span class="mono tp">${p.pct}%</span></div>`;
  }).join('');
  const er=errs(pl).length;
  const T=[['flashcards','Flashcards',pl.fc.length+' cartões'],['multipla','Múltipla escolha',pl.mc.length+' questões'],['vf','Verdadeiro ou Falso',pl.vf.length+' afirmações'],['dissertativa','Dissertativa',pl.dis.length+' perguntas'],['simulado','Simulado',Math.min(20,pl.mc.length+pl.vf.length)+' itens cronometrados'],['erros','Revisar erros',er+' pendentes'],['material','Material',pl.its.length+' respostas']];
  const tiles=T.map(t=>`<a class="tile ${t[0]==='erros'&&er?'warn':''}" href="#${t[0]}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t[0]]}</svg><b>${t[1]}</b><span class="mono">${t[2]}</span></a>`).join('');
  return `${saveFail?'<div class="warnbox">Este navegador não deixou salvar o progresso. Você pode estudar normalmente, mas ele some ao fechar.</div>':''}
  <div class="vh"><h1>Bom plantão, Carine</h1><p>Estudos dirigidos de Emergência e Cuidados Intensivos, ${DATA.length} perguntas.</p></div>
  <div class="hero"><span class="mono big">${all.pct}%</span><div style="flex:1"><small>Progresso geral (itens dominados)</small><div class="bar"><i style="width:${all.pct}%"></i></div></div></div>
  <h2 class="sec">Temas do estudo <small>filtra todos os modos</small></h2>
  <div class="chips">${chips}</div>
  <h2 class="sec">Modos</h2>
  <div class="tiles">${tiles}</div>
  <h2 class="sec">Progresso por tema</h2>
  <div>${rows||'<p>Sem dados carregados.</p>'}</div>
  <div class="reset">${S.confirm?'Apagar todo o progresso salvo? <button class="btn sm g-err" data-act="reset-yes">Sim, zerar</button> <button class="btn sm ghost" data-act="reset-no">Cancelar</button>':'<button class="link" data-act="reset-ask">Zerar progresso</button>'}</div>`;
};

function startFC(pl){
  const base=pl.fc.filter(e=>!S.fcOnly||P.fc[e.key]!=='ok');
  S.fc={queue:base.slice(),total:base.length,done:0,flip:false};
}
V.flashcards=()=>{
  const pl=pools();
  const h0=head('Flashcards','Vire, avalie, repita.');
  if(!pl.fc.length)return h0+empty('Ainda não há flashcards para os temas escolhidos.');
  if(!S.fc)startFC(pl);
  const f=S.fc,q=f.queue[0];
  const opt=`<div class="nav2"><button class="switch" data-act="fc-only" aria-pressed="${S.fcOnly}">Só os não dominados</button><button class="btn ghost sm" data-act="fc-shuffle">Embaralhar</button></div>`;
  const top=barHTML(`${f.done}/${f.total}`,f.total?Math.round(100*f.done/f.total):0);
  if(!q){
    return h0+top+`<div class="empty"><h2>${f.total?'Rodada concluída':'Tudo dominado'}</h2><p>${f.total?'Você dominou os '+f.total+' cartões desta fila.':'Não há cartões pendentes neste filtro.'}</p><button class="btn" data-act="fc-restart">Recomeçar</button></div>`+opt;
  }
  return h0+top+`<div class="fcw"><div class="card ${f.flip?'flipped':''}" data-act="fc-flip" role="button" tabindex="0" aria-label="Virar cartão"><div class="face front">${tagOf(q.item.tema)}<div class="big">${q.f}</div><span class="hint">Toque para virar (Espaço)</span></div><div class="face back"><span class="tag" style="--c:var(--accent)">Resposta</span><div class="big">${q.v}</div></div></div></div>
  <div class="grade"><button class="btn g-err" data-act="fc-grade" data-g="err" ${f.flip?'':'disabled'}>Errei</button><button class="btn g-part" data-act="fc-grade" data-g="part" ${f.flip?'':'disabled'}>Quase</button><button class="btn g-ok" data-act="fc-grade" data-g="ok" ${f.flip?'':'disabled'}>Acertei</button></div>
  <div class="nav2"><button class="btn ghost sm" data-act="fc-skip" data-d="-1">Anterior</button><button class="btn ghost sm" data-act="fc-skip" data-d="1">Pular</button></div>`+opt;
};

function quizView(mode,title,sub,pool,size,label){
  const h0=head(title,sub);
  if(!pool.length)return h0+empty('Ainda não há questões desse tipo para os temas escolhidos.');
  if(!S[mode]){
    const list=shuffle(pool).slice(0,size).map(mkQ);
    S[mode]=newSess(mode,list);
  }
  return h0+player(S[mode]);
}
V.multipla=()=>quizView('mc','Múltipla escolha','Rodadas de 10 questões.',pools().mc,10);
V.vf=()=>quizView('vf','Verdadeiro ou Falso','Rápido e com sequência de acertos.',pools().vf,15);

V.dissertativa=()=>{
  const pl=pools(),h0=head('Dissertativa','As perguntas originais dos estudos dirigidos.');
  if(!pl.dis.length)return h0+empty('Nenhuma pergunta para os temas escolhidos.');
  const d=S.dis;if(d.i>=pl.dis.length)d.i=0;
  const e=pl.dis[d.i],it=e.item,st=P.dis[it.id];
  const pillTxt={nao:'Não sabia',parcial:'Parcial',sabia:'Sabia'};
  let h=barHTML(`${d.i+1}/${pl.dis.length}`,Math.round(100*(d.i+1)/pl.dis.length))+
    `<div class="row">${tagOf(it.tema)}<span class="mono pill">Q${it.num}</span>${st?`<span class="pill st-${st}">${pillTxt[st]}</span>`:''}</div>
    <p class="qtext">${it.pergunta}</p>
    <label for="dtx" class="hint">Sua resposta (opcional, fica só nesta sessão)</label>
    <textarea id="dtx" placeholder="Escreva com suas palavras antes de conferir...">${(d.text[it.id]||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea>`;
  if(!d.shown)h+=`<button class="btn" data-act="d-show">Mostrar resposta modelo</button>`;
  else h+=ans(it)+`<p><strong>Como você foi?</strong></p><div class="grade"><button class="btn g-err" data-act="d-grade" data-g="nao">Não sabia</button><button class="btn g-part" data-act="d-grade" data-g="parcial">Parcial</button><button class="btn g-ok" data-act="d-grade" data-g="sabia">Sabia</button></div>`;
  h+=`<div class="nav2"><button class="btn ghost sm" data-act="d-nav" data-d="-1">Anterior</button><button class="btn ghost sm" data-act="d-nav" data-d="1">Próxima</button></div>`;
  return h0+h;
};

V.simulado=()=>{
  const pl=pools(),h0=head('Simulado','20 itens, sem feedback até o fim.');
  const pool=pl.mc.concat(pl.vf);
  if(!pool.length)return h0+empty('Ainda não há questões para montar um simulado com esses temas.');
  if(!S.sim)return h0+`<div class="empty"><p>Mistura de múltipla escolha e V ou F com <strong>${Math.min(20,pool.length)}</strong> itens. O cronômetro começa ao iniciar.</p><button class="btn" data-act="sim-start">Iniciar simulado</button></div>`;
  return h0+player(S.sim);
};

V.erros=()=>{
  const pl=pools(),h0=head('Revisar erros','O que você errou em qualquer modo.');
  if(S.rev)return h0+player(S.rev);
  const er=errs(pl);
  if(!er.length)return h0+`<div class="empty"><p>Nenhum erro pendente. Bom sinal.</p><a class="btn ghost" href="#multipla">Praticar</a></div>`;
  const c=k=>er.filter(e=>e.type===k).length;
  return h0+`<div class="empty"><p><span class="mono big">${er.length}</span> itens para refazer: ${c('fc')} flashcards, ${c('mc')} múltipla, ${c('vf')} V ou F, ${c('dis')} dissertativas.</p><p class="hint">Ao acertar, o item sai da lista.</p><button class="btn" data-act="rev-start">Refazer agora</button></div>`;
};

function matList(){
  const q=norm(S.mat.q.trim()),pl=pools();
  const its=pl.its.filter(it=>!q||norm(it.pergunta+' '+strip(it.resposta)+' '+it.bloco).includes(q));
  if(!its.length)return '<div class="empty"><p>Nada encontrado para essa busca.</p></div>';
  const open=q&&its.length<=8;
  let h='',lastP=null,lastB=null;
  its.forEach(it=>{
    if(it.parte!==lastP||it.bloco!==lastB){
      const n=its.filter(x=>x.parte===it.parte&&x.bloco===it.bloco).length;
      h+=`<h3 class="grp">Parte ${it.parte}, ${PARTES[it.parte]||''}: ${it.bloco}<small>${n}</small></h3>`;
      lastP=it.parte;lastB=it.bloco;
    }
    h+=`<details class="acc" ${open?'open':''}><summary><span class="mono">Q${it.num}</span><span>${it.pergunta}</span></summary>${ans(it)}</details>`;
  });
  return h;
}
V.material=()=>{
  const v=S.mat.q.replace(/"/g,'&quot;');
  return head('Material','Todas as perguntas com a resposta completa.')+`<input type="search" id="mq" placeholder="Buscar por palavra (sem acento)" value="${v}" aria-label="Buscar no material"><div id="matlist">${matList()}</div>`;
};

/* ---------- renderização ---------- */
const route=()=>{const h=(location.hash||'').slice(1);return ROUTES.some(r=>r[0]===h)?h:'inicio'};
function buildRail(){
  $('#rail').innerHTML=ROUTES.map(r=>`<a href="#${r[0]}" data-r="${r[0]}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[r[0]]}</svg><span>${r[1]}</span></a>`).join('');
}
function render(){
  clearInterval(S.tick);
  const r=route();
  $('#view').innerHTML=V[r]();
  $$('#rail a').forEach(a=>{if(a.dataset.r===r){a.setAttribute('aria-current','page');try{a.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}else a.removeAttribute('aria-current')});
  const all=prog(DATA);
  $('#rdP').textContent=all.pct+'%';
  $('#rdE').textContent=errs(pools()).length;
  const s=S.sim;
  if(r==='simulado'&&s&&!s.done)S.tick=setInterval(()=>{const el=$('#tm');if(el)el.textContent=fmt(Date.now()-s.t0)},1000);
  if(S.scrollFb){const fb=$('.fb');if(fb)fb.scrollIntoView({block:'nearest'});S.scrollFb=false}
}

/* ---------- ações ---------- */
const A={
  chip(d){
    if(d.t==='all')P.themes=[];
    else{const i=P.themes.indexOf(d.t);if(i>=0)P.themes.splice(i,1);else P.themes.push(d.t);if(P.themes.length===Object.keys(TN).length)P.themes=[]}
    save();resetSessions();render();
  },
  'reset-ask'(){S.confirm=true;render()},
  'reset-no'(){S.confirm=false;render()},
  'reset-yes'(){const th=P.themes;P={fc:{},mc:{},vf:{},dis:{},best:0,themes:th};save();resetSessions();S.confirm=false;render()},
  'fc-flip'(){
    const c=$('.card');if(!c||!S.fc||!S.fc.queue.length)return;
    S.fc.flip=c.classList.toggle('flipped');
    $$('.grade button').forEach(b=>{b.disabled=!S.fc.flip});
  },
  'fc-grade'(d){
    const f=S.fc,q=f.queue.shift();if(!q)return;
    if(d.g==='ok'){P.fc[q.key]='ok';f.done++}
    else if(d.g==='part'){P.fc[q.key]='part';f.queue.splice(Math.min(3,f.queue.length),0,q)}
    else{P.fc[q.key]='err';f.queue.push(q)}
    f.flip=false;save();render();
  },
  'fc-skip'(d){
    const f=S.fc;if(!f||f.queue.length<2)return;
    if(d.d==='1')f.queue.push(f.queue.shift());else f.queue.unshift(f.queue.pop());
    f.flip=false;render();
  },
  'fc-shuffle'(){if(S.fc){S.fc.queue=shuffle(S.fc.queue);S.fc.flip=false;render()}},
  'fc-only'(){S.fcOnly=!S.fcOnly;S.fc=null;render()},
  'fc-restart'(){S.fc=null;render()},
  opt(d){
    const s=S[d.m],q=s.list[s.i],i=+d.i;
    if(s.mode==='sim'){s.sel=i;render();return}
    if(s.sel!=null)return;
    s.sel=i;const ok=i===q.c;
    s.res.push({q,ok,chosen:i});record(q,ok);
    if(s.mode==='vf'){s.streak=ok?s.streak+1:0;if(s.streak>P.best){P.best=s.streak;save()}}
    S.scrollFb=true;render();
  },
  next(d){
    const s=S[d.m];
    if(s.mode==='sim'&&s.sel!=null)s.res.push({q:s.list[s.i],ok:s.sel===s.list[s.i].c,chosen:s.sel});
    advance(s);render();
  },
  again(d){
    if(d.m==='sim')S.sim=null;else if(d.m==='rev')S.rev=null;else S[d.m]=null;
    window.scrollTo(0,0);render();
  },
  'sim-start'(){
    const pl=pools();
    S.sim=newSess('sim',shuffle(pl.mc.concat(pl.vf)).slice(0,20).map(mkQ));render();
  },
  'rev-start'(){
    S.rev=newSess('rev',shuffle(errs(pools())).map(e=>(e.type==='mc'||e.type==='vf')?mkQ(e):e));render();
  },
  reveal(d){S[d.m].revealed=true;render()},
  rgrade(d){
    const s=S[d.m],q=s.list[s.i];let ok;
    if(q.type==='fc'){P.fc[q.key]=d.g;ok=d.g==='ok'}
    else{P.dis[q.item.id]=d.g;ok=d.g!=='nao'}
    save();s.res.push({q,ok});advance(s);render();
  },
  'd-show'(){S.dis.shown=true;render()},
  'd-grade'(d){
    const pl=pools(),e=pl.dis[S.dis.i];
    P.dis[e.item.id]=d.g;save();
    if(S.dis.i<pl.dis.length-1){S.dis.i++;S.dis.shown=false;window.scrollTo(0,0)}
    render();
  },
  'd-nav'(d){
    const n=pools().dis.length;
    S.dis.i=(S.dis.i+(+d.d)+n)%n;S.dis.shown=false;window.scrollTo(0,0);render();
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const f=A[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('input',e=>{
  if(e.target.id==='mq'){S.mat.q=e.target.value;$('#matlist').innerHTML=matList()}
  else if(e.target.id==='dtx'){const p=pools().dis[S.dis.i];if(p)S.dis.text[p.item.id]=e.target.value}
});
document.addEventListener('keydown',e=>{
  if(route()!=='flashcards'||!S.fc||!S.fc.queue.length)return;
  const t=e.target.tagName;
  if(t==='TEXTAREA'||t==='INPUT')return;
  if((e.key===' '||e.key==='Enter')&&t!=='BUTTON'){e.preventDefault();A['fc-flip']()}
  else if(e.key==='ArrowRight'){A['fc-skip']({d:'1'})}
  else if(e.key==='ArrowLeft'){A['fc-skip']({d:'-1'})}
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
buildRail();render();
})();
</script>

</body>
</html>
